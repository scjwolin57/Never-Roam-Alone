# ---------------------------------------------------------------------
# Security headers (sent with every page).
# In plain English:
#  - HSTS: browsers must always use the encrypted (https) connection.
#  - nosniff: browsers can't second-guess file types (blocks a class of attacks).
#  - X-Frame-Options / frame-ancestors: no other site can embed ours in a
#    hidden frame to trick users into clicking things (clickjacking).
#  - Referrer-Policy: other sites we link to only learn our domain, not the
#    full page address the visitor came from.
#  - Permissions-Policy: the site declares it never uses camera/mic/location.
#  - Content-Security-Policy: an allowlist of exactly which outside services
#    the browser may load code, images, fonts, and data from. Anything not
#    listed is blocked — the main defense against injected malicious code.
#    If a new external service is ever added to the site, its address must
#    be added here too, or the browser will block it (check the console).
# ---------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # >>> PRE-LAUNCH: keeps the whole site out of Google until launch day.
    # >>> DELETE the next line when officially launching!
    X-Robots-Tag = "noindex"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # (Aug 2026: map/calendar/Supabase libraries + fonts are now self-hosted in
    #  /vendor and /fonts, so unpkg, cdnjs and Google Fonts were removed from the
    #  allowlist. cdn.jsdelivr.net stays in connect-src only — the visa tool and
    #  flight autocomplete still fetch two public datasets from it at runtime.)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://emrld.ltd https://*.emrld.ltd; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://oferixjdgwwjpstowqis.supabase.co https://picsum.photos https://fastly.picsum.photos https://images.unsplash.com https://plus.unsplash.com https://upload.wikimedia.org https://commons.wikimedia.org https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://emrld.ltd https://*.emrld.ltd; connect-src 'self' https://oferixjdgwwjpstowqis.supabase.co wss://oferixjdgwwjpstowqis.supabase.co https://cdn.jsdelivr.net https://photon.komoot.io https://overpass-api.de https://overpass.kumi.systems https://api.transitous.org https://open.er-api.com https://davidmegginson.github.io https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://emrld.ltd https://*.emrld.ltd https://api.mapbox.com https://events.mapbox.com; frame-src https://emrld.ltd https://*.emrld.ltd; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# ---------------------------------------------------------------------
# Browser caching (performance).
# In plain English: tells returning visitors' browsers "you already have
# this photo/font — don't download it again." Without these rules the
# browser re-checks every single image on every visit.
#  - Photos: kept for 7 days (if a photo is ever replaced under the SAME
#    filename, visitors may see the old one for up to a week — fine here,
#    since photos are added rather than replaced).
#  - Fonts: kept for a year (they never change).
# HTML and .js files are deliberately NOT cached this way, so code
# updates still reach everyone immediately after each deploy.
# ---------------------------------------------------------------------
[[headers]]
  for = "/images/*"
  [headers.values]
    # 30 days (PageSpeed flags shorter lifetimes; photos are added, not replaced)
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Self-hosted third-party libraries (filenames include the version number,
# so a new version means a new filename — safe to cache for a year).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Per-city guide data (citydata/<slug>.json). Kept for 1 hour — long enough
# that browsing several pages doesn't re-download the index, short enough
# that data fixes reach visitors the same day.
[[headers]]
  for = "/citydata/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
