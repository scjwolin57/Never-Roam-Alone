# Netlify configuration for Never Roam Alone
#
# The site is a folder of static HTML files served from the project root,
# plus serverless functions (flights, image, translate) in netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

# Ensure the functions run on Node 18+, where the global `fetch` used by the
# functions is available. (Older Node has no global fetch and they'd 502.)
[build.environment]
  NODE_VERSION = "18"

# Friendly path: /api/flights -> the serverless function
[[redirects]]
  from = "/api/flights"
  to = "/.netlify/functions/flights"
  status = 200

# ---------------------------------------------------------------------
# Keep non-site files off the public web.
#
# In plain English: `publish = "."` serves the whole project folder, so
# every tracked file that ISN'T part of the website — internal notes,
# spreadsheets, database setup scripts, the backend function source —
# was downloadable by anyone who guessed the filename. These rules make
# those paths return the normal 404 page instead.
#
# `force = true` is required: without it Netlify only applies a redirect
# when no real file exists, and these files DO exist.
#
# This does NOT affect the backend running. Functions are invoked at
# /.netlify/functions/* (note the leading dot — a different path) and
# edge functions are routed internally, so blocking /netlify/* hides
# only the source text, not the working endpoints.
#
# Already invisible without help, so not listed here: anything starting
# with a dot (.git, .env.example, .claude), netlify.toml itself, and
# anything in .gitignore (_guidebuild, _image-backups, _cities-staging)
# — Netlify deploys the git checkout, so ignored files never arrive.
#
# To expose a file again, delete its block below.
# ---------------------------------------------------------------------

# Backend source (functions keep working — see note above)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Build artifacts from the city-guide tooling
[[redirects]]
  from = "/outputs/*"
  to = "/404.html"
  status = 404
  force = true

# Internal working notes, review lists and data backups
[[redirects]]
  from = "/_needs-attention/*"
  to = "/404.html"
  status = 404
  force = true

# Loose non-site files in the project root (notes, spreadsheets, SQL
# setup scripts, data exports). Listed one by one because Netlify's
# redirect matching has no reliable "all files ending in .sql" pattern.
