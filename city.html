<title>Never Roam Alone — City</title>
<link rel="stylesheet" href="fonts/amatic-sc.css" />
<style>
  :root{
    --ink:#1d2a32;--muted:#5b6b75;--sand:#f6f1e7;--green:#185e3f;--teal:#0e7c86;
    --coral:#ef6f53;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--sand);line-height:1.65}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#c35237}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}

  /* Hero */
  .hero{position:relative;height:62vh;min-height:420px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;color:#fff}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,30,25,.15) 0%,rgba(10,30,25,.75) 100%)}
  .hero-inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;width:100%;padding:0 22px 40px}
  .crumb{font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#ffd9c9;margin-bottom:10px}
  .crumb a:hover{color:#fff}
  .hero h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:0;line-height:1.02;text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .hero .country{font-size:1.1rem;opacity:.95;margin-top:6px}
  .hero .tagline{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;margin:14px 0 0;max-width:640px}
  .chip{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);padding:8px 16px;border-radius:30px;margin-top:18px}
  .chip b{font-size:1.35rem}
  .chip span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.9}

  /* How long to stay — sits just above the temperature/facts grid */
  .stay-section{margin:0 0 30px}
  .stay-head{text-align:center;margin-bottom:22px}
  .stay-head h2{font-size:clamp(1.4rem,3.2vw,1.9rem);color:var(--green);margin:0}
  .stay-sub{color:var(--muted);font-size:.96rem;margin:8px auto 0;max-width:560px}
  .stay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .stay-card{background:var(--card);border:1px solid #e7e0d2;
    border-top:4px solid var(--teal);border-radius:16px;padding:22px 18px 24px;
    box-shadow:var(--shadow);text-align:center;transition:transform .18s,box-shadow .18s}
  .stay-card:nth-child(1){border-top-color:#8bbf9f}
  .stay-card:nth-child(2){border-top-color:var(--teal)}
  .stay-card:nth-child(3){border-top-color:var(--green)}
  .stay-card:nth-child(4){border-top-color:var(--coral)}
  .stay-card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,40,50,.16)}
  .stay-days{font-size:1rem;color:var(--ink);margin-bottom:8px}
  .stay-days b{font-size:1.8rem;color:var(--green);font-weight:800}
  .stay-days span{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .stay-label{font-weight:700;font-size:1.05rem;color:var(--ink);margin-bottom:6px}
  .stay-blurb{font-size:.85rem;color:var(--muted);line-height:1.45}
  @media(max-width:820px){.stay-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:460px){.stay-grid{grid-template-columns:1fr}}

  section{max-width:var(--maxw);margin:0 auto;padding:54px 22px}
  .lead{font-size:1.15rem;color:var(--ink);max-width:760px}
  .muted{color:var(--muted)}
  .placeholder-note{background:#fff6ef;border:1px dashed var(--coral);color:#a24a34;
    border-radius:12px;padding:12px 16px;font-size:.86rem;margin-top:20px}

  /* Facts grid — 3 columns for the stat cards, temp card spans full row */
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
  .fact{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
  .fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:700}
  .fact .v{font-size:1.25rem;font-family:Georgia,serif;margin-top:6px}

  /* Combined population + visitors card */
  .stat-combo .sc-top{display:flex}
  .stat-combo .sc-top .sc-item{flex:1;min-width:0}
  .stat-combo .sc-top .sc-item + .sc-item{padding-left:16px;border-left:1px solid rgba(0,0,0,.07)}
  .sc-metrics{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.07)}
  .sc-metrics .ratio-line:first-child{margin-top:0}
  .ratio-line{margin-top:6px;font-size:.82rem;color:var(--muted)}
  .ratio-line b{font-family:Georgia,serif;font-weight:700}
  .idx-link{font-family:Georgia,serif;font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .stat-disclaimer{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(0,0,0,.07);
    font-size:.7rem;line-height:1.4;color:var(--muted)}

  /* Emergency + embassy card */
  .emrg{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .emrg-row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
  .emrg-k{color:var(--muted)}
  .emrg-v{font-family:Georgia,serif;font-weight:700}
  .emrg-v a{color:var(--ink)}
  .emrg-note{font-size:.76rem;color:var(--muted);font-style:italic}
  .embassy{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07)}
  .embassy-k{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin-bottom:8px}
  .embassy select{width:100%;padding:9px 10px;border:2px solid rgba(24,94,63,.2);border-radius:10px;
    background:#fff;font-family:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
  .embassy select:focus{outline:none;border-color:var(--green)}
  .embassy-hint{margin:10px 0 0;font-size:.8rem;color:var(--muted);font-style:italic}
  .embassy-link{display:inline-block;margin-top:10px;color:var(--green);font-weight:700;font-size:.85rem}

  /* Language card */
  .lang-list{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .lang-row{display:flex;align-items:center;gap:10px}
  .lang-name{font-size:.9rem;font-family:Georgia,serif;min-width:110px;flex-shrink:0}
  .lang-pct{font-size:.78rem;font-weight:700;color:var(--teal);min-width:38px;text-align:right;flex-shrink:0}
  .lang-bar-track{flex:1;height:5px;background:#eee;border-radius:4px;overflow:hidden}
  .lang-bar{height:100%;border-radius:4px;background:var(--teal);opacity:.75}
  .rel-section{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07)}
  .rel-section .rel-k{margin-bottom:8px}
  .rel-bar{background:var(--green)}
  .rel-pct{color:var(--green)}

  /* Temperature card */
  .fact-wide{grid-column:1/-1}
  .temp-rows{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:10px}
  .temp-row{padding:10px 14px 10px 0;border-right:1px solid rgba(0,0,0,.07)}
  .temp-row:last-child{border-right:none;padding-right:0}
  .temp-row:first-child{padding-left:0}
  .season-label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .season-name{font-weight:600;color:var(--teal)}
  .temp-val{display:block;font-family:Georgia,serif;font-size:1.1rem;font-weight:700;
    color:var(--ink);margin-bottom:4px}
  .rain-val{display:block;font-size:.76rem;color:var(--muted);margin-bottom:8px}
  .rain-val svg{vertical-align:-1px;margin-right:3px;color:#5aa7d8}
  .temp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .temp-foot{font-size:.74rem;color:var(--muted);font-style:italic}
  .temp-foot svg{vertical-align:-1px;margin-right:3px;color:#5aa7d8}
  .temp-bar-track{height:6px;background:#eee;border-radius:4px;overflow:hidden}
  .temp-bar{height:100%;border-radius:4px;transition:width .4s ease}

  /* Currency card + converter */
  .card-accept{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:10px;padding:10px 14px;
    background:var(--sand);border-radius:12px}
  .card-accept .ca-icon{flex-shrink:0;display:inline-flex;color:var(--green)}
  .card-accept .ca-text{flex:1 1 220px;min-width:0;font-size:.92rem;line-height:1.3}
  .card-accept .ca-pct{font-family:Georgia,serif;font-weight:700;font-size:1.15rem}
  .card-accept .ca-label{color:var(--muted)}
  .card-accept .ca-word{font-weight:700}
  .card-accept .ca-bar-track{flex:1 1 120px;min-width:90px;height:7px;background:#e7e0d2;border-radius:4px;overflow:hidden}
  .card-accept .ca-bar{height:100%;border-radius:4px;transition:width .4s ease}
  .cur-grid{display:grid;grid-template-columns:200px 1fr;gap:24px;margin-top:12px;align-items:stretch;min-width:0}
  .cur-grid > *{min-width:0}

  /* Cost cards */
  .cost-card{display:flex;flex-direction:column;min-width:0}
  .cost-icon{color:var(--teal);display:inline-flex;margin-bottom:8px}
  .cost-card .v{font-size:1.65rem;margin-top:2px}
  .cost-note{color:var(--muted);font-size:.76rem;margin-top:4px}
  .tip-line{display:flex;align-items:flex-start;gap:7px;margin-top:auto;padding-top:12px;
    border-top:1px solid rgba(0,0,0,.08);font-size:.8rem;color:var(--muted);line-height:1.35}
  .tip-line .tip-ic{flex-shrink:0;color:var(--teal);display:inline-flex;margin-top:1px}
  .tip-line b{font-weight:700}
  .hotel-tiers{display:flex;gap:18px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
  .hotel-tiers .ht{display:flex;flex-direction:column}
  .hotel-tiers .ht-k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .hotel-tiers .ht-v{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;margin-top:2px}
  .rides{margin-top:auto;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
  .rides-k{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:7px}
  .rides-list{display:flex;flex-wrap:wrap;gap:6px}
  .ride-chip{font-size:.74rem;font-weight:600;color:var(--green);background:rgba(24,94,63,.08);
    border:1px solid rgba(24,94,63,.18);border-radius:20px;padding:3px 10px}
  .rides-none{font-size:.8rem;color:var(--muted)}
  /* 4-up cost cards row */
  .cost-cards-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  /* Connectivity banner — full-width card above the cost cards */
  .net-banner{grid-column:1/-1;display:flex;flex-direction:column}
  .net-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .net-head .cost-icon{margin-bottom:0}
  .net-est{color:var(--muted);font-size:.72rem;font-style:italic}
  .esim-btn{margin-left:auto;background:var(--green);color:#fff;font-weight:700;font-size:.85rem;
    padding:8px 18px;border-radius:22px;text-decoration:none;white-space:nowrap}
  .esim-btn:hover{background:#134d33}
  .net-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:16px}
  .ns{min-width:0}
  .ns-v{font-family:Georgia,serif;font-weight:700;font-size:1.25rem;margin-top:3px}
  .ns-note{color:var(--muted);font-size:.76rem;margin-top:3px;line-height:1.35}
  .net-ops-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
  .net-ops-row .rides-k{margin-bottom:0}
  @media(max-width:1000px){.net-stats{grid-template-columns:repeat(3,1fr)}}
  .drinks-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .drink-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:.9rem;border-bottom:1px solid rgba(0,0,0,.06);padding-bottom:9px}
  .drink-row:last-child{border-bottom:none;padding-bottom:0}
  .drink-row .dr-k{color:var(--ink)}
  .drink-row .dr-v{font-family:Georgia,serif;font-weight:700;white-space:nowrap}
  .drink-row .alc-note{color:var(--coral);font-weight:700;font-size:.76rem;text-align:right;line-height:1.25}
  .drinks-foot{margin-top:10px;font-size:.7rem;font-style:italic;color:var(--muted)}

  /* Transportation section */
  .transport-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-top:6px}
  .tcard{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    cursor:pointer;transition:transform .2s, box-shadow .2s;min-width:0}
  .tcard:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,40,50,.16)}
  .tcard:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .tcard-more{margin-top:auto;padding-top:14px;font-size:.76rem;font-weight:700;color:var(--green)}
  .tcard-icon{color:var(--teal);display:inline-flex;margin-bottom:8px}
  .tcard-k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:700;margin-bottom:10px}
  .tcard-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .tcard-list li{font-size:.88rem;font-family:Georgia,serif;padding-left:14px;position:relative;line-height:1.3}
  .tcard-list li::before{content:"";position:absolute;left:0;top:.52em;width:5px;height:5px;border-radius:50%;background:var(--coral)}
  .tcard-none{font-size:.85rem;color:var(--muted);font-style:italic;margin:0}
  /* Public transit banner — full-width card below the transport cards */
  .transit-banner{margin-top:18px}
  .tr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tr-head .cost-icon{margin-bottom:0}
  .tr-map-btn{margin-left:auto;background:var(--green);color:#fff;font-weight:700;font-size:.85rem;
    padding:8px 18px;border-radius:22px;text-decoration:none;white-space:nowrap}
  .tr-map-btn:hover{background:#134d33}
  .tr-sys-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .tr-sys-row .rides-k{margin-bottom:0}
  .tr-chip{display:inline-flex;align-items:baseline;gap:7px;background:rgba(14,124,134,.1);color:var(--teal);
    font-weight:700;font-size:.82rem;padding:5px 13px;border-radius:16px}
  .tr-chip em{font-style:normal;font-weight:600;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;opacity:.75}
  .tr-note{margin:12px 0 0;font-size:.88rem;line-height:1.55}
  .tr-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}
  .tr-col p{margin:6px 0 0;font-size:.88rem;line-height:1.55}
  @media(max-width:760px){.tr-cols{grid-template-columns:1fr}}
  .car-info{display:flex;flex-direction:column;gap:9px}
  .car-row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;
    border-bottom:1px solid rgba(0,0,0,.06);padding-bottom:9px}
  .car-row:last-child{border-bottom:none;padding-bottom:0}
  .car-k{color:var(--muted)}
  .car-v{font-family:Georgia,serif;font-weight:700;text-align:right}

  /* More-info modal */
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,30,25,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:22px}
  .modal-overlay[hidden]{display:none}
  .modal-card{background:var(--card);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.35);
    max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:30px 30px 34px;position:relative}
  .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border:none;border-radius:50%;
    background:var(--sand);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;transition:background .2s}
  .modal-close:hover{background:#e7e0d2}
  .modal-title{font-size:1.55rem;margin:0 0 14px;padding-right:34px}
  .modal-body{color:var(--muted);line-height:1.6}
  .modal-placeholder{font-style:italic}
  /* Airport modal content */
  .air-name{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;color:var(--ink);margin:0 0 6px}
  .air-dist{display:flex;align-items:baseline;gap:9px;margin-bottom:18px}
  .air-dist-v{font-family:Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--green)}
  .air-dist-k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .air-sub{font-size:.95rem;margin:0 0 4px;color:var(--ink)}
  .air-rows{margin:0}
  .air-rows dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin-top:15px}
  .air-rows dd{margin:3px 0 0;font-size:.92rem;color:var(--ink)}
  .air-taxi-meta{font-size:.84rem;color:var(--muted)}
  .air-transit{margin:4px 0 0;padding-left:18px}
  .air-transit li{margin:2px 0}
  .air-transit b{font-weight:700}
  .air-link{color:var(--green);font-weight:700}
  .air-foot{margin-top:18px;font-size:.78rem;color:var(--muted);font-style:italic;
    border-top:1px solid rgba(0,0,0,.08);padding-top:12px}
  /* Train / bus / ferry route modal content */
  .rt-intro{margin:0 0 14px;font-size:.95rem;color:var(--ink)}
  .rt-sec-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);
    font-weight:700;margin:20px 0 8px}
  .rt-rows{display:flex;flex-direction:column;gap:8px}
  .rt-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 14px;
    background:var(--sand);border-radius:12px}
  .rt-to{font-weight:700;font-size:.92rem;color:var(--ink)}
  .rt-time{font-size:.78rem;color:var(--muted);white-space:nowrap}
  .rt-badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .rt-night{background:#2b3a67;color:#ffd97a}
  .rt-season{background:#e7e0d2;color:#7a6a45}
  .rt-op{margin-left:auto;color:var(--green);font-weight:700;font-size:.86rem;
    text-decoration:none;white-space:nowrap}
  .rt-op:hover{text-decoration:underline}
  .rt-search{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:4px;
    background:#fff;border:2px solid var(--green);border-radius:12px;color:var(--green);
    text-decoration:none;font-weight:700;font-size:.92rem;transition:background .2s,color .2s}
  .rt-search:hover{background:var(--green);color:#fff}
  .rt-search .rt-go{margin-left:auto}
  .rt-note{margin-top:16px;font-size:.85rem;line-height:1.5;color:var(--muted)}
  .rt-foot{margin-top:18px;font-size:.78rem;color:var(--muted);font-style:italic;
    border-top:1px solid rgba(0,0,0,.08);padding-top:12px}
  /* ATM & cash finder button + modal */
  .atm-btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin-top:2px;
    padding:10px 16px;border:2px solid var(--green);background:#fff;color:var(--green);
    font-family:inherit;font-weight:700;font-size:.9rem;border-radius:12px;cursor:pointer;transition:background .2s,color .2s}
  .atm-btn:hover{background:var(--green);color:#fff}
  .atm-btn svg{flex-shrink:0}
  .atm-intro{margin:0 0 16px;font-size:.95rem;color:var(--ink)}
  .atm-sec-k{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);
    font-weight:700;margin:20px 0 8px}
  .atm-links{display:flex;flex-direction:column;gap:10px}
  .atm-link{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--sand);
    border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;transition:background .2s}
  .atm-link:hover{background:#e7e0d2}
  .atm-link .atm-ic{flex-shrink:0;color:var(--green);display:inline-flex}
  .atm-link .atm-go{margin-left:auto;color:var(--green);font-weight:700}
  .atm-tips{margin:8px 0 0;padding:0;list-style:none}
  .atm-tips li{position:relative;padding-left:22px;margin:9px 0;font-size:.9rem;line-height:1.45;color:var(--ink)}
  .atm-tips li::before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;
    border-radius:50%;background:var(--green)}
  .atm-tips b{font-weight:700}
  .atm-foot{margin-top:20px;font-size:.78rem;color:var(--muted);font-style:italic;
    border-top:1px solid rgba(0,0,0,.08);padding-top:12px}
  .cur-local{background:var(--sand);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
  .cur-symbol{font-family:Georgia,serif;font-size:2.4rem;line-height:1;color:var(--green)}
  .cur-code{font-weight:700;letter-spacing:.06em;margin-top:8px;font-size:1.05rem}
  .cur-name{color:var(--muted);font-size:.86rem;margin-top:2px}
  .cur-conv{display:flex;flex-direction:column;justify-content:center;gap:12px}
  .conv-sub{font-size:.78rem;color:var(--muted);font-weight:600}
  .conv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .conv-field{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid rgba(24,94,63,.22);
    border-radius:12px;padding:10px 14px;flex:1;min-width:150px;overflow:hidden}
  .conv-field:focus-within{border-color:var(--green)}
  .conv-field input{border:none;outline:none;background:transparent;font-size:1.05rem;font-family:inherit;
    color:var(--ink);flex:1 1 auto;width:auto;min-width:48px}
  .conv-field .tag{font-weight:700;color:var(--teal);font-size:.9rem;flex-shrink:0}
  .conv-field select{border:none;outline:none;background:transparent;font-size:.9rem;font-weight:700;
    color:var(--teal);font-family:inherit;cursor:pointer;flex:0 1 auto;min-width:0;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
  .conv-eq{font-size:1.3rem;color:var(--muted);font-weight:700;flex-shrink:0}
  .conv-swap{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;
    transition:background .2s, transform .35s}
  .conv-swap:hover{background:var(--teal)}
  .conv-swap:active{transform:rotate(180deg)}
  .conv-swap svg{display:block}
  .conv-rate{font-size:.82rem;color:var(--muted)}
  .conv-rate b{color:var(--ink)}
  .conv-rate .src{font-size:.72rem;opacity:.8;margin-left:4px}

  /* Neighborhood guide */
  .hood-intro{color:var(--muted);font-size:1.02rem;max-width:760px;margin:0 0 24px;font-style:italic}
  .hoods{display:flex;flex-direction:column;gap:22px}
  .hood{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .hood-hero{position:relative;height:260px;background:#1a3a2a center/cover no-repeat;transition:background-image .4s}
  .hood-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.08) 100%)}
  .hood-name{position:absolute;bottom:28px;left:0;right:0;z-index:1;font-size:1.6rem;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);margin:0;padding:0 28px}
  .hood-credit{position:absolute;bottom:8px;right:12px;z-index:1;font-size:.65rem;color:rgba(255,255,255,.7);line-height:1.3}
  .hood-credit a{color:rgba(255,255,255,.8);text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:2px}
  .hood-credit a:hover{color:#fff}
  .hood-body{padding:22px;display:flex;flex-direction:column;flex:1}
  .hood-desc{color:var(--muted);font-size:.92rem;margin:0 0 16px;font-style:italic}
  .hood-lodging{margin-top:auto;border-top:1px solid rgba(0,0,0,.07);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .lodge-row{display:flex;align-items:baseline;gap:10px}
  .lodge-tier{flex-shrink:0;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 0;border-radius:20px;color:#fff;width:84px;text-align:center}
  .lodge-name{font-size:.86rem;color:var(--muted);font-style:italic}

  .sec-head{font-size:1.8rem;margin:0 0 22px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .25s, box-shadow .25s;display:flex;flex-direction:column;min-width:0}
  .tile:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(20,40,50,.18)}
  .tile .photo{height:180px;background-size:cover;background-position:center}
  .tile .body{padding:16px 18px 20px}
  .tile .date{color:var(--teal);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}

  .back{display:inline-block;margin-top:8px;background:var(--green);color:#fff;font-weight:700;

  .back:hover{background:var(--teal)}

  /* "Back to city guides" bar just under the hero photo */
  .hero-credit{position:absolute;right:10px;bottom:7px;z-index:3;font-size:.62rem;line-height:1.2;

  .hero-credit a:hover{color:#fff}
  .hero-back-bar{max-width:var(--maxw);margin:16px auto 0;padding:0 22px}
  .hero-back-bar .back{margin-top:0;padding:10px 20px;font-size:.92rem}

  /* Floating translucent "Back to top" button (all pages this template renders) */
  .back-to-top{position:fixed;right:22px;bottom:22px;z-index:500;
    width:48px;height:48px;border-radius:50%;
    background:rgba(26,74,58,.72);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;line-height:1;text-decoration:none;

  .back-to-top.show{opacity:1;visibility:visible;transform:translateY(0)}
  .back-to-top:hover{background:rgba(26,74,58,.9)}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:40px}
  footer .brand{justify-content:center;color:#c35237}
  footer .foot-links{margin-top:14px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  footer .foot-links a{color:#dfeee7;font-size:.85rem;font-weight:600;opacity:.9;border-bottom:1px solid transparent}
  footer .foot-links a:hover{color:#fff;border-color:var(--coral);opacity:1}

  .notfound{text-align:center;padding:120px 22px}
  .notfound h1{font-size:2.4rem;margin-bottom:10px}

  @media(max-width:820px){
    nav.links{display:none}
    .facts{grid-template-columns:repeat(2,1fr)}
    .fact-wide{grid-column:1/-1}
    .temp-rows{grid-template-columns:repeat(2,1fr)}
    .temp-row{border-right:none;border-bottom:1px solid rgba(0,0,0,.07);padding:10px 0}
    .temp-row:nth-child(2n){padding-left:14px;border-left:1px solid rgba(0,0,0,.07)}
    .temp-row:last-child{border-bottom:none}
    .tiles{grid-template-columns:1fr}
    .cur-grid{grid-template-columns:1fr}
    .cost-cards-grid{grid-template-columns:repeat(2,1fr)}
    .net-stats{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:520px){
    /* Full-width layout with tighter padding */
    section{padding:32px 14px}
    .hero{min-height:280px;height:48vh}
    .hero-inner{padding:0 14px 24px}
    .hero h1{font-size:2rem}
    .hero .tagline{font-size:1rem;margin-top:8px}
    .nav-inner{padding:10px 14px}
    .hero-back-bar{padding:0 14px}
    .back-to-top{right:14px;bottom:14px;width:42px;height:42px;font-size:1.15rem}

    /* Grids → single column */
    .facts{grid-template-columns:1fr}
    .temp-rows{grid-template-columns:1fr}
    .temp-row:nth-child(2n){padding-left:0;border-left:none}
    .cost-cards-grid{grid-template-columns:1fr}
    .net-stats{grid-template-columns:1fr}
    .transport-grid{grid-template-columns:1fr}

    /* Cards — let them breathe edge to edge */
    .fact{padding:14px}
    .tcard{padding:14px}
    .modal-card{padding:20px 16px 24px;border-radius:14px}

    /* Currency converter stacks neatly */
    .conv-row{flex-direction:column;align-items:stretch}
    .conv-field{flex:none;width:100%;min-width:0}
    .conv-field select{max-width:100%}
    .conv-eq{text-align:center}
    .conv-swap{align-self:center}

    /* Neighborhood cards */
    .hood-hero{height:200px}
    .hood-body{padding:16px}
    .hood-name{font-size:1.3rem;padding:0 16px}

    /* Sec heading */
    .sec-head{font-size:1.45rem;margin-bottom:14px}
  }
</style>
</head>

/* Returns a CSS color for a given °F temperature */
function tempColor(f) {
  if (f <= 35)  return '#74b9ff'; /* cold blue   */
  if (f <= 50)  return '#55efc4'; /* cool teal   */
  if (f <= 65)  return '#a8e063'; /* mild green  */
  if (f <= 78)  return '#ffeaa7'; /* warm yellow */
  if (f <= 90)  return '#fd9644'; /* hot orange  */
  return '#e55039';               /* very hot red */
}

/* Maps °F to a 0–100 bar width (anchored at 28°F min, 110°F max) */
function tempWidth(f) {
  return Math.min(100, Math.max(4, Math.round((f - 28) / 82 * 100)));
}

/* Convert °F to °C */
function toCelsius(f) { return Math.round((f - 32) * 5 / 9); }

/* Season names per quarter (Jan–Mar, Apr–Jun, Jul–Sep, Oct–Dec) by latitude:
   tropical = wet/dry; otherwise four seasons flipped for the southern hemisphere. */
function seasonsFor(lat) {
  if (Math.abs(lat) < 20) return ["Dry season","Hot season","Wet season","Wet season"];
  return lat < 0
    ? ["Summer","Autumn","Winter","Spring"]
    : ["Winter","Spring","Summer","Autumn"];
}

function taxiFareColor(cat) {

/* Fixed tier labels + blurbs for the "How long to stay" section (same for every city). */
const VISIT_TIERS = [
  { label:"Scratch the surface", blurb:"Hit the iconic, must-see sights and headline landmarks." },
  { label:"Leisurely explore",   blurb:"See the highlights at an unhurried pace, with room to wander." },
  { label:"Deeper dive",         blurb:"Time for hidden gems, local neighborhoods, and day trips." },
  { label:"Live like a local",   blurb:"Settle in and soak up everyday life at your own rhythm." }
];
function visitRangeText(r){
  const [lo,hi] = r;
  const n = lo === hi ? String(lo) : lo + "–" + hi;
  const unit = (lo === hi && lo === 1) ? "day" : "days";
  return { n, unit };
}
function buildVisitSection(cityName){
  const tiers = CITY_VISIT[cityName];
  if (!tiers) return "";
  const cards = tiers.map((r,i)=>{
    const t = VISIT_TIERS[i];
    const { n, unit } = visitRangeText(r);
    return `
      <div class="stay-card">
        <div class="stay-days"><b>${n}</b> <span>${unit}</span></div>
        <div class="stay-label">${t.label}</div>
        <div class="stay-blurb">${t.blurb}</div>
      </div>`;
  }).join("");
  return `
    <div class="stay-section" aria-label="How long to stay">
      <div class="stay-head">
        <h2>How long should you stay?</h2>
        <p class="stay-sub">From a quick highlights run to living like a local — pick the pace that fits your trip.</p>
      </div>
      <div class="stay-grid">${cards}</div>
    </div>`;
}

/* Colour for a safety index (higher = safer), 5 tiers */
function safetyColor(s) {
  if (s >= 80) return "#1d9a6c"; // 80–100  green
  if (s >= 60) return "#7cb342"; // 60–79   yellow-green
  if (s >= 40) return "#e0a800"; // 40–59   yellow
  if (s >= 20) return "#fd7e14"; // 20–39   orange
  return "#e01010";              // 0–19    bright red
}

/* Colour for a crime index (higher = worse), 5 tiers — inverse of safety */
function crimeColor(s) {
  if (s <= 19) return "#1d9a6c"; // 0–19    green
  if (s <= 39) return "#7cb342"; // 20–39   yellow-green
  if (s <= 59) return "#e0a800"; // 40–59   yellow
  if (s <= 79) return "#fd7e14"; // 60–79   orange
  return "#e01010";              // 80–100  bright red
}

const CITY_HOOD_DESC = {
  "Kyiv":["Historic riverside old town with cobblestone streets, contemporary art galleries, cafes and nightlife along Kontraktova Square; suits younger travelers wanting a bohemian, walkable base near the Dnipro.","Leafy, upscale district home to the Kyiv Pechersk Lavra monastery complex, government buildings and embassies; suits travelers wanting quieter, well-guarded surroundings close to major historic sights.","The bustling heart of the city around Maidan Nezalezhnosti and Khreshchatyk Street, with shopping, main squares and multiple metro lines; suits first-time visitors who want everything within walking distance.","Elegant tree-lined streets around Kyiv University and the medieval Golden Gate, mixing 19th-century architecture with boutique hotels and good restaurants; suits travelers wanting a central but calmer, upscale stay.","Practical, well-connected district around the main railway station with budget-friendly hotels and quick transit links; suits transit travelers and budget-conscious visitors."],
  "Ljubljana":["The pedestrianized historic core along the Ljubljanica River with the Triple Bridge, Prešeren Square and Ljubljana Castle above; best for first-timers who want to walk everywhere, though it's the priciest, busiest area.","A gritty, creative district anchored by the Metelkova alternative-culture squat and indie bars, popular with younger travelers and hostel-goers who want nightlife within an easy walk of downtown.","A picturesque, low-key residential quarter along the Gradaščica canal with artsy cafes and a weekend market, ideal for travelers wanting a quieter, local feel just south of the center.","A leafy, more business-oriented district north of downtown near Tivoli Park and the Stožice sports complex, suited to those wanting quieter streets, good value, and easy bus access to the center.","A residential, university-adjacent area southwest of downtown near the zoo and Tivoli Park's edge, offering good-value stays for travelers with a car or prioritizing budget over a central location."],
  "Kotor":["The medieval walled core of Kotor, packed with stone squares, cafes, and cruise-ship day-trippers; ideal for first-timers who want everything walkable and car-free, though it gets loud and crowded in peak season.","A long seafront promenade of former sea-captains' mansions just north of the walls, with parking and quieter nights; suits travelers wanting easy walking access to Old Town without the crowds.","A tiny, car-free Baroque village further into the bay near the Our Lady of the Rocks islet; best for a slow one- or two-night romantic stopover rather than a full-trip base.","An elegant, little-visited waterfront village about 4.5km from Kotor lined with grand 18th-century villas turned boutique hotels; suits travelers with a car seeking quiet upscale seclusion.","A narrow fishing hamlet directly across the bay from the Old Town with some of the best photo views of the walls and mountains; good for those prioritizing scenery over nightlife."],
  "Bratislava":["The historic heart with cobblestone lanes, cafes, and the castle nearby; best for first-time visitors who want to walk everywhere and be near sights and nightlife.","A riverside district across the Danube with the SNP Bridge/UFO tower and Sad Janka Kráľa park; suits budget travelers and those wanting green space with a short tram/bus ride to downtown.","A mixed residential-business district with the Slovak modern architecture and Bonbon/Central shopping malls; good for business travelers and longer stays wanting local, less touristy life.","Convenient for rail travelers arriving by train or bus, with easy tram access to Old Town; suits transit-focused visitors and those on a budget near the station.","Quieter, leafy areas along the Danube near Devín Castle, popular with those seeking nature, hiking, and a slower pace outside the tourist core."],
  "Belgrade":["The historic old town packed with Kalemegdan Fortress, Knez Mihailova pedestrian street, and Skadarlija's bohemian taverns; best for first-time visitors who want everything walkable.","An upscale, leafy residential district anchored by the massive Church of Saint Sava, filled with cafes and boutiques; suits travelers wanting a quieter, local feel close to downtown.","A trendy riverside grid of low-rise buildings, specialty coffee shops, and Danube-side splav (raft club) nightlife; popular with younger travelers and digital nomads.","A fast-redeveloping riverside zone mixing gritty art squats with glossy new towers, malls, and the Sava promenade; good for travelers chasing nightlife and modern comforts.","A calmer former Habsburg-era fishing town on the Danube with cobbled lanes and the Gardoš Tower; ideal for travelers wanting a relaxed, authentic base away from downtown crowds."],
  "San Marino":["The walled medieval capital atop Monte Titano, with the three towers, cobbled lanes and sweeping views; best for first-time visitors who want to sleep steps from the sights, though it goes quiet once day-trippers leave.","A lively market town at the foot of the cable car with everyday shops, cafes and an easy funicular ride up to the historic center; good value for travelers who want local atmosphere without the tourist premium.","San Marino's largest, most modern town near the Italian border, with supermarkets, restaurants and easy road access; suits longer stays, business travelers and anyone with a rental car.","A compact border district built around outlet shopping and duty-free stores, convenient for drivers arriving from Rimini; practical rather than scenic.","A quiet residential district near the shopping outlets offering budget-friendly stays with bus links into the capital; suited to travelers prioritizing price over location."],
  "Moscow":["Grand imperial core packed with the Kremlin, Red Square and Bolshoi Theatre; best for first-time visitors who want everything within walking distance, at premium prices.","Moscow's most romantic pedestrian street lined with cafes, street art, and old mansions; ideal for culture lovers who want charm and easy metro access without being right on Red Square.","Trendy arts district built around a former chocolate factory with galleries, bars, and coworking spaces; suits younger travelers and creatives who want a hip, walkable scene.","Upscale, leafy residential area near Gorky Park and the river with boutique hotels and embassies; good for those wanting a quieter, elegant base near green space and museums.","Historic merchant quarter across the river from the Kremlin with Tretyakov Gallery and quiet courtyards; suits travelers wanting authentic local feel with skyline views and value."],
  "Bucharest":["Cobblestoned historic core packed with bars, clubs, cafes and restored 19th-century facades; best for first-timers and nightlife-seekers who want to walk everywhere.","Grand central boulevard lined with museums, government buildings and shopping; suits business travelers and culture-focused visitors who want a central, well-connected base.","Leafy district around Bucharest's largest park and lake, with joggers, cafes and a family-friendly feel; suits travelers wanting quiet greenery and easy access to the northern airport road, a bit removed from nightlife.","Upscale residential enclave with embassies, boutiques and trendy restaurants; suits travelers seeking a chic, quieter base with excellent dining nearby.","Central area anchored by Unirii Square and the massive Palace of Parliament, well served by metro; suits budget travelers and those wanting proximity to major sights and transit hubs."],
  "Skopje":["Skopje's bustling core around Macedonia Square, packed with monuments, museums, and the pedestrian Stone Bridge; ideal for first-time visitors who want everything within walking distance.","The historic Ottoman-era quarter of cobbled lanes, mosques, and craft shops on the Vardar's north bank; suits culture lovers and travelers chasing an authentic, atmospheric stay.","A leafy, cafe-lined residential district beloved for its bars, restaurants, and laid-back bohemian energy; popular with younger travelers and anyone prioritizing nightlife.","A modern, spacious municipality with malls, wide boulevards, and business-class hotels; good value and well-connected for travelers who don't mind a short ride to the old town.","Leafy foothills of Mt. Vodno with the Millennium Cross cable car and hiking trails nearby; best for nature-minded visitors and families wanting fresh air outside the center."],
  "Chișinău":["The historic core with government buildings, museums, Ștefan cel Mare Central Park and the main pedestrian boulevard; best for first-time visitors who want to walk to everything.","A leafy, mostly residential southern district around the National Botanical Garden and Chisinau's main bus/train hub, popular for cheaper lodging with an easy bus ride into downtown.","An upscale, quieter western district with embassies, parks (Dendrarium) and newer apartment blocks; suits business travelers and those wanting a calmer stay a short ride from the center.","A northern residential sector around the railway station and central market, convenient for early departures and budget stays but with fewer sights of its own.","A compact, green residential area just southwest of downtown around Valea Trandafirilor (Valley of Roses) park; a good-value base within easy walking distance of Centru."],
  "Monaco":["The glamorous heart of Monaco around the famous casino, with grand Belle Époque palace hotels, designer boutiques, and the F1 circuit; best for travelers chasing luxury, nightlife, and glitz.","The harborfront district around Port Hercule with the daily market, marina-view cafes, the train station, and a more local, walkable feel; suits visitors wanting a central but slightly less flashy base.","A modern district built on reclaimed land around the marina, with parks, the Stade Louis II, and the heliport; calmer and greener, good for families or those wanting some breathing room.","Monaco's beach district along Avenue Princesse Grace with the Japanese Garden and beach clubs facing the Mediterranean; ideal for sun-seekers and resort-style stays.","A French hillside town literally across the street from the Casino de Monte-Carlo, offering noticeably cheaper lodging within a short walk of Monaco's sights; best for budget-conscious travelers."],
  "Valletta":["Malta's compact, UNESCO-listed walled capital packed with baroque churches, palaces and rooftop bars; ideal for first-time visitors who want to be steps from the main sights.","A lively seafront town across the harbour with a long promenade, shopping and ferry links to Valletta; suited to travelers wanting modern comforts and easy transit.","Malta's main nightlife, casino and dining hub around Spinola Bay, mixing business hotels with clubs; best for younger travelers who want bars within walking distance.","The hilltop 'Silent City' of Mdina and its quieter neighbor Rabat, full of medieval streets and catacombs; perfect for travelers seeking a tranquil, atmospheric base.","A north-coast resort strip with budget-friendly hotels, promenades and dive schools; suits families and value-focused travelers who don't mind busing into Valletta."],
  "Vaduz":["Vaduz's tiny walkable core around Städtle promenade, with the Prince's castle above, government buildings, museums and the main shopping street; best for first-time visitors wanting everything on foot.","Liechtenstein's largest town and transport/business hub just north of Vaduz, with the national train station, more affordable lodging and dining, and easy bus links; suits budget travelers and those arriving by rail.","A steep hillside village above Vaduz with sweeping valley views and the gateway road up to the alpine resort of Malbun; suits hikers, skiers and travelers wanting mountain scenery over city convenience.","A quiet residential village south of Vaduz along the Rhine valley with vineyards and walking trails; suits travelers seeking a low-key, local-feeling base with easy bus access to the capital.","The southernmost village, home to medieval Gutenberg Castle on its own hill and traditional guesthouses; suits travelers interested in history and slow, rural exploring."],
  "Luxembourg City":["Historic hilltop old town with cobbled lanes, cathedral, palace and cliffside views; best for first-time visitors who want to walk to every major sight.","Picturesque riverside district in the Alzette valley below the old town, packed with bars, restaurants and nightlife in restored 18th-century buildings; suits younger travelers and nightlife seekers.","Neighboring riverside quarter known for its brewery heritage turned nightclub and bar strip; good for visitors prioritizing evening entertainment.","Modern EU-institution business district with glass towers, museums (Mudam) and the Philharmonie; suits business travelers and those wanting contemporary architecture and chain hotels.","Residential area near the train station with budget and mid-range hotels close to rail/bus links, convenient for transit-focused stays but less scenic."],
  "Riga":["Riga's cobblestoned medieval core packed with Gothic spires, cafes and the Freedom Monument, ideal for first-time visitors who want everything within walking distance.","Leafy boulevards lined with Europe's finest Art Nouveau facades and upscale boutiques, suited to architecture lovers and travelers wanting an elegant, quieter base close to downtown.","A leafy left-bank residential district with wooden houses, a historic covered market and a growing cafe scene, good for travelers wanting a local, less touristy feel with easy tram access to the center.","A bohemian strip of independent cafes, craft breweries and street art in the Avoti area, popular with younger travelers and creatives seeking Riga's hipster side.","The gritty, up-and-coming zone around the Zeppelin-hangar Central Market and train station, offering cheap eats and budget stays within walking distance of Old Town."],
  "Reykjavík":["The historic downtown core packed with restaurants, bars, shops and Hallgrímskirkja church; ideal for first-time visitors who want to walk to everything.","A revitalized waterfront of old fish-processing warehouses turned into design studios, breweries, and the Maritime Museum; suits foodies and those catching whale-watching or Golden Circle tours nearby.","The main shopping street and its eastern end around the Hlemmur food hall, full of vintage shops, cafes and nightlife; great for younger travelers wanting energy after dark.","A leafy park district with Iceland's largest geothermal pool, a zoo and botanical garden; ideal for families and budget travelers using the campsite/hostel.","A quiet, residential seaside neighborhood near the university and domestic airport with a beloved local pool; suited to travelers wanting a local, low-key base a short walk from downtown."],
  "Dubrovnik":["Historic walled city of marble streets, Baroque churches, and the famous city walls; ideal for first-timers who want to be steps from every sight, though it's pricey, car-free, and crowded midday.","Leafy pedestrian peninsula with a palm-lined promenade and pebble beaches, packed with mid-range hotels and restaurants; suits travelers wanting a relaxed, walkable base with easy bus links to Old Town.","Resort-heavy northern tip of the Lapad peninsula with large hotel complexes, pine parks, and quieter beaches; good for families and all-inclusive-style stays a short bus ride from the sights.","Upscale district just east of the walls with luxury hotels, Banje Beach, and Old Town skyline views; ideal for travelers wanting walking-distance convenience without staying inside the crowded walls.","Working port district around the ferry terminal and market halls; practical and budget-friendly for ferry travelers, but less scenic and farther from the main sights."],
  "Sofia":["The historic core around Alexander Nevsky Cathedral, Serdika ruins, and the Largo, packed with museums, churches and government buildings - best for first-time visitors who want everything walkable.","Sofia's premier pedestrian shopping and dining artery lined with cafes, boutiques and Mount Vitosha views - ideal for travelers who want to be in the middle of the action.","The area around the National Palace of Culture (NDK) and South Park's edge, quieter and leafy but still central - suits business travelers and those wanting easy metro access without the tourist crowds.","A trendy, youthful residential district near South Park full of restaurants, craft-beer bars and coworking cafes - popular with digital nomads and younger travelers.","An elegant, tree-lined embassy district near the Cathedral with grand early-20th-century architecture - good for travelers wanting upscale calm close to the sights."],
  "Minsk":["The main artery of the city with grand Stalinist-era architecture, department stores, and the biggest hotel chains; best for first-time visitors who want everything within walking distance.","Minsk's reconstructed old quarter of cobbled lanes, pastel 19th-century buildings, riverside cafes, and small museums; suits travelers who want charm and a walkable historic base.","A lively, central district by the Svisloch River blending Soviet-era blocks with Upper Town's churches and nightlife; good for visitors who want central convenience with more local buzz.","The area around the main railway station, practical and well-connected by metro and long-distance transport; suits budget travelers and those arriving/departing by train.","A quieter, leafy residential hill near the center with parks and lower prices than downtown; suits visitors wanting a calmer base still close to the action."],
  "Sarajevo":["The historic Ottoman-era old town of cobblestone lanes, copper workshops, mosques and cafes; best for first-time visitors who want to be steps from every major sight and nightlife.","The modern civic and business heart with government buildings, the Holiday Hotel, shopping and the National Museum; suits business travelers and those wanting easy tram access.","The main pedestrian shopping street (Ferhadija) linking old and new town, lined with cafes, boutiques and Austro-Hungarian architecture; good for travelers who want a central, walkable base.","A steep, atmospheric hillside quarter inside the old city walls with the Yellow Fortress and sweeping views; suits travelers wanting a quiet, authentic residential feel with fewer crowds.","A leafy spa town at the city's edge near the airport and Vrelo Bosne park; suits those seeking a relaxed, green base with thermal spas, away from the downtown bustle."],
  "Andorra la Vella":["Andorra la Vella's medieval core with cobbled lanes, the historic Casa de la Vall parliament building and small squares; best for culture lovers who want to walk everywhere.","The country's central shopping boulevard lined with duty-free electronics, fashion and perfume shops; suits shopping-focused visitors who want to be steps from the action.","A lively spa town built around the Caldea thermal complex, with casinos, bars and restaurants; ideal for wellness travelers and those wanting a livelier evening scene.","A quieter, more residential district on the southern edge of town near the road to Spain, with easy driving access; good for families and road-trippers wanting value and space.","A modern business and convention district with larger hotels and easy parking; suits business travelers and those attending events at the nearby congress center."],
  "Tirana":["The pedestrian-friendly heart of the city around Skanderbeg Square, National History Museum, and Et'hem Bey Mosque; best for first-timers who want everything walkable.","Tirana's trendiest district of leafy streets, boutiques, cafes, and nightlife, once the restricted Communist-era elite quarter; suits travelers who want upscale dining and bars within walking distance.","A quieter residential/diplomatic area near Rinia Park and the Grand Park (Parku i Madh) with the Artificial Lake; good for families and those wanting green space and calm.","An up-and-coming creative quarter near the Pyramid of Tirana and Blloku's edge, filled with street art, cafes, and design studios; suits younger travelers and digital nomads.","A traditional, budget-friendly area near the New Bazaar (Pazari i Ri) with local markets and authentic eateries; suits budget travelers wanting an authentic, less touristy feel."],
  "Hong Kong":["The dense financial heart of the city, packed with skyscrapers, luxury malls, and buzzing after-work bars around Lan Kwai Fong; ideal for business travelers and nightlife seekers who want to be in the thick of it.","A tourist-friendly Kowloon waterfront district famous for the Avenue of Stars, harbor skyline views, museums, and endless shopping, suiting first-time visitors and sightseers.","A frenetic shopping and dining hub with department stores, boutiques, and crowded streets, popular with young shoppers and foodies looking for a lively urban buzz.","One of the most densely populated places on earth, this gritty, energetic Kowloon area is full of street markets, cheap eats, and neon, great for budget travelers and market lovers.","A mixed business-and-nightlife district with old wet markets alongside trendy bars, restaurants, and the convention center, appealing to both professionals and revelers."],
  "Bangkok":["A long, cosmopolitan strip of malls, rooftop bars, international restaurants, and nightlife stretching along the BTS line, popular with expats, nightlife lovers, and mid-range to upscale travelers.","The city's main business and financial district by day that transforms into a buzzing nightlife zone after dark, home to Patpong and a great base for foodies and professionals.","The legendary backpacker enclave of cheap guesthouses, street food, bars, and travel agencies, drawing budget travelers and party-minded backpackers.","A historic riverside area along the Chao Phraya with grand heritage hotels, upscale dining, and easy access to temples, suiting luxury travelers and those seeking old-world charm.","The central shopping district anchored by megamalls like Siam Paragon and MBK, a magnet for shoppers, teens, and anyone wanting to be at the retail and transit heart of the city."],
  "London":["The entertainment and government core, home to West End theaters, restaurants, LGBTQ+ nightlife in Soho, and landmarks like Westminster and Big Ben, perfect for sightseers and night owls.","A hip East London district known for street art, vintage shops, cocktail bars, and a thriving creative and tech scene, ideal for trendsetters, artists, and nightlife seekers.","An elegant, affluent area of grand white townhouses, world-class museums like the V&A and Natural History Museum, and upscale shopping, suiting culture lovers and luxury travelers.","A bohemian, alternative neighborhood famous for its sprawling markets, live music venues, and countercultural vibe, appealing to young travelers, music fans, and market hunters.","A picturesque, upscale area of pastel houses, the famous Portobello Road antiques market, and the Notting Hill Carnival, drawing romantics, shoppers, and film-fan tourists."],
  "Macau":["The historic core of the city blending Portuguese colonial architecture, temples, and old casinos with dense local life, ideal for heritage sightseeing and travelers wanting authentic Macanese character.","A charming district with a preserved old village of narrow lanes, colonial houses, and renowned Macanese and Portuguese eateries, great for foodies and those seeking old-world atmosphere.","The glitzy reclaimed strip of mega-resorts, casinos, and lavish shows modeled on Las Vegas, suiting luxury seekers, gamblers, and families visiting themed resorts.","A quiet, green, laid-back island retreat with beaches, hiking trails, and the famous Lord Stow's egg tarts, perfect for those wanting to escape the casino crowds and relax.","The iconic paved central square with its wave-patterned tiles, colonial buildings, and shops, a bustling sightseeing and shopping hub at the heart of the historic center."],
  "Singapore":["The futuristic waterfront showcase of the Marina Bay Sands, Gardens by the Bay, and luxury hotels, ideal for upscale travelers, sightseers, and those wanting iconic skyline views.","A vibrant heritage district of shophouses, temples, hawker food, and trendy bars, blending traditional culture with nightlife, great for foodies and history-minded visitors.","A colorful, aromatic enclave packed with Indian eateries, spice shops, and the Sri Veeramakaliamman temple, perfect for foodies and travelers seeking culture and bargains.","The premier shopping boulevard lined with malls and flagship stores, a paradise for retail lovers and those wanting a central, upscale base.","The historic Malay-Arab quarter around the Sultan Mosque, filled with boutiques, hip cafes, hookah bars, and Haji Lane's indie shops, appealing to trendy travelers and foodies."],
  "Paris":["A fashionable historic district of medieval lanes, chic boutiques, art galleries, falafel spots, and a lively LGBTQ+ scene, suiting trendy travelers, shoppers, and foodies.","An elegant Left Bank literary quarter of storied cafes, galleries, and upscale boutiques, ideal for sophisticated travelers seeking classic Parisian charm.","The hilltop artists' village crowned by the Sacré-Coeur basilica, with winding cobbled streets and bohemian cafes, perfect for romantics and sightseers seeking postcard views.","A lively student district around the Sorbonne with bookshops, bistros, and Roman ruins, appealing to budget travelers, intellectuals, and those wanting a youthful buzz.","The grand tree-lined avenue of flagship stores, cinemas, and cafes leading to the Arc de Triomphe, drawing luxury shoppers and first-time sightseers."],
  "Dubai":["The glittering center anchored by the Burj Khalifa and Dubai Mall with luxury hotels and the dancing fountains, ideal for upscale travelers, shoppers, and first-time sightseers.","A glamorous waterfront district of high-rise towers, yachts, beach clubs, and a lively promenade, suiting nightlife lovers, beachgoers, and young travelers.","An upscale coastal area of villas, pristine public beaches, and the Burj Al Arab, perfect for beach lovers and luxury travelers wanting a relaxed seaside vibe.","The atmospheric old-Dubai district of traditional souks, spice and gold markets, and the creek, great for budget travelers and those seeking the city's heritage and bargains.","A modern high-rise business and hotel district beside the canal, home to sleek towers and dining, appealing to business travelers and those wanting a central contemporary base."],
  "New York":["The bustling commercial core of Times Square, Broadway theaters, skyscrapers, and major hotels, ideal for first-time visitors, theatergoers, and business travelers.","A chic downtown district of cast-iron architecture, cobblestone streets, designer boutiques, and art galleries, perfect for luxury shoppers and style-conscious travelers.","A charming, tree-lined bohemian neighborhood of brownstones, jazz clubs, cozy cafes, and NYU energy, appealing to romantics, students, and those seeking a laid-back vibe.","A hip Brooklyn hotspot of indie boutiques, waterfront views, craft breweries, and a thriving art and music scene, great for trendsetters and nightlife lovers.","An affluent, refined district of elegant townhouses, Museum Mile, and upscale Madison Avenue shopping, suiting culture lovers, families, and luxury travelers."],
  "Kuala Lumpur":["The city's premier entertainment and shopping district packed with malls, street food, bars, and nightlife, ideal for shoppers, foodies, and night owls wanting a central base.","The upscale core around the Petronas Twin Towers and Suria mall with luxury hotels and a landmark park, suiting business travelers and those seeking iconic skyline views.","The historic Chinatown around Petaling Street, a lively maze of market stalls, temples, and hawker food, great for budget travelers and bargain hunters.","A leafy, affluent suburb of trendy cafes, boutiques, and a buzzing bar scene, popular with expats, young professionals, and foodies seeking a relaxed upscale vibe.","A gritty, authentic district known for its sprawling wet market and cheap local eateries, appealing to adventurous travelers wanting an unfiltered slice of local life."],
  "Istanbul":["The historic heart of old Istanbul, home to the Hagia Sophia, Blue Mosque and Topkapi Palace, with narrow cobbled streets and countless carpet and souvenir shops. Ideal for first-time visitors who want major sights within walking distance.","A lively, cosmopolitan district centered on Istiklal Avenue and Taksim Square, packed with cafes, bars, galleries and nightlife. Suits travelers who want to be in the buzzing cultural and entertainment core of the modern city.","A trendy, laid-back neighborhood on the Asian side full of hip cafes, bars, bookshops and a famous produce market. Great for those seeking a more local, bohemian and less touristy vibe.","An upscale, energetic waterfront district with a busy market, seaside promenade, football culture and buzzing nightlife. Appeals to visitors wanting stylish restaurants and a youthful, upmarket atmosphere.","A stylish, artsy quarter by the Golden Horn with design boutiques, galleries, rooftop bars and waterfront views. Perfect for creative types drawn to a chic, revitalized industrial waterfront."],
  "Tokyo":["A dense, neon-lit hub of skyscrapers, department stores, izakayas and the sprawling Kabukicho nightlife district. Suits travelers who want nonstop energy, dining and entertainment around the clock.","The iconic youth-culture and fashion center famous for its scramble crossing, trend-setting shops and vibrant nightlife. Ideal for those chasing street style, pop culture and lively crowds.","Tokyo's most elegant and upscale district, lined with flagship luxury boutiques, fine dining and refined art galleries. Best for visitors seeking sophisticated shopping and polished dining.","An atmospheric old-town area centered on the ancient Senso-ji temple, rickshaws and traditional craft shops. Perfect for travelers wanting a taste of historic, nostalgic Tokyo.","The world-renowned electronics and otaku district crammed with anime, manga, gaming and gadget shops plus quirky maid cafes. A haven for tech lovers and pop-culture fans."],
  "Antalya":["The charming walled old town of Antalya with Ottoman-era houses, narrow lanes, boutique hotels and a picturesque marina. Ideal for travelers who love historic atmosphere and seaside character.","A modern resort strip east of the center known for sandy beaches, large all-inclusive hotels and spas. Best suited to beach-focused holidaymakers wanting sun and resort comforts.","A long pebble-and-sand beach district backed by the Beydaglari mountains, with promenades, parks and family attractions. Great for beachgoers who want scenic mountain-meets-sea views.","The lively central district of Antalya covering the modern downtown, shopping and everyday city life. Suits visitors who want to stay near urban amenities and transport.","An upscale golf and beach resort area east of Antalya famed for luxury hotels and championship courses. Perfect for golfers and travelers seeking high-end all-inclusive stays."],
  "Seoul":["A bustling downtown shopping and street-food district packed with cosmetics stores, fashion outlets and crowds. Ideal for shoppers and first-time visitors who want central convenience.","A youthful, energetic neighborhood around Hongik University known for indie music, street art, clubs and cheap eats. Best for students and night owls seeking a creative, budget-friendly scene.","An affluent, glossy district of luxury boutiques, upscale dining, plastic-surgery clinics and stylish nightlife. Suits visitors wanting modern, high-end and trend-conscious Seoul.","A traditional cultural quarter with antique shops, tea houses, art galleries and craft studios. Perfect for those seeking Korean heritage, souvenirs and a slower pace.","A diverse, international district near the former US base with global restaurants, bars and a multicultural crowd. Great for travelers wanting varied cuisine and an eclectic nightlife."],
  "Osaka":["The vibrant southern entertainment hub around Dotonbori, famed for dazzling neon, street food and buzzing nightlife. Ideal for foodies and visitors wanting Osaka's lively downtown energy.","The sleek northern business and shopping district around Osaka Station, with department stores, skyscrapers and underground malls. Best for travelers wanting modern convenience and transport links.","A retro, gritty old-school neighborhood dominated by the Tsutenkaku tower and cheap kushikatsu eateries. Suits those curious about nostalgic, working-class Osaka atmosphere.","A district anchored by the historic Shitennoji temple, a large park, zoo and the towering Abeno Harukas building. Great for families and visitors mixing culture with shopping.","A premier shopping street and district lined with covered arcades, boutiques and department stores. Perfect for dedicated shoppers who want everything from luxury to bargains."],
  "Rome":["The ancient historic center packed with landmarks like the Pantheon, Trevi Fountain and Piazza Navona amid cobbled streets. Ideal for first-timers who want to walk among Rome's iconic sights.","A charming, bohemian district of ivy-clad lanes, trattorias and lively nightlife across the river. Best for those seeking atmospheric dining and a romantic, local feel.","A trendy, hip neighborhood near the Colosseum with vintage shops, wine bars and artisan boutiques. Suits stylish travelers wanting a cool yet central base.","An elegant, orderly residential area near the Vatican with wide boulevards and good shopping. Great for visitors wanting quieter streets close to St Peters and the Vatican Museums.","A traditional, authentic working-class quarter known for its food scene, market and Roman cuisine. Perfect for food lovers seeking genuine local flavor away from the crowds."],
  "Phuket":["The island's brashest beach resort town, famous for its long beach, packed nightlife and neon-lit Bangla Road. Ideal for party-seekers and first-timers wanting action and convenience.","A relaxed, family-friendly beach town with a broad sandy bay and a calmer vibe than nearby Patong. Best for couples and families wanting a laid-back beach holiday.","A scenic, upmarket beach area with a pretty bay, good sunsets and a moderate mix of dining and nightlife. Suits travelers wanting balance between relaxation and amenities.","The historic town center with colorful Sino-Portuguese shophouses, cafes, street art and markets. Great for culture seekers who prefer heritage charm over beaches.","A quieter, more low-key beach village popular with families and those seeking calm. Perfect for travelers wanting a peaceful, less crowded seaside stay."],
  "Barcelona":["The atmospheric medieval old town of narrow winding alleys, hidden squares and the cathedral. Ideal for visitors who want history, character and a central location on foot.","The elegant grid-plan district showcasing Gaudi masterpieces, wide avenues and upscale shopping. Best for those wanting modernist architecture and stylish, spacious streets.","A charming, village-like bohemian neighborhood with leafy plazas, indie shops and a local festive spirit. Suits travelers seeking an authentic, laid-back and creative vibe.","A fashionable medieval quarter of trendy boutiques, tapas bars and the Picasso Museum. Great for those wanting historic streets with a chic, lively edge.","A former fishing quarter beside the beach, full of seafood restaurants and a lively waterfront. Perfect for beach lovers wanting sand, sea and paella close to the center."],
  "Amsterdam":["A picturesque, characterful district of narrow streets, quirky boutiques, cozy brown cafes and canal views. Ideal for travelers wanting charming, quintessential Amsterdam atmosphere.","The iconic UNESCO-listed belt of 17th-century canals lined with gabled houses, houseboats and bridges. Best for first-timers who want the postcard heart of the city.","A trendy, multicultural neighborhood with a buzzing market, diverse eateries and lively bars around Sarphatipark. Suits younger travelers wanting a hip, local dining scene.","A leafy, upscale residential area with independent shops, good restaurants and proximity to Vondelpark. Great for those seeking a relaxed, stylish and less touristy base.","The bustling old city center with major squares, museums, shopping and nightlife including the red-light district. Best for visitors who want to be in the middle of the action."],
  "Milan":["The historic heart of the city, dominated by the great Gothic cathedral and the glittering Galleria shopping arcade, buzzing with tourists, luxury boutiques and grand piazzas. Ideal for first-time visitors who want landmarks and high-end shopping at their doorstep.","An elegant, artsy old quarter of cobbled lanes, galleries, antique shops and buzzing aperitivo bars, long associated with bohemians and the fashion crowd. Suits visitors who love charm, nightlife and boutique browsing.","A lively canal district lined with bars, trattorias and vintage shops that comes alive at aperitivo hour and into the night. Best for younger travelers and anyone chasing Milan's social, waterside evening scene.","A gleaming modern business and lifestyle district of skyscrapers, the Bosco Verticale towers and the Corso Como shopping strip. Great for those who want contemporary design, sleek dining and a polished urban feel.","A formerly working-class neighborhood turned hip and creative, full of independent bars, restaurants and a leafy, village-like feel. Appeals to a design-savvy, local crowd seeking authenticity away from the tourist core."],
  "Vienna":["The grand imperial first district inside the Ring, packed with palaces, the cathedral, opera house, coffee houses and luxury shopping. Perfect for visitors who want to be surrounded by history and Vienna's most famous sights.","A diverse district across the Danube Canal home to the giant Prater park and Ferris wheel, plus a growing food and cafe scene. Suits families and travelers wanting green space and a more relaxed, mixed local vibe.","A busy shopping and residential quarter along the long Mariahilfer Strasse pedestrian street, lively and central without being touristy. Good for shoppers and anyone wanting easy access to the center.","Vienna's trendiest, most creative district, dense with independent boutiques, galleries, cafes and the Museumsquartier nearby. Ideal for a younger, design-minded crowd seeking hip bars and indie shopping.","An elegant embassy and residential area home to the Belvedere Palace and grand boulevards, quieter and refined. Best for travelers wanting a calm, upscale base within reach of the center."],
  "Prague":["The medieval core around the Astronomical Clock and the Old Town Square, all cobbled lanes, Gothic spires and crowds. Ideal for first-timers who want to be steps from the city's iconic sights, though it is busy and touristy.","The picturesque Lesser Town below Prague Castle, full of baroque palaces, gardens, winding streets and the Charles Bridge approach. Perfect for romantics who want fairytale charm and postcard views.","A grander, more open district built around Wenceslas Square, mixing shopping, hotels, theaters and nightlife. Suits visitors wanting a central, bustling base with commerce and easy transport.","A leafy, upscale residential neighborhood of handsome apartment buildings, parks, wine bars and stylish cafes. Great for those seeking a local, relaxed feel and a strong food and drink scene.","A gritty, bohemian district famous for having the most pubs per capita, plus the towering TV Tower and a lively, alternative nightlife. Best for budget travelers and night owls chasing an authentic, unpolished vibe."],
  "Los Angeles":["The entertainment-industry landmark district home to the Walk of Fame, historic theaters and the Hollywood sign backdrop, touristy and uneven but iconic. Suits visitors who want the classic showbiz sights and nightlife.","A breezy beachfront city with a famous pier, wide beaches, the Third Street Promenade and an upscale, laid-back feel. Ideal for travelers wanting the ocean, walkability and easygoing California vibes.","The revitalized urban core with skyscrapers, the Arts District, historic theaters, museums and a growing dining and rooftop-bar scene. Good for those who want a dense, walkable city experience and culture.","A funky, bohemian beach neighborhood known for its boardwalk, canals, street art and quirky independent shops on Abbot Kinney. Best for creative, offbeat travelers who like beach culture with an edge.","The world-famous enclave of luxury, synonymous with Rodeo Drive shopping, palm-lined streets and celebrity glamour. Perfect for visitors seeking high-end shopping, fine dining and upscale surroundings."],
  "Sydney":["The central business district with skyscrapers, major shopping, and easy access to Circular Quay, the Opera House and Harbour Bridge. Ideal for first-timers who want to be central and near the top sights.","Sydney's oldest quarter of cobbled streets and colonial-era buildings beside the harbor, with pubs, markets and historic charm. Suits visitors who love history, waterfront views and a lively weekend market scene.","The legendary beach suburb with its golden crescent of sand, surf culture, the coastal walk and a buzzing cafe and bar scene. Best for beach lovers and those wanting relaxed, sun-soaked days by the ocean.","A waterfront leisure and entertainment precinct packed with restaurants, the aquarium, museums and family attractions around the harbor. Good for families and travelers wanting dining and sights in one walkable spot.","A hip inner-city neighborhood of Victorian terraces, boutiques, galleries and one of the city's best food, cafe and bar scenes. Perfect for a creative, foodie crowd seeking cool nightlife away from the beach."],
  "Cape Town":["The historic downtown nestled beneath Table Mountain and Signal Hill, home to the Company's Garden, museums, the colorful Bo-Kaap and a lively cafe and nightlife scene. Ideal for travelers who want to be central and walkable near the city's culture.","A polished, secure harbor precinct with shopping, restaurants, hotels and the departure point for Robben Island, set against mountain and sea views. Suits visitors wanting convenience, safety and family-friendly attractions.","A densely populated seaside strip with a popular oceanfront promenade, diverse dining and lively energy. Good for those wanting an affordable, walkable base close to the center and the sea.","An upscale beach suburb with a palm-lined promenade, white sand, chic restaurants and glamorous sunset views below the Twelve Apostles peaks. Best for travelers seeking beach glamour and a resort-like feel.","A gritty, arty neighborhood turned creative hub, known for street art, design studios, markets and hip eateries. Appeals to a younger, culture-seeking crowd wanting an edgy, authentic side of the city."],
  "Rio de Janeiro":["The iconic beachfront neighborhood with its sweeping crescent of sand, mosaic promenade and round-the-clock energy. Suits travelers who want the classic Rio beach scene, lively nightlife and easy access, though it is busy and touristy.","A stylish, upscale beach district made famous in song, with fashionable shops, restaurants and a beautiful beach framed by the Dois Irmaos peaks. Ideal for visitors wanting chic surroundings and vibrant seaside culture.","The most affluent and exclusive neighborhood, quieter and more refined than its neighbors, with fine dining, boutiques and a lovely beach. Best for travelers seeking upscale comfort and a calmer, polished vibe.","A bohemian hilltop district of cobbled streets, colonial mansions, artists' studios and sweeping city views. Perfect for a creative crowd wanting charm, history and an offbeat, arty atmosphere.","The historic center and Rio's raucous nightlife hub around the Lapa Arches, famed for samba clubs, live music and street parties. Great for night owls chasing music and dancing, best explored with care."],
  "Cancún":["The long barrier-island strip of high-rise beach resorts, turquoise Caribbean water, nightclubs and shopping malls. Ideal for travelers wanting all-inclusive resorts, beaches and party nightlife in one convenient stretch.","The real working city away from the beaches, with local markets, authentic taquerias, and more affordable hotels and food. Best for budget travelers and those wanting a genuine Mexican urban experience.","An upscale marina and residential development with luxury condos, a golf course, yachts, boutiques and polished restaurants. Suits visitors seeking a refined, modern base with dining and a marina setting.","The bustling tip of the hotel zone where the two beach strips meet, packed with the biggest nightclubs, bars and shopping. Perfect for partygoers wanting to be in the center of the action.","A low-key port area on the north side, the departure point for ferries to Isla Mujeres, with simple local eateries and a laid-back feel. Good for travelers wanting island access and a quieter, authentic vibe."],
  "Marrakech":["The ancient walled old city, a maze of souks, riads, palaces and the famous Jemaa el-Fna square alive with performers and food stalls. Ideal for travelers who want to immerse themselves in traditional Marrakech, sights and sensory bustle.","The modern French-built district with wide boulevards, contemporary cafes, boutiques, galleries and a lively dining scene. Suits visitors wanting a more relaxed, cosmopolitan base with modern comforts.","An upmarket quarter of luxury hotels, gardens, nightclubs and casinos between the old and new towns. Best for travelers seeking upscale accommodation and nightlife close to the medina.","The historic southern part of the medina around the royal palaces and the Saadian Tombs, quieter and rich in monuments. Good for those wanting history and atmosphere with fewer crowds than the central souks.","A tranquil palm-grove district on the city's outskirts, dotted with luxury villas, resorts and spas among the palms. Perfect for travelers wanting a peaceful, resort-style retreat away from the medina bustle."],
  "Madrid":["Bohemian and hip, Malasaña is the heart of Madrid nightlife with indie bars, vintage shops and street art, ideal for young travelers and night owls.","Chueca is Madrid's vibrant, stylish LGBTQ+ quarter, packed with trendy restaurants, cocktail bars and boutiques, great for nightlife and a lively social scene.","La Latina is the old medieval quarter famous for tapas crawls and the Sunday El Rastro flea market, perfect for foodies and those wanting classic Madrid atmosphere.","Salamanca is the upscale, elegant district of designer boutiques, fine dining and grand architecture, suited to luxury shoppers and travelers wanting a refined base.","Lavapiés is Madrid's most multicultural, edgy neighborhood with cheap ethnic eats, galleries and a gritty creative vibe, appealing to budget and adventurous visitors."],
  "Taipei":["Xinyi is Taipei's glossy modern downtown around Taipei 101, full of luxury malls, rooftop bars and nightclubs, ideal for shoppers, nightlife and first-time visitors.","Ximending is a buzzing pedestrian district known as the Harajuku of Taipei, packed with youth fashion, street food and cinemas, great for young and budget travelers.","Da'an is a leafy, upscale residential and university area with Da'an Forest Park, cafes and quiet lanes, well suited to families and longer, relaxed stays.","Zhongshan is a central, sophisticated district blending Japanese-era heritage, department stores and boutique hotels, convenient for business and mid-range travelers.","Shilin is home to Taipei's largest night market and the National Palace Museum, a lively, food-focused area popular with families and first-time sightseers."],
