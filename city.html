<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Never Roam Alone — City</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1d2a32;--muted:#5b6b75;--sand:#f6f1e7;--green:#185e3f;--teal:#0e7c86;
    --coral:#ef6f53;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--sand);line-height:1.65}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#e97451}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}

  /* Hero */
  .hero{position:relative;height:62vh;min-height:420px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;color:#fff}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,30,25,.15) 0%,rgba(10,30,25,.75) 100%)}
  .hero-inner{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;width:100%;padding:0 22px 40px}
  .crumb{font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#ffd9c9;margin-bottom:10px}
  .crumb a:hover{color:#fff}
  .hero h1{font-size:clamp(2.4rem,7vw,4.5rem);margin:0;line-height:1.02;text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .hero .country{font-size:1.1rem;opacity:.95;margin-top:6px}
  .hero .tagline{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;margin:14px 0 0;max-width:640px}
  .chip{display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);padding:8px 16px;border-radius:30px;margin-top:18px}
  .chip b{font-size:1.35rem}
  .chip span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;opacity:.9}

  section{max-width:var(--maxw);margin:0 auto;padding:54px 22px}
  .lead{font-size:1.15rem;color:var(--ink);max-width:760px}
  .muted{color:var(--muted)}
  .placeholder-note{background:#fff6ef;border:1px dashed var(--coral);color:#a24a34;
    border-radius:12px;padding:12px 16px;font-size:.86rem;margin-top:20px}

  /* Facts grid — 3 columns for the stat cards, temp card spans full row */
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
  .fact{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .fact .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:700}
  .fact .v{font-size:1.25rem;font-family:Georgia,serif;margin-top:6px}

  /* Combined population + visitors card */
  .stat-combo .sc-top{display:flex}
  .stat-combo .sc-top .sc-item{flex:1;min-width:0}
  .stat-combo .sc-top .sc-item + .sc-item{padding-left:16px;border-left:1px solid rgba(0,0,0,.07)}
  .sc-metrics{margin-top:14px;padding-top:12px;border-top:1px solid rgba(0,0,0,.07)}
  .sc-metrics .ratio-line:first-child{margin-top:0}
  .ratio-line{margin-top:6px;font-size:.82rem;color:var(--muted)}
  .ratio-line b{font-family:Georgia,serif;font-weight:700}
  .idx-link{font-family:Georgia,serif;font-weight:700;text-decoration:underline;text-underline-offset:2px}
  .stat-disclaimer{margin:14px 0 0;padding-top:12px;border-top:1px solid rgba(0,0,0,.07);
    font-size:.7rem;line-height:1.4;color:var(--muted)}

  /* Emergency + embassy card */
  .emrg{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .emrg-row{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
  .emrg-k{color:var(--muted)}
  .emrg-v{font-family:Georgia,serif;font-weight:700}
  .emrg-v a{color:var(--ink)}
  .emrg-note{font-size:.76rem;color:var(--muted);font-style:italic}
  .embassy{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07)}
  .embassy-k{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin-bottom:8px}
  .embassy select{width:100%;padding:9px 10px;border:2px solid rgba(24,94,63,.2);border-radius:10px;
    background:#fff;font-family:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
  .embassy select:focus{outline:none;border-color:var(--green)}
  .embassy-hint{margin:10px 0 0;font-size:.8rem;color:var(--muted);font-style:italic}
  .embassy-link{display:inline-block;margin-top:10px;color:var(--green);font-weight:700;font-size:.85rem}

  /* Language card */
  .lang-list{margin-top:8px;display:flex;flex-direction:column;gap:7px}
  .lang-row{display:flex;align-items:center;gap:10px}
  .lang-name{font-size:.9rem;font-family:Georgia,serif;min-width:110px;flex-shrink:0}
  .lang-pct{font-size:.78rem;font-weight:700;color:var(--teal);min-width:38px;text-align:right;flex-shrink:0}
  .lang-bar-track{flex:1;height:5px;background:#eee;border-radius:4px;overflow:hidden}
  .lang-bar{height:100%;border-radius:4px;background:var(--teal);opacity:.75}
  .rel-section{margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07)}
  .rel-section .rel-k{margin-bottom:8px}
  .rel-bar{background:var(--green)}
  .rel-pct{color:var(--green)}

  /* Temperature card */
  .fact-wide{grid-column:1/-1}
  .temp-rows{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:10px}
  .temp-row{padding:10px 14px 10px 0;border-right:1px solid rgba(0,0,0,.07)}
  .temp-row:last-child{border-right:none;padding-right:0}
  .temp-row:first-child{padding-left:0}
  .season-label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
  .season-name{font-weight:600;color:var(--teal)}
  .temp-val{display:block;font-family:Georgia,serif;font-size:1.1rem;font-weight:700;
    color:var(--ink);margin-bottom:4px}
  .rain-val{display:block;font-size:.76rem;color:var(--muted);margin-bottom:8px}
  .rain-val svg{vertical-align:-1px;margin-right:3px;color:#5aa7d8}
  .temp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .temp-foot{font-size:.74rem;color:var(--muted);font-style:italic}
  .temp-foot svg{vertical-align:-1px;margin-right:3px;color:#5aa7d8}
  .temp-bar-track{height:6px;background:#eee;border-radius:4px;overflow:hidden}
  .temp-bar{height:100%;border-radius:4px;transition:width .4s ease}

  /* Currency card + converter */
  .card-accept{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin-top:10px;padding:10px 14px;
    background:var(--sand);border-radius:12px}
  .card-accept .ca-icon{flex-shrink:0;display:inline-flex;color:var(--green)}
  .card-accept .ca-text{flex:1 1 220px;min-width:0;font-size:.92rem;line-height:1.3}
  .card-accept .ca-pct{font-family:Georgia,serif;font-weight:700;font-size:1.15rem}
  .card-accept .ca-label{color:var(--muted)}
  .card-accept .ca-word{font-weight:700}
  .card-accept .ca-bar-track{flex:1 1 120px;min-width:90px;height:7px;background:#e7e0d2;border-radius:4px;overflow:hidden}
  .card-accept .ca-bar{height:100%;border-radius:4px;transition:width .4s ease}
  .cur-grid{display:grid;grid-template-columns:200px 1fr;gap:24px;margin-top:12px;align-items:stretch}

  /* Cost cards */
  .cost-card{display:flex;flex-direction:column}
  .cost-icon{color:var(--teal);display:inline-flex;margin-bottom:8px}
  .cost-card .v{font-size:1.65rem;margin-top:2px}
  .cost-note{color:var(--muted);font-size:.76rem;margin-top:4px}
  .tip-line{display:flex;align-items:flex-start;gap:7px;margin-top:auto;padding-top:12px;
    border-top:1px solid rgba(0,0,0,.08);font-size:.8rem;color:var(--muted);line-height:1.35}
  .tip-line .tip-ic{flex-shrink:0;color:var(--teal);display:inline-flex;margin-top:1px}
  .tip-line b{font-weight:700}
  .hotel-tiers{display:flex;gap:18px;margin-top:auto;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
  .hotel-tiers .ht{display:flex;flex-direction:column}
  .hotel-tiers .ht-k{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
  .hotel-tiers .ht-v{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;margin-top:2px}
  .rides{margin-top:auto;padding-top:12px;border-top:1px solid rgba(0,0,0,.08)}
  .rides-k{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:7px}
  .rides-list{display:flex;flex-wrap:wrap;gap:6px}
  .ride-chip{font-size:.74rem;font-weight:600;color:var(--green);background:rgba(24,94,63,.08);
    border:1px solid rgba(24,94,63,.18);border-radius:20px;padding:3px 10px}
  .rides-none{font-size:.8rem;color:var(--muted)}
  /* 4-up cost cards row */
  .cost-cards-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .drinks-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .drink-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    font-size:.9rem;border-bottom:1px solid rgba(0,0,0,.06);padding-bottom:9px}
  .drink-row:last-child{border-bottom:none;padding-bottom:0}
  .drink-row .dr-k{color:var(--ink)}
  .drink-row .dr-v{font-family:Georgia,serif;font-weight:700;white-space:nowrap}
  .drink-row .alc-note{color:var(--coral);font-weight:700;font-size:.76rem;text-align:right;line-height:1.25}
  .drinks-foot{margin-top:10px;font-size:.7rem;font-style:italic;color:var(--muted)}

  /* Transportation section */
  .transport-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-top:6px}
  .tcard{background:var(--card);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    cursor:pointer;transition:transform .2s, box-shadow .2s}
  .tcard:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,40,50,.16)}
  .tcard:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .tcard-more{margin-top:auto;padding-top:14px;font-size:.76rem;font-weight:700;color:var(--green)}
  .tcard-icon{color:var(--teal);display:inline-flex;margin-bottom:8px}
  .tcard-k{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);font-weight:700;margin-bottom:10px}
  .tcard-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .tcard-list li{font-size:.88rem;font-family:Georgia,serif;padding-left:14px;position:relative;line-height:1.3}
  .tcard-list li::before{content:"";position:absolute;left:0;top:.52em;width:5px;height:5px;border-radius:50%;background:var(--coral)}
  .tcard-none{font-size:.85rem;color:var(--muted);font-style:italic;margin:0}
  .car-info{display:flex;flex-direction:column;gap:9px}
  .car-row{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;
    border-bottom:1px solid rgba(0,0,0,.06);padding-bottom:9px}
  .car-row:last-child{border-bottom:none;padding-bottom:0}
  .car-k{color:var(--muted)}
  .car-v{font-family:Georgia,serif;font-weight:700;text-align:right}

  /* More-info modal */
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,30,25,.55);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:22px}
  .modal-overlay[hidden]{display:none}
  .modal-card{background:var(--card);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.35);
    max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:30px 30px 34px;position:relative}
  .modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border:none;border-radius:50%;
    background:var(--sand);color:var(--ink);font-size:1.5rem;line-height:1;cursor:pointer;transition:background .2s}
  .modal-close:hover{background:#e7e0d2}
  .modal-title{font-size:1.55rem;margin:0 0 14px;padding-right:34px}
  .modal-body{color:var(--muted);line-height:1.6}
  .modal-placeholder{font-style:italic}
  /* Airport modal content */
  .air-name{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;color:var(--ink);margin:0 0 6px}
  .air-dist{display:flex;align-items:baseline;gap:9px;margin-bottom:18px}
  .air-dist-v{font-family:Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--green)}
  .air-dist-k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .air-sub{font-size:.95rem;margin:0 0 4px;color:var(--ink)}
  .air-rows{margin:0}
  .air-rows dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;margin-top:15px}
  .air-rows dd{margin:3px 0 0;font-size:.92rem;color:var(--ink)}
  .air-taxi-meta{font-size:.84rem;color:var(--muted)}
  .air-transit{margin:4px 0 0;padding-left:18px}
  .air-transit li{margin:2px 0}
  .air-transit b{font-weight:700}
  .air-link{color:var(--green);font-weight:700}
  .air-foot{margin-top:18px;font-size:.78rem;color:var(--muted);font-style:italic;
    border-top:1px solid rgba(0,0,0,.08);padding-top:12px}
  .cur-local{background:var(--sand);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;justify-content:center}
  .cur-symbol{font-family:Georgia,serif;font-size:2.4rem;line-height:1;color:var(--green)}
  .cur-code{font-weight:700;letter-spacing:.06em;margin-top:8px;font-size:1.05rem}
  .cur-name{color:var(--muted);font-size:.86rem;margin-top:2px}
  .cur-conv{display:flex;flex-direction:column;justify-content:center;gap:12px}
  .conv-sub{font-size:.78rem;color:var(--muted);font-weight:600}
  .conv-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .conv-field{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid rgba(24,94,63,.22);
    border-radius:12px;padding:10px 14px;flex:1;min-width:150px;overflow:hidden}
  .conv-field:focus-within{border-color:var(--green)}
  .conv-field input{border:none;outline:none;background:transparent;font-size:1.05rem;font-family:inherit;
    color:var(--ink);flex:1 1 auto;width:auto;min-width:48px}
  .conv-field .tag{font-weight:700;color:var(--teal);font-size:.9rem;flex-shrink:0}
  .conv-field select{border:none;outline:none;background:transparent;font-size:.9rem;font-weight:700;
    color:var(--teal);font-family:inherit;cursor:pointer;flex:0 1 auto;min-width:0;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
  .conv-eq{font-size:1.3rem;color:var(--muted);font-weight:700;flex-shrink:0}
  .conv-swap{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;
    transition:background .2s, transform .35s}
  .conv-swap:hover{background:var(--teal)}
  .conv-swap:active{transform:rotate(180deg)}
  .conv-swap svg{display:block}
  .conv-rate{font-size:.82rem;color:var(--muted)}
  .conv-rate b{color:var(--ink)}
  .conv-rate .src{font-size:.72rem;opacity:.8;margin-left:4px}

  /* Neighborhood guide */
  .hood-intro{color:var(--muted);font-size:1.02rem;max-width:760px;margin:0 0 24px;font-style:italic}
  .hoods{display:flex;flex-direction:column;gap:22px}
  .hood{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .hood-hero{position:relative;height:260px;background:#1a3a2a center/cover no-repeat;transition:background-image .4s}
  .hood-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.08) 100%)}
  .hood-name{position:absolute;bottom:28px;left:0;right:0;z-index:1;font-size:1.6rem;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);margin:0;padding:0 28px}
  .hood-credit{position:absolute;bottom:8px;right:12px;z-index:1;font-size:.65rem;color:rgba(255,255,255,.7);line-height:1.3}
  .hood-credit a{color:rgba(255,255,255,.8);text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:2px}
  .hood-credit a:hover{color:#fff}
  .hood-body{padding:22px;display:flex;flex-direction:column;flex:1}
  .hood-desc{color:var(--muted);font-size:.92rem;margin:0 0 16px;font-style:italic}
  .hood-lodging{margin-top:auto;border-top:1px solid rgba(0,0,0,.07);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .lodge-row{display:flex;align-items:baseline;gap:10px}
  .lodge-tier{flex-shrink:0;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 0;border-radius:20px;color:#fff;width:84px;text-align:center}
  .lodge-name{font-size:.86rem;color:var(--muted);font-style:italic}

  .sec-head{font-size:1.8rem;margin:0 0 22px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .tile{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    transition:transform .25s, box-shadow .25s;display:flex;flex-direction:column}
  .tile:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(20,40,50,.18)}
  .tile .photo{height:180px;background-size:cover;background-position:center}
  .tile .body{padding:16px 18px 20px}
  .tile .date{color:var(--teal);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em}
  .tile h3{font-size:1.1rem;margin:6px 0 8px;line-height:1.3}
  .tile p{color:var(--muted);font-size:.9rem;margin:0}
  .tile .readmore{display:inline-block;margin-top:12px;color:var(--green);font-weight:700;font-size:.82rem}

  .back{display:inline-block;margin-top:8px;background:var(--green);color:#fff;font-weight:700;
    padding:12px 22px;border-radius:30px;transition:background .2s}
  .back:hover{background:var(--teal)}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:40px}
  footer .brand{justify-content:center;color:#e97451}

  .notfound{text-align:center;padding:120px 22px}
  .notfound h1{font-size:2.4rem;margin-bottom:10px}

  @media(max-width:820px){
    nav.links{display:none}
    .facts{grid-template-columns:repeat(2,1fr)}
    .fact-wide{grid-column:1/-1}
    .temp-rows{grid-template-columns:repeat(2,1fr)}
    .temp-row{border-right:none;border-bottom:1px solid rgba(0,0,0,.07);padding:10px 0}
    .temp-row:nth-child(2n){padding-left:14px;border-left:1px solid rgba(0,0,0,.07)}
    .temp-row:last-child{border-bottom:none}
    .tiles{grid-template-columns:1fr}
    .cur-grid{grid-template-columns:1fr}
    .cost-cards-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:520px){
    .facts{grid-template-columns:1fr}
    .temp-rows{grid-template-columns:1fr}
    .temp-row:nth-child(2n){padding-left:0;border-left:none}
    .cost-cards-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">

/* Returns a CSS color for a given °F temperature */
function tempColor(f) {
  if (f <= 35)  return '#74b9ff'; /* cold blue   */
  if (f <= 50)  return '#55efc4'; /* cool teal   */
  if (f <= 65)  return '#a8e063'; /* mild green  */
  if (f <= 78)  return '#ffeaa7'; /* warm yellow */
  if (f <= 90)  return '#fd9644'; /* hot orange  */
  return '#e55039';               /* very hot red */
}

/* Maps °F to a 0–100 bar width (anchored at 28°F min, 110°F max) */
function tempWidth(f) {
  return Math.min(100, Math.max(4, Math.round((f - 28) / 82 * 100)));
}

/* Convert °F to °C */
function toCelsius(f) { return Math.round((f - 32) * 5 / 9); }

/* Season names per quarter (Jan–Mar, Apr–Jun, Jul–Sep, Oct–Dec) by latitude:
   tropical = wet/dry; otherwise four seasons flipped for the southern hemisphere. */
function seasonsFor(lat) {
  if (Math.abs(lat) < 20) return ["Dry season","Hot season","Wet season","Wet season"];
  return lat < 0
    ? ["Summer","Autumn","Winter","Spring"]
    : ["Winter","Spring","Summer","Autumn"];
}

/* Colour for a safety index (higher = safer), 5 tiers */
function safetyColor(s) {
  if (s >= 80) return "#1d9a6c"; // 80–100  green
  if (s >= 60) return "#7cb342"; // 60–79   yellow-green
  if (s >= 40) return "#e0a800"; // 40–59   yellow
  if (s >= 20) return "#fd7e14"; // 20–39   orange
  return "#e01010";              // 0–19    bright red
}

/* Colour for a crime index (higher = worse), 5 tiers — inverse of safety */
function crimeColor(s) {
  if (s <= 19) return "#1d9a6c"; // 0–19    green
  if (s <= 39) return "#7cb342"; // 20–39   yellow-green
  if (s <= 59) return "#e0a800"; // 40–59   yellow
  if (s <= 79) return "#fd7e14"; // 60–79   orange
  return "#e01010";              // 80–100  bright red
}

  USD:1, EUR:0.92, GBP:0.79, JPY:150, CNY:7.2, AUD:1.52, CAD:1.36, CHF:0.88,
  HKD:7.8, SGD:1.34, THB:35, MYR:4.6, KRW:1350, TRY:34, AED:3.67, MAD:9.9,

/* Convert an amount from one currency to another via USD */
function convert(amount, from, to) {
  if (!RATES[from] || !RATES[to]) return null;
  return amount * (RATES[to] / RATES[from]);
}

/* Format a converted number sensibly (no decimals for big-unit currencies) */
function fmtMoney(x, code) {
  if (x === null || !isFinite(x)) return "—";
  const big = ["JPY","KRW","IDR","VND","HUF"].includes(code);
  if (big) return x.toLocaleString(undefined, {maximumFractionDigits:0});
  if (x !== 0 && Math.abs(x) < 0.01)  // tiny values: show real precision, not "0.00"
    return x.toLocaleString(undefined, {minimumFractionDigits:4, maximumFractionDigits:6});
  return x.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* Format a USD price converted into another currency for the cost cards
   (symbol prefix + sensibly rounded amount) */
function fmtPrice(usd, code) {
  const v = convert(usd, "USD", code);
  if (v === null) return "$" + usd.toLocaleString();
  const sym = (CURRENCIES[code] && CURRENCIES[code].s) || (code + " ");
  const digits = Math.abs(v) < 10 ? 1 : 0;
  return sym + v.toLocaleString(undefined, {maximumFractionDigits: digits});
}

/* Parse a population string like "7.4M" / "680K" into an absolute number */
function parsePop(s) {
  const n = parseFloat(s);
  if (/M/i.test(s)) return n * 1e6;
  if (/K/i.test(s)) return n * 1e3;
  return n;
}

/* Colour for the tourist-to-local ratio: >30% red, 10–30% yellow, ≤10% green */
function ratioColor(p) {
  if (p > 30) return "#e55039";
  if (p > 10) return "#e0a800";
  return "#1d9a6c";
}

    <div class="temp-row">
      <span class="season-label">${label} <span class="season-name">(${s})</span></span>
      <span class="temp-val">${f}°F / ${toCelsius(f)}°C</span>
      ${r == null ? "" : `<span class="rain-val">${RAIN_ICON} ${Math.round(r / 3)} days/mo</span>`}
      <div class="temp-bar-track">
        <div class="temp-bar" style="width:${tempWidth(f)}%;background:${tempColor(f)}"></div>
      </div>
    </div>`).join('');

  /* Currency card setup */
  const curCode = CITY_CUR[c.city] || "USD";
  const curInfo = CURRENCIES[curCode] || {s:curCode, n:curCode};
  const defaultTarget = curCode === "USD" ? "EUR" : "USD";
  const cardPct = CITY_CARD[c.city];
  const cardLvl = cardPct != null ? cardLevel(cardPct) : null;
  const cardAcceptHTML = cardPct == null ? "" : `
          <div class="card-accept">
            <span class="ca-icon" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/>
              </svg>
            </span>
            <div class="ca-text">
              <span class="ca-pct" style="color:${cardLvl.c}">${cardPct}%</span>
              <span class="ca-label"> of businesses take cards — <span class="ca-word" style="color:${cardLvl.c}">${cardLvl.w}</span></span>
            </div>
            <div class="ca-bar-track"><div class="ca-bar" style="width:${cardPct}%;background:${cardLvl.c}"></div></div>
          </div>`;

  const cost = CITY_COST[c.city];
  const hotelRange = CITY_HOTEL[c.city];
  const rides = CITY_RIDES[c.city];
  const drinks = CITY_DRINKS[c.city];

  /* Emergency numbers + embassy finder card */
  const em = CITY_EMERGENCY[c.city];
  const telHref = s => "tel:" + s.replace(/\D/g, "");
  const emergencyHTML = !em ? "" : `
          <div class="emrg">
            <div class="emrg-row"><span class="emrg-k">Police</span><span class="emrg-v"><a href="${telHref(em.police)}">${em.police}</a></span></div>
            <div class="emrg-row"><span class="emrg-k">Ambulance / Fire</span><span class="emrg-v"><a href="${telHref(em.medical)}">${em.medical}</a></span></div>
            ${em.note ? `<div class="emrg-note">${em.note}</div>` : ""}
          </div>`;
  const embassyCardHTML = `
        <div class="fact safety-card">
          <div class="k">Emergency &amp; embassy</div>
          ${emergencyHTML}
          <div class="embassy">
            <label class="embassy-k" for="embassy-sel">Find your embassy</label>
            <select id="embassy-sel">
              <option value="" selected>Select your country…</option>
              ${EMBASSY_COUNTRIES.map(cc => `<option value="${cc}">${cc}</option>`).join('')}
            </select>
            <p class="embassy-hint" id="embassy-hint">Pick a country for a Maps link to the nearest embassy.</p>
            <a class="embassy-link" id="embassy-link" target="_blank" rel="noopener" hidden></a>
          </div>
        </div>`;

  const ridesHTML = rides == null ? "" : `
          <div class="rides">
            <span class="rides-k">Ride-share apps</span>
            ${rides.length
              ? `<div class="rides-list">${rides.map(r => `<span class="ride-chip">${r}</span>`).join('')}</div>`
              : `<span class="rides-none">Local taxis — no major apps</span>`}
          </div>`;
  const tip = CITY_TIP[c.city];
  const tipLvl = tip ? tipInfo(tip.s) : null;
  const tipHTML = !tip ? "" : `
          <div class="tip-line">
            <span class="tip-ic" aria-hidden="true">${TIP_ICON}</span>
            <span>Tipping <b style="color:${tipLvl.c}">${tipLvl.w}</b> &middot; ${tip.r}</span>
          </div>`;
  /* Build the three cost cards with prices in the given currency code */
  function buildCostCards(code) {
    if (cost == null) return "";
    const hotelTiers = !hotelRange ? "" : `
          <div class="hotel-tiers">
            <div class="ht"><span class="ht-k">Budget</span><span class="ht-v">${fmtPrice(hotelRange.b, code)}</span></div>
            <div class="ht"><span class="ht-k">High-end</span><span class="ht-v">${fmtPrice(hotelRange.h, code)}</span></div>
          </div>`;
    return `
        <div class="fact cost-card">
          <span class="cost-icon" aria-hidden="true">${COST_ICONS.hotel}</span>
          <div class="k">Hotel &middot; per night</div>
          <div class="v">${fmtPrice(cost.hotel, code)}</div>
          <div class="cost-note">mid-range &middot; avg, ${code}</div>
          ${hotelTiers}
        </div>
        <div class="fact cost-card">
          <span class="cost-icon" aria-hidden="true">${COST_ICONS.meal}</span>
          <div class="k">Meal &middot; per person</div>
          <div class="v">${fmtPrice(cost.meal, code)}</div>
          <div class="cost-note">sit-down restaurant &middot; ${code}</div>
          ${tipHTML}
        </div>
        <div class="fact cost-card">
          <span class="cost-icon" aria-hidden="true">${COST_ICONS.taxi}</span>
          <div class="k">Taxi / Uber &middot; 10 km</div>
          <div class="v">${fmtPrice(cost.taxi, code)}</div>
          <div class="cost-note">typical fare &middot; ${code}</div>
          ${ridesHTML}
        </div>
        ${drinks == null ? "" : `
        <div class="fact cost-card">
          <span class="cost-icon" aria-hidden="true">${DRINK_ICON}</span>
          <div class="k">Drinks</div>
          <div class="drinks-list">
            <div class="drink-row"><span class="dr-k">Coffee &middot; takeaway</span><span class="dr-v">${fmtPrice(drinks.coffee, code)}</span></div>
            <div class="drink-row"><span class="dr-k">Beer &middot; 0.5L</span>${
              typeof drinks.beer === "number"
                ? `<span class="dr-v">${fmtPrice(drinks.beer, code)}</span>`
                : `<span class="alc-note">${drinks.beer === "notallowed" ? "Public alcohol not allowed" : "Public alcohol restricted"}</span>`
            }</div>
            <div class="drink-row"><span class="dr-k">Water &middot; bottle</span><span class="dr-v">${fmtPrice(drinks.water, code)}</span></div>
          </div>
          <div class="drinks-foot">average prices per drink</div>
        </div>`}`;
  }

  /* Build the transportation cards; car rental price uses currency `code` */
  function buildTransport(code) {
    const t = CITY_TRANSPORT[c.city];
    if (!t) return "";
    const listCard = (icon, title, items, emptyMsg) => `
        <div class="tcard" tabindex="0" role="button" data-info="${title}" aria-label="${title} — more info">
          <span class="tcard-icon" aria-hidden="true">${icon}</span>
          <div class="tcard-k">${title}</div>
          ${items && items.length
            ? `<ul class="tcard-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`
            : `<p class="tcard-none">${emptyMsg}</p>`}
          <span class="tcard-more">More info &rarr;</span>
        </div>`;
    const side = t.car.side === "left" ? "Left" : "Right";
    const carCard = `
        <div class="tcard" tabindex="0" role="button" data-info="Car rental" aria-label="Car rental — more info">
          <span class="tcard-icon" aria-hidden="true">${TRANSPORT_ICONS.car}</span>
          <div class="tcard-k">Car rental</div>
          <div class="car-info">
            <div class="car-row"><span class="car-k">Drives on</span><span class="car-v">${side} side</span></div>
            <div class="car-row"><span class="car-k">Int'l permit</span><span class="car-v">${t.car.idp}</span></div>
            <div class="car-row"><span class="car-k">Mid-size &middot; day</span><span class="car-v">${fmtPrice(t.car.rental, code)}</span></div>
          </div>
          <span class="tcard-more">More info &rarr;</span>
        </div>`;
    return listCard(TRANSPORT_ICONS.air, "Major airports", t.air, "—")
         + listCard(TRANSPORT_ICONS.train, "Major train stations", t.train, "No intercity rail")
         + listCard(TRANSPORT_ICONS.bus, "Major bus stations", t.bus, "—")
         + listCard(TRANSPORT_ICONS.ferry, "Ferry / boat ports", t.ferry, "No passenger ferry ports")
         + carCard;
  }

  content.innerHTML = `
    <div class="hero" style="background-image:url('${hero}')">
      <div class="hero-inner">
        <div class="crumb"><a href="${crumbHref}">${crumbText}</a> &nbsp;/&nbsp; ${c.country}</div>
        <h1>${c.city}</h1>
        <div class="country">${c.country}</div>
        <p class="tagline">${c.tagline}</p>
        <div class="chip"><b>${num}M</b><span>annual visitors</span></div>
      </div>
    </div>

    <section class="i18n-ml">
      <p class="lead">${c.city} draws around <b>${num} million</b> international travelers a year — and it's easy to see why. ${c.tagline} This is where a full write-up of the city will live: how it feels to arrive, the neighborhoods worth wandering, and the moments that made it unforgettable.</p>
      <div class="placeholder-note">📝 Placeholder text — this intro, the photos, and the stories below are samples. Real content gets added per city as you publish.</div>

      <div class="facts">
        <div class="fact fact-wide">
          <div class="temp-head">
            <div class="k">Best time to visit &mdash; avg high temperature</div>
            <div class="temp-foot">${RAIN_ICON} Average measurable rain days per month</div>
          </div>
          <div class="temp-rows">${tempRowsHTML}</div>
        </div>
        <div class="fact stat-combo">
          <div class="sc-top">
            <div class="sc-item"><div class="k">Population</div><div class="v">${c.pop}</div></div>
            <div class="sc-item"><div class="k">Annual visitors</div><div class="v">${num} M</div></div>
          </div>
          <div class="sc-metrics">
            ${touristRatio == null ? "" : `<div class="ratio-line">Daily tourist-to-local ratio <b style="color:${ratioColor(touristRatio)}">${touristRatio}%</b> &middot; ~${stayDays}-day avg stay</div>`}
            ${walkLvl == null ? "" : `<div class="ratio-line">Walk score <b style="color:${walkLvl.c}">${walk}/100</b> &middot; ${walkLvl.w}</div>`}
            ${safety == null ? "" : `<div class="ratio-line">Safety index <a class="idx-link" href="http://www.google.de/search?q=${encodeURIComponent(c.city + ' safety index')}" target="_blank" rel="noopener" style="color:${safetyColor(safety.safety)}">${safety.safety}</a> &middot; Crime index <a class="idx-link" href="http://www.google.de/search?q=${encodeURIComponent(c.city + ' crime index')}" target="_blank" rel="noopener" style="color:${crimeColor(safety.crime)}">${safety.crime}</a></div>`}
          </div>
          <p class="stat-disclaimer"><em>*these average figures are displayed for reference purposes and may not reflect real world conditions</em></p>
        </div>
        ${embassyCardHTML}
        <div class="fact">
          <div class="k">Languages spoken by majority</div>
          <div class="lang-list">
            ${c.langs.map(({l,p})=>`
            <div class="lang-row">
              <span class="lang-name">${l}</span>
              <div class="lang-bar-track"><div class="lang-bar" style="width:${p}%"></div></div>
              <span class="lang-pct">${p}%</span>
            </div>`).join('')}
          </div>
          <div class="rel-section">
            <div class="k rel-k">Religion by majority</div>
            <div class="lang-list">
              ${(CITY_RELIGION[c.city]||[]).map(({r,p})=>`
              <div class="lang-row">
                <span class="lang-name">${r}</span>
                <div class="lang-bar-track"><div class="lang-bar rel-bar" style="width:${p}%"></div></div>
                <span class="lang-pct rel-pct">${p}%</span>
              </div>`).join('')}
            </div>
          </div>
        </div>
        <div class="fact fact-wide">
          <div class="k">Currency &amp; converter</div>
          ${cardAcceptHTML}
          <div class="cur-grid">
            <div class="cur-local">
              <div class="cur-symbol">${curInfo.s}</div>
              <div class="cur-code">${curCode}</div>
              <div class="cur-name">${curInfo.n}</div>
            </div>
            <div class="cur-conv">
              <div class="conv-sub">Enter an amount, pick a currency, or tap &#8644; to reverse</div>
              <div class="conv-row" id="conv-row"></div>
              <div class="conv-rate" id="conv-rate"></div>
            </div>
          </div>
        </div>
        <div id="cost-cards" class="cost-cards-grid"></div>
      </div>
    </section>

    <section style="padding-top:0">
      <h2 class="sec-head">Getting around ${c.city}</h2>
      <div id="transport-cards" class="transport-grid"></div>
    </section>

    <section style="padding-top:0">
      <h2 class="sec-head">Neighborhood guide &mdash; ${c.city}</h2>
      <p class="hood-intro">Placeholder — an overview of ${c.city}'s neighborhoods will go here, helping you choose the right base for your trip.</p>
      <div class="hoods">${hoodsHTML}</div>
    </section>

    <section style="padding-top:0">
      <h2 class="sec-head">Stories from ${c.city}</h2>
      <div class="tiles">
        ${stories.map(s=>`
          <a class="tile" href="post.html?post=${encodeURIComponent(s.s)}">
            <div class="photo" style="background-image:url('https://picsum.photos/seed/${s.s}/600/400')"></div>
            <div class="body">
              <div class="date">${s.d}</div>
              <h3>${s.t}</h3>
              <p>A short preview of the post will appear here.</p>
              <span class="readmore">Read story &rarr;</span>
            </div>
          </a>`).join("")}
      </div>
      <p style="margin-top:34px"><a class="back" href="${backHref}">${backLabel}</a></p>
    </section>`;

  /* ---------- Neighborhood hero images (Unsplash — most downloaded landscape) ---------- */
  (function loadHoodImages() {
    const landmarks = CITY_HOOD_LANDMARK[c.city] || {};
    document.querySelectorAll('.hood-hero[data-hood]').forEach(async el => {
      const name = el.dataset.hood;
      const landmark = landmarks[name];
      const query = landmark ? `${landmark} ${c.city}` : `${name} ${c.city}`;
      const fallback = `https://picsum.photos/seed/${encodeURIComponent(c.city + '-' + name)}/1200/520`;

      try {
        const r = await fetch(`/.netlify/functions/image?q=${encodeURIComponent(query)}`);
        if (!r.ok) throw new Error('fetch failed');
        const d = await r.json();
        if (d.url) {
          el.style.backgroundImage = `url('${d.url}')`;
          const creditEl = el.querySelector('.hood-credit');
          if (creditEl && d.credit) {
            const utm = 'utm_source=never_roam_alone&utm_medium=referral';
            const photographerUrl = d.creditLink ? `${d.creditLink}?${utm}` : `https://unsplash.com/?${utm}`;
            const unsplashUrl = `https://unsplash.com/?${utm}`;
            creditEl.innerHTML = `Photo by <a href="${photographerUrl}" target="_blank" rel="noopener">${d.credit}</a> on <a href="${unsplashUrl}" target="_blank" rel="noopener">Unsplash</a>`;
          }
        } else {
          el.style.backgroundImage = `url('${fallback}')`;
        }
      } catch (_) {
        el.style.backgroundImage = `url('${fallback}')`;
      }
    });
  })();

  /* ---------- Converter wiring (reversible) ---------- */
  const localCode = curCode;
  let compareCode = defaultTarget;
  let reversed = false;   // false: local → compare ; true: compare → local
  let lastRaw = null;     // last converted value, carried over on swap

  const SWAP_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;

  function compareOptions() {
    return Object.keys(CURRENCIES)
      .filter(code => code !== localCode)
      .map(code => `<option value="${code}"${code === compareCode ? " selected" : ""}>${code} · ${CURRENCIES[code].n}</option>`)
      .join('');
  }

  function fieldHTML(role, isLocal) {
    const input = role === "from"
      ? `<input id="conv-amt" type="number" min="0" step="any" aria-label="Amount to convert" />`
      : `<input id="conv-out" type="text" readonly aria-label="Converted amount" />`;
    const currency = isLocal
      ? `<span class="tag">${localCode}</span>`
      : `<select id="conv-sel" aria-label="Compare currency">${compareOptions()}</select>`;
    return `<div class="conv-field">${input}${currency}</div>`;
  }

  function renderConverter(amount) {
    const fromLocal = !reversed;
    document.getElementById("conv-row").innerHTML =
      fieldHTML("from", fromLocal) +
      `<button type="button" class="conv-swap" id="conv-swap" title="Reverse currencies" aria-label="Reverse currencies">${SWAP_SVG}</button>` +
      fieldHTML("to", !fromLocal);
    document.getElementById("conv-amt").value = amount;
    bindConverter();
    renderConversion();
  }

  function renderConversion() {
    const fromCode = reversed ? compareCode : localCode;
    const toCode   = reversed ? localCode : compareCode;
    const amt = parseFloat(document.getElementById("conv-amt").value);
    lastRaw = isNaN(amt) ? null : convert(amt, fromCode, toCode);
    document.getElementById("conv-out").value = lastRaw === null ? "" : fmtMoney(lastRaw, toCode);
    const one = convert(1, fromCode, toCode);
    document.getElementById("conv-rate").innerHTML =
      `1 ${fromCode} = <b>${fmtMoney(one, toCode)} ${toCode}</b>` +
      `<span class="src">· ${ratesLive ? "live rates" : "approx. rates"}</span>`;
  }

  function renderCosts() {
    const el = document.getElementById("cost-cards");
    if (el) el.innerHTML = buildCostCards(compareCode);
    const tel = document.getElementById("transport-cards");
    if (tel) tel.innerHTML = buildTransport(compareCode);
  }

  function bindConverter() {
    document.getElementById("conv-amt").addEventListener("input", renderConversion);
    document.getElementById("conv-sel").addEventListener("change", e => {
      compareCode = e.target.value;
      renderConversion();
      renderCosts();   // cost + transport cards follow the selected currency
    });
    document.getElementById("conv-swap").addEventListener("click", () => {
      const carry = (lastRaw !== null && isFinite(lastRaw)) ? +lastRaw.toFixed(4) : 1;
      reversed = !reversed;
      renderConverter(carry);
    });
  }

  renderConverter(1);
  renderCosts();

  /* Refine with live rates when online (free, no API key needed) */
  fetch("https://open.er-api.com/v6/latest/USD")
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      if (data && data.result === "success" && data.rates) {
        RATES = Object.assign({}, RATES, data.rates);
        ratesLive = true;
        renderConversion();
        renderCosts();   // refresh cost cards with live rates
      }
    })
    .catch(() => { /* keep fallback rates silently */ });

  /* ---------- Transport card "more info" popup ---------- */
  const modal      = document.getElementById("info-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalBody  = document.getElementById("modal-body");
  const modalClose = document.getElementById("modal-close");

  function buildAirportModal(code) {
    const a = CITY_AIRPORT[c.city];
    if (!a) return `<p class="modal-placeholder">More information coming soon.</p>`;
    const mi = Math.round(a.km * 0.621371);
    const others = ((CITY_TRANSPORT[c.city] && CITY_TRANSPORT[c.city].air) || []).filter(x => x !== a.name);
    const rideText = a.ride.avail === "no"
      ? "Not available"
      : `${a.ride.avail === "limited" ? "Limited availability" : "Available"} &middot; avg ${fmtPrice(a.ride.cost, code)}`;
    const transit = a.transit.map(t => `<li>${t.m} — <b>${t.c === 0 ? "free" : fmtPrice(t.c, code)}</b></li>`).join("");
    const tx = CITY_TAXI[c.city];
    const taxiMeta = tx ? `<br><span class="air-taxi-meta">Official: ${tx.color} &middot; <b style="color:${taxiFareColor(tx.fare)}">${tx.fareNote}</b></span>` : "";
    return `
      <p class="air-name">${a.name}</p>
      <div class="air-dist"><span class="air-dist-v">${a.km} km / ${mi} mi</span><span class="air-dist-k">to city center</span></div>
      <h4 class="air-sub">Getting to the city center</h4>
      <dl class="air-rows">
        <dt>Car rental</dt><dd>Drive ~${a.drive} &middot; on-site counters: ${a.rentals.join(", ")}</dd>
        <dt>Car service</dt><dd>avg ${fmtPrice(a.carService, code)} &middot; <a class="air-link" href="#">Book a transfer &rarr;</a></dd>
        <dt>Taxi</dt><dd>avg ${fmtPrice(a.taxi, code)}${taxiMeta}</dd>
        <dt>Ride-hailing</dt><dd>${rideText}</dd>
        <dt>Public transit</dt><dd><ul class="air-transit">${transit}</ul></dd>
      </dl>
      ${others.length ? `<p class="air-foot">Figures shown for ${a.name}. Other airports: ${others.join(", ")}.</p>` : ""}`;
  }

  function openModal(title) {
    modalTitle.textContent = `${title} — ${c.city}`;
    if (title === "Major airports" && CITY_AIRPORT[c.city]) {
      modalBody.innerHTML = buildAirportModal(compareCode);
    } else {
      // Placeholder content — detailed info to be filled in later.
      modalBody.innerHTML = `<p class="modal-placeholder">More information about ${title.toLowerCase()} in ${c.city} is coming soon.</p>`;
    }
    modal.hidden = false;
    document.body.style.overflow = "hidden";
    modalClose.focus();
  }
  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = "";
  }

  // Open on card click (event delegation — survives re-renders)
  const transportEl = document.getElementById("transport-cards");
  if (transportEl) {
    transportEl.addEventListener("click", e => {
      const card = e.target.closest(".tcard");
      if (card && card.dataset.info) openModal(card.dataset.info);
    });
    transportEl.addEventListener("keydown", e => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest(".tcard");
      if (card && card.dataset.info) { e.preventDefault(); openModal(card.dataset.info); }
    });
  }

  // Dismiss: X button, backdrop click, or Escape
  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

  /* ---------- Embassy finder ---------- */
  const embSel  = document.getElementById("embassy-sel");
  const embLink = document.getElementById("embassy-link");
  const embHint = document.getElementById("embassy-hint");
  if (embSel) {
    embSel.addEventListener("change", () => {
      const country = embSel.value;
      if (!country) {
        embLink.hidden = true;
        if (embHint) embHint.hidden = false;
        return;
      }
      const q = encodeURIComponent(`${country} embassy or consulate in ${c.city}`);
      embLink.href = `https://www.google.com/maps/search/?api=1&query=${q}`;
      embLink.textContent = `Nearest ${country} embassy on Google Maps →`;
      embLink.hidden = false;
      if (embHint) embHint.hidden = true;
    });
  }
}
</script>
<script src="nav.js"></script>
<script src="i18n.js"></script>
</body>
</html>
