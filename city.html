  "Berlin":["Kreuzberg is Berlin's multicultural, alternative core with legendary nightlife, Turkish markets, street art and canal-side bars, perfect for nightlife lovers and creatives.","Mitte is the historic and cultural center holding Museum Island, Brandenburg Gate and upscale galleries, ideal for first-time visitors and sightseers wanting central access.","Prenzlauer Berg is a beautifully restored, family-friendly district of cafes, playgrounds and Sunday markets, suited to families and travelers seeking a calmer stay.","Friedrichshain is a young, energetic area famed for techno clubs, the East Side Gallery and cheap eats, drawing partygoers and budget-minded backpackers.","Neukölln is Berlin's edgy, rapidly gentrifying hipster quarter with dive bars, diverse food and a raw creative energy, appealing to trend-seeking young travelers."],
  "Melbourne":["Fitzroy is Melbourne's bohemian creative hub with vintage shops, street art, live music and buzzing Brunswick Street bars, perfect for hip young travelers and night owls.","St Kilda is the bayside beach suburb with a seaside promenade, Luna Park, cake shops and lively nightlife, great for beachgoers and backpackers.","Carlton is the historic Italian quarter around Lygon Street, home to Melbourne University, classic cafes and pasta restaurants, suited to students and food lovers.","Southbank is the polished riverside precinct of arts venues, casino, high-rise hotels and Yarra promenade dining, ideal for luxury and first-time visitors.","Richmond is a trendy, gritty-chic inner suburb with Vietnamese eateries on Victoria Street, hip pubs and boutiques, appealing to foodies and younger travelers."],
  "Munich":["Altstadt is Munich's historic old town centered on Marienplatz, packed with landmarks, beer halls and the Viktualienmarkt, ideal for first-time visitors and sightseers.","Schwabing is the elegant former artists' quarter beside the English Garden, full of cafes, boutiques and leafy streets, suited to relaxed and upmarket travelers.","Maxvorstadt is the university and museum district holding the Pinakothek galleries, with student cafes and a cultured, intellectual vibe, great for art lovers.","Haidhausen is a charming, village-like neighborhood of cobbled squares, wine bars and the Gasteig arts center, appealing to families and calmer stays.","Glockenbachviertel is Munich's trendy nightlife and LGBTQ+ district with stylish bars, design shops and riverside walks, perfect for a lively social scene."],
  "Las Vegas":["The Strip is the iconic 4-mile boulevard of mega-resort casinos, shows, clubs and fountains, the classic base for first-time visitors, nightlife and non-stop action.","Downtown and Fremont Street offer vintage neon casinos, a covered light canopy and a cheaper, retro party atmosphere, great for budget travelers and old-school Vegas fans.","Summerlin is an affluent master-planned suburb near Red Rock Canyon with golf, upscale dining and Downtown Summerlin shopping, suited to families and quieter, resort-style stays.","Henderson is a safe, family-friendly suburb southeast of the Strip with parks, lakes and relaxed neighborhoods, appealing to travelers wanting a calm residential base.","Chinatown along Spring Mountain Road is the city's beloved Asian dining district, packed with authentic restaurants and late-night eats, perfect for foodies away from the Strip."],
  "Florence":["Oltrarno is the artisan quarter across the Arno, full of workshops, leather makers, wine bars and a genuine local feel, ideal for travelers seeking authentic, less touristy Florence.","Santa Croce surrounds the great Franciscan basilica and Michelangelo's tomb, a lively area of leather markets, trattorias and nightlife, great for sightseers and evening buzz.","San Lorenzo centers on the bustling Mercato Centrale food hall and street market near the Medici chapels, a busy, budget-friendly base popular with foodies.","Santo Spirito is a bohemian Oltrarno square district of buzzing aperitivo bars, artists and a beloved local piazza, perfect for a hip, laid-back and social stay.","Santa Maria Novella wraps around the main train station and its namesake church, a convenient, well-connected hub handy for arrivals and first-time visitors."],
  "Dublin":["Temple Bar is Dublin's cobbled tourist and nightlife hub of pubs, live music and revelry, lively but pricey, best for partygoers and first-timers wanting to be in the thick of it.","Ballsbridge is a leafy, affluent embassy district of Georgian and Victorian homes, upscale hotels and rugby at the Aviva Stadium, suited to luxury and quieter, refined stays.","Rathmines is a popular residential and student neighborhood just south of the center, with relaxed cafes, pubs and good value, appealing to budget travelers and longer stays.","The Liberties is one of Dublin's oldest working-class quarters, home to the Guinness Storehouse and whiskey distilleries, gritty and increasingly hip for history and craft-drink fans.","Smithfield is a regenerated northside square district around the Jameson distillery with cocktail bars and a cinema, a trendy, up-and-coming base for younger travelers."],
  "Kyoto":["Gion is Kyoto's famous geisha district of wooden teahouses, lantern-lit lanes and traditional performances, ideal for travelers seeking classic old-Japan atmosphere and culture.","Higashiyama is the beautifully preserved eastern temple district around Kiyomizu-dera and Sannenzaka, full of shrines and craft shops, perfect for sightseeing and history lovers.","Arashiyama is a scenic western area of bamboo groves, riverside walks, temples and monkey park, a nature-focused, day-trip-style base great for photographers and families.","Pontocho is a narrow, atmospheric alley beside the Kamo River lined with intimate restaurants and bars, ideal for evening dining, romance and traditional nightlife.","Fushimi is the sake-brewing southern district and home of Fushimi Inari's thousand torii gates, appealing to travelers wanting shrines, sake tasting and fewer crowds."],
  "Lisbon":["Alfama is Lisbon's oldest quarter, a maze of steep cobbled alleys, fado houses and viewpoints beneath the castle, ideal for travelers wanting historic charm and atmosphere.","Bairro Alto is the city's bohemian nightlife hub, quiet by day and packed with bars, restaurants and music by night, perfect for partygoers and night owls.","Chiado is the elegant, cultured shopping district of historic cafes, theaters and boutiques between Bairro Alto and Baixa, suited to stylish and first-time visitors.","Baixa is the flat, grand downtown grid of pedestrian streets, plazas and shops rebuilt after the 1755 earthquake, a central, convenient base for sightseers.","Belém is the riverside monumental district of the Jerónimos Monastery, Belém Tower and famous custard tarts, great for families and history and culture lovers."],
  "Venice":["San Marco is the glamorous heart of Venice around St. Mark's Square and Basilica, home to luxury hotels, designer shops and top sights, ideal for first-timers and upscale stays despite the crowds.","Cannaregio is a lively, more residential sestiere with the historic Jewish Ghetto, canal-side bars and local trattorias, great for authentic atmosphere and better value.","Dorsoduro is the artsy, student district of the Accademia and Guggenheim museums, buzzing Campo Santa Margherita nightlife and calmer canals, suited to culture lovers and younger travelers.","Castello is the largest, most local sestiere east of San Marco, quieter and residential with the Arsenale and Biennale gardens, appealing to travelers seeking everyday Venetian life.","San Polo is the bustling market district around the Rialto Bridge and Rialto Market, full of bacari wine bars and shops, perfect for foodies and central sightseeing."],
  "Athens":["Plaka is the picturesque old town beneath the Acropolis, a charming maze of neoclassical houses, tavernas and souvenir shops, ideal for first-time visitors wanting historic ambiance.","Monastiraki is the lively flea-market district of the old bazaar, rooftop bars with Acropolis views and buzzing streets, great for shoppers, nightlife and central sightseeing.","Kolonaki is Athens's chic, upscale neighborhood of designer boutiques, art galleries and stylish cafes on the slopes of Lycabettus, suited to luxury and fashionable travelers.","Psyrri is a gritty-turned-hip nightlife quarter packed with mezedopoleia, bars, street art and live music, perfect for younger travelers and an authentic party scene.","Koukaki is a trendy, laid-back residential area near the Acropolis Museum with local cafes and good value, appealing to travelers wanting a stylish yet relaxed base."],
  "Orlando":["Downtown Orlando is the walkable urban core around Lake Eola with high-rises, bars along Orange Avenue and nightlife, suited to travelers wanting city energy away from the theme parks.","Winter Park is an upscale, tree-lined suburb of brick streets, Park Avenue boutiques, museums and lakeside charm, ideal for refined, relaxed stays and culture lovers.","Lake Nona is a modern, master-planned community near the airport known for its medical city, sports campus and sleek new hotels, appealing to business and contemporary travelers.","Thornton Park is a trendy, walkable downtown-adjacent enclave of brick streets, cafes and wine bars near Lake Eola, great for young professionals and a stylish local vibe.","International Drive is the tourist strip of hotels, outlet malls, the ICON Park Ferris wheel and convention center, a convenient budget-to-mid base close to the attractions."],
  "Toronto":["Kensington Market is a bohemian, multicultural warren of vintage shops, street food, cafes and murals, ideal for young, budget and eclectic travelers seeking an offbeat vibe.","The Annex is a leafy, intellectual neighborhood near the University of Toronto with Victorian homes, bookish cafes and Bloor Street eats, suited to students and relaxed stays.","Yorkville is Toronto's luxury district of designer boutiques, upscale galleries, fine dining and five-star hotels, perfect for high-end shoppers and affluent visitors.","The Distillery District is a pedestrian-only Victorian industrial precinct of cobblestones, art galleries, boutiques and restaurants, great for couples and a charming historic setting.","Queen West is a hip, trendy strip of independent fashion, art galleries, music venues and nightlife, appealing to creatives and younger travelers wanting a cool scene."],
  "Miami":["South Beach is the iconic Art Deco beachfront of white sand, Ocean Drive nightlife, glamorous hotels and people-watching, ideal for partygoers, beach lovers and first-time visitors.","Wynwood is Miami's edgy arts district famous for the Wynwood Walls murals, breweries, galleries and hip eateries, perfect for creatives, foodies and young travelers.","Little Havana is the vibrant Cuban heart of Miami along Calle Ocho, with cigar shops, salsa, domino parks and authentic food, great for culture seekers and lively atmosphere.","Brickell is the sleek downtown financial district of high-rise condos, rooftop bars and upscale dining, suited to business travelers and those wanting a modern urban base.","Coconut Grove is a lush, laid-back bayfront village of leafy streets, sidewalk cafes, marinas and boutiques, appealing to families and travelers seeking a relaxed, upscale vibe."],
  "San Francisco":["The Mission is a lively, sunny, historically Latino neighborhood packed with taquerias, murals, dive bars and trendy restaurants, great for foodies, young creatives and nightlife seekers.","Haight-Ashbury is the storied birthplace of 1960s hippie counterculture, now a bohemian strip of vintage clothing shops, record stores and Victorians beside Golden Gate Park, appealing to music lovers and free spirits.","Nob Hill is an elegant, hilly enclave of grand historic hotels, cathedrals and cable cars with sweeping views, suiting upscale travelers who want refined, quiet surroundings near downtown.","Chinatown is one of the oldest and busiest Chinatowns in North America, a dense warren of dim sum halls, herb shops and temples that draws visitors wanting authentic food and cultural immersion.","The Castro is the world-famous heart of LGBTQ life in San Francisco, a vibrant, welcoming district of rainbow flags, bars, cafes and the historic Castro Theatre, ideal for the queer community and open-minded visitors."],
  "Shanghai":["Iconic waterfront promenade along the Huangpu River lined with grand colonial-era buildings and the classic view of Pudong skyscrapers across the water, best for first-time visitors who want landmark sightseeing, luxury riverfront hotels, and postcard skyline views.","Pudong's futuristic financial district bristling with supertall towers like the Shanghai Tower and the Oriental Pearl, ideal for business travelers and anyone wanting modern high-rise hotels, big malls, and dramatic skyline views.","Leafy, tree-lined district of historic villas, boutiques, cafes and wine bars with a relaxed European atmosphere, perfect for travelers who value charm, walkability, and a stylish, low-key neighborhood feel.","Upscale central district around Jing'an Temple mixing office towers, luxury shopping, and strong dining and nightlife, great for those who want convenience, buzz, and excellent metro connections in the heart of Puxi.","Trendy pedestrian enclave of restored shikumen stone-gate houses turned into chic restaurants, bars, and shops, suits visitors chasing nightlife, dining, and a polished cosmopolitan vibe."],
  "Frankfurt am Main":["Sachsenhausen sits just across the Main and pairs riverside museums with the cozy apple-wine taverns of Alt-Sachsenhausen, making it a lively pick for visitors who want nightlife, culture, and a walkable classic-Frankfurt feel.","Bornheim is a laid-back, family-friendly district built around the bustling Berger Strasse with its markets, cafes, and neighborhood pubs, suiting those who want an authentic residential vibe away from the tourist core.","Nordend is a leafy, upscale-but-relaxed residential area of handsome old apartment buildings, quiet streets, and independent cafes, ideal for professionals and families seeking a calm yet central base.","Westend is Frankfurt's elegant, affluent quarter of grand villas and green parks bordering the banking towers, best for those who want prestige, quiet, and proximity to the financial district.","Bockenheim is a diverse, youthful district anchored by the university, offering budget-friendly eats, ethnic groceries, and a bohemian energy that appeals to students and travelers seeking an unpretentious, multicultural scene."],
  "Copenhagen":["Norrebro is Copenhagen's most multicultural and edgy district, packed with independent cafes, ethnic eateries and buzzing nightlife around Jaegersborggade and Superkilen park, it suits students, young creatives and anyone drawn to a diverse, energetic vibe.","Vesterbro is a gritty-turned-trendy quarter centered on the hip Meatpacking District, full of craft bars, coffee shops and design boutiques, it appeals to young professionals and nightlife lovers who want an urban, bohemian scene close to the Central Station.","Osterbro is a leafy, affluent and family-friendly neighborhood near the lakes, Faelledparken and the harbor baths, with wide streets and calm residential charm, it suits families and well-off professionals wanting a quieter, upscale setting.","Christianshavn is a picturesque waterfront district laced with canals, houseboats and cobbled streets, home to Freetown Christiania and a laid-back bohemian feel, it appeals to those wanting a charming, characterful area within walking distance of the center.","Frederiksberg is an elegant, green and prosperous independent enclave known for its gardens, tree-lined avenues and stately apartments, it is ideal for families and affluent residents seeking a refined, peaceful lifestyle near the city core."],
  "Zurich":["Altstadt is Zurich's historic medieval old town core with cobbled lanes, churches and upscale shops, ideal for first-time visitors and history lovers who want to be in the heart of the action.","Niederdorf is the lively pedestrian old-town quarter on the east bank of the Limmat, packed with bars, restaurants and nightlife that suits younger travelers and social crowds.","Langstrasse in Kreis 4 is the gritty, multicultural former red-light district now reborn as Zurich's edgiest nightlife and bar hub, best for night owls and those wanting an alternative, unpolished scene.","Zurich-West in Kreis 5 is a former industrial zone turned trendy district of galleries, design shops, clubs and the Freitag tower, perfect for creatives and a hip, urban crowd.","Seefeld is an affluent, relaxed lakeside neighborhood on the east shore with chic cafes, boutiques and easy lake access, well suited to families and travelers seeking a quieter, upscale base."],
  "Washington, D.C.":["Historic cobblestone streets, upscale boutiques and waterfront dining make Georgetown a polished, picturesque quarter that suits luxury travelers and shoppers, though it has no Metro station of its own.","An elegant, walkable district of embassies, tree-lined streets, bookstores and lively bars around a central fountain, Dupont Circle is ideal for young professionals, LGBTQ travelers and those wanting central nightlife.","A bohemian, multicultural nightlife hub packed with ethnic restaurants, dive bars and live music, Adams Morgan draws a younger, energetic crowd looking for an eclectic and affordable scene.","Home to the U.S. Capitol, charming rowhouses, Eastern Market and neighborhood pubs, Capitol Hill blends political power with a residential, family-friendly feel that appeals to history buffs and quieter stays.","A trendy, revitalized area with a rich Black cultural heritage, buzzing along the U Street corridor with jazz history, cocktail bars and hip restaurants, Shaw suits foodies and nightlife seekers wanting an authentic local vibe."],
  "Pattaya-Chonburi":["Central Pattaya is the busy tourist heart, packed with big shopping malls like Central Festival, Beach Road, hotels and restaurants, it suits first-time visitors who want everything walkable and lively.","North Pattaya is calmer and a bit more upscale and residential while still close to the action, appealing to travelers and long-stay expats who want quiet nights but easy access to the center.","South Pattaya is the most intense party zone, home to Walking Street with its bars, clubs and go-go venues plus budget guesthouses, best for nightlife seekers and younger, price-conscious travelers.","Jomtien Beach is a longer, more relaxed stretch of sand with a laid-back mix of families, watersports and a large expat and long-stay community, ideal for those wanting beach time without the chaos.","Naklua keeps a traditional Thai fishing-village feel with fresh seafood markets and the quieter Wong Amat beach nearby, suiting families, retirees and long-stay visitors seeking a more local, peaceful base."],
  "Vancouver":["Gastown is Vancouver's historic cobblestone quarter with Victorian buildings, the famous steam clock, trendy restaurants and boutiques, great for visitors and young professionals who want walkable heritage charm and nightlife.","Yaletown is a polished former warehouse district of converted brick lofts, waterfront seawall and marina, upscale patios and design shops, suits affluent professionals and foodies who want a sleek downtown-adjacent scene.","Kitsilano is a laid-back beachside neighborhood with Kits Beach, health-focused cafes and yoga studios, and boutique shopping along West 4th, ideal for active, outdoorsy people and young families.","The West End is a dense, diverse and highly walkable residential area between Stanley Park and English Bay, home to the LGBTQ-friendly Davie Village, perfect for those wanting an urban beach lifestyle without a car.","Mount Pleasant is the artsy, hip heart of the city with Main Street's indie shops, craft breweries, murals and coffee roasters, a magnet for creatives, students and trend-conscious young locals."],
  "Stockholm":["Gamla Stan is Stockholm's medieval old town, a maze of cobblestone lanes and colorful facades around the Royal Palace, best for first-time visitors who want history and postcard charm though it is compact, touristy and pricey.","Sodermalm is the hip, bohemian island of vintage shops, indie cafes and buzzing nightlife, suiting younger creative travelers who want trendy streets, great views and a laid-back but lively scene.","Ostermalm is the elegant, upscale district of designer boutiques, embassies and fine dining around the historic food hall, ideal for luxury-minded visitors who value refined, quiet streets and high-end shopping.","Norrmalm is the central commercial and business core, home to the main train hub, department stores and big hotels, the most convenient base for shoppers and travelers who prize easy transport access over local character.","Vasastan is a leafy, residential area with excellent restaurants, cozy bars and a relaxed local feel, appealing to travelers who want an authentic, calmer neighborhood within easy reach of the center."],
  "Mexico City":["Condesa is a leafy, bohemian-chic district of Art Deco buildings, tree-lined avenues and buzzing sidewalk cafes and bars, ideal for younger travelers and digital nomads who want walkable nightlife and green parks.","Roma is a stylish, artsy neighborhood of restored mansions, indie galleries, specialty coffee and acclaimed restaurants, suiting foodies and creatives who want hip energy with a slightly more grown-up edge than Condesa.","Polanco is Mexico City's upscale, polished quarter of luxury hotels, designer boutiques on Avenida Presidente Masaryk and fine dining, best for affluent travelers and business visitors wanting comfort and safety.","Coyoacan is a charming, historic colonial village with cobblestone streets, plazas, markets and the Frida Kahlo house, appealing to culture lovers and families who prefer a slower, bohemian and authentically Mexican atmosphere.","Centro Historico is the dense, monumental old core around the Zocalo, packed with cathedrals, museums, ruins and street life, perfect for first-time visitors and history buffs who want to be steps from the main sights."],
  "Oslo":["Grunerlokka is Oslo's hip, bohemian east-side district packed with indie cafes, vintage shops, street art and lively nightlife, ideal for young creatives, students and travelers who want a trendy, walkable scene.","Frogner is the elegant, affluent west-side quarter of leafy streets, embassies, upscale boutiques and Vigeland Sculpture Park, it suits refined travelers and families wanting a quiet, prestigious base.","Majorstuen is a busy residential and shopping hub with excellent metro and tram connections next to Frogner Park, great for visitors who want convenient local city living and easy access everywhere.","Gronland is Oslo's gritty, multicultural neighborhood full of diverse eateries, markets and edgy bars just east of the center, it appeals to budget-minded and adventurous travelers who enjoy an authentic, energetic vibe.","Aker Brygge is a sleek harborfront district of modern architecture, marinas, seafood restaurants and waterfront bars, perfect for tourists who want scenic strolls, nightlife and upscale dining by the fjord."],
  "São Paulo":["Vila Madalena is São Paulo's bohemian creative quarter, packed with street art, indie galleries, bars and buzzing nightlife, ideal for younger travelers and artists who want an energetic, walkable scene.","Jardins is the upscale, leafy district of luxury boutiques, fine dining and elegant tree-lined streets, best suited to affluent visitors seeking refined shopping and a polished, safe base.","Pinheiros is a trendy, foodie-forward neighborhood full of stylish restaurants, cafes, design shops and craft bars, appealing to hip professionals and creatives who like a lively yet livable vibe.","Itaim Bibi is a modern business and financial hub with sleek high-rises, upscale restaurants and vibrant after-work nightlife, great for business travelers and those wanting nightlife near corporate offices.","Liberdade is the historic Japanese and East Asian district known for its lanterns, Asian markets, ramen shops and weekend street fairs, perfect for travelers drawn to culture, food and a distinctive atmosphere on a budget."],
  "Helsinki":["Kallio is a formerly working-class district reborn as Helsinki's bohemian, hipster heart, packed with cheap bars, cafes, and vintage shops, it suits young creatives, students, and a lively nightlife crowd on a budget.","Punavuori is the design district, full of boutiques, galleries, coffee roasteries, and trendy restaurants, it appeals to stylish creative professionals who want a walkable, fashionable central neighborhood.","Kamppi is Helsinki's busy commercial and transport hub with malls, the bus terminal, and constant foot traffic, it best suits travelers and residents who prioritize convenience and being in the thick of the action.","Toolo is an elegant, leafy residential area near the opera house, Olympic Stadium, and the bay-side parks, it fits families and professionals seeking a calm, upscale, cultured setting close to the center.","Kruununhaka is the dignified historic old town beside the cathedral and harbor, full of stately Empire-era buildings, embassies, and quiet cobbled streets, it suits well-heeled residents who value heritage, tranquility, and central location."],
  "Brussels":["Ixelles is a trendy, cosmopolitan and diverse district beloved for its cafes, boutiques and nightlife around Flagey and Chatelain, suits students and young professionals who want a lively, walkable base.","Saint-Gilles is a bohemian and multicultural quarter full of Art Nouveau facades, artist studios and buzzing bars, ideal for creatives and travelers who prefer character over polish.","Marolles is a gritty, authentic working-class neighborhood famous for the Place du Jeu de Balle flea market and cheap eats, a magnet for bargain hunters, antique lovers and those seeking old Brussels grit.","Sablon is an elegant, upscale enclave of antique dealers, chocolatiers and art galleries around a graceful square, best for refined shoppers and visitors wanting a genteel, historic setting.","The European Quarter is a modern business district built around the EU institutions, with glass office towers and an international expat crowd, practical for work trips but noticeably quiet in the evenings and weekends."],
  "Budapest":["Belvaros-Lipotvaros is Budapest's elegant downtown core along the Pest riverbank, home to Parliament, St Stephens Basilica and Vaci utca shopping, polished, walkable and tourist-central, ideal for first-time visitors and anyone wanting to be steps from the main sights.","Erzsebetvaros is the buzzing old Jewish Quarter packed with ruin bars, street food, galleries and late-night energy, gritty, bohemian and endlessly lively, best for younger travelers, nightlife lovers and foodies.","Jozsefvaros is a diverse, rapidly gentrifying district ranging from the grand Palace Quarter with its museums and universities to rougher outer blocks, affordable and up-and-coming, suited to budget-minded and adventurous travelers.","The Buda Castle District is the romantic hilltop old town on the Buda side with cobblestone lanes, Fishermans Bastion, Matthias Church and sweeping Danube views, quiet, historic and scenic, perfect for couples and history lovers who prefer calm over crowds.","Ujlipotvaros is a leafy, refined residential quarter of Bauhaus buildings, neighborhood cafes and tree-lined streets just north of downtown near Margaret Island, local and low-key, great for those wanting an authentic residential feel or a longer stay."],
  "Guangzhou":["Tianhe is the modern central business district packed with skyscrapers, luxury malls along Tianhe Road, and nightlife; it suits business travelers, shoppers, and those wanting a polished urban base.","Yuexiu is the historic old city core with temples, colonial architecture, parks, and government offices; it suits first-time visitors and history lovers who want central, walkable heritage sights.","Liwan is the heart of traditional Cantonese culture with Xiguan lanes, Shamian Island, and famous dim sum; it suits foodies and travelers seeking old-world local atmosphere.","Haizhu is a leafy island district south of the Pearl River near Canton Tower, with parks and residential calm; it suits families and travelers wanting riverside views at mid-range prices.","Panyu is a spread-out southern suburban district home to Chimelong theme parks and resorts; it suits families and budget-minded visitors who do not mind being farther from downtown."],
  "Nice":["Vieux Nice is the atmospheric old town, a maze of narrow baroque lanes packed with the Cours Saleya market, cafes and lively nightlife. It suits first-time visitors, foodies and those who want to be in the buzzing historic heart.","Cimiez is an elegant, leafy hilltop district of Belle Epoque villas, Roman ruins and the Matisse Museum. It suits culture lovers and travelers seeking a quiet, upscale residential base away from the crowds.","Le Port centers on the colorful Port Lympia marina lined with yachts, antique shops and trendy seafood restaurants. It suits visitors wanting an authentic, less touristy neighborhood with local character.","Liberation is a genuine local quarter built around its vibrant daily food market and close to the main train station. It suits budget-minded travelers and market-goers who want everyday Nicois life.","Quartier des Musiciens is a central grid of streets named after composers, steps from the beach, shops and the Promenade. It suits those wanting a convenient, walkable base that still feels residential."],
  "Palma de Mallorca":["Casco Antiguo (Old Town) is Palmas historic heart, a maze of medieval lanes, Gothic cathedral views, boutiques and tapas bars; ideal for first-time visitors and culture lovers who want to walk everywhere.","Santa Catalina is a hip, foodie district built around a lively market, packed with trendy restaurants, cocktail bars and cafes; suits younger travelers and food enthusiasts wanting buzz within walking distance of the center.","El Terreno is a hillside neighborhood below Bellver Castle with sea views and a faded bohemian, nightlife past; appeals to budget-minded travelers who want proximity to the port and a quieter, slightly gritty local feel.","Portixol is a charming former fishing village on the seafront with a scenic promenade, sandy beach and stylish brunch spots; perfect for couples and design-conscious travelers seeking a relaxed coastal base near the city.","Son Espanyolet is a quiet, leafy residential pocket next to Santa Catalina with low-rise townhouses and a village-like calm; well suited to travelers who want an authentic local atmosphere while staying close to the action."],
  "Honolulu":["Waikiki is the iconic high-rise beach resort district packed with hotels, shopping and nightlife, best for first-time visitors and beach lovers who want to be in the middle of the action.","Ala Moana centers on a massive open-air mall and a calm beach park, suiting shoppers and travelers who want a central base near Waikiki without the resort crowds.","Kakaako is a revitalized urban district full of street murals, craft breweries, modern condos and hip cafes, ideal for younger travelers and creatives who like a walkable artsy scene.","Manoa is a lush green residential valley near the University of Hawaii with frequent rain and waterfall hikes, best for nature lovers wanting a quiet local neighborhood feel.","Chinatown is a historic downtown quarter with lively markets, art galleries, lei shops and buzzing restaurants, great for foodies and culture seekers though grittier after dark."],
  "Beijing":["Dongcheng is the historic heart of Beijing, home to the Forbidden City, Temple of Heaven, and atmospheric hutong alleys; ideal for first-time visitors and history or culture lovers who want to be steps from the main sights.","Xicheng covers the old citys western half with Beihai Park, the Houhai lake district, and Financial Street; it suits travelers wanting traditional courtyard charm, lakeside strolls, and lively evening bars away from the tourist crush.","Chaoyang is Beijings sprawling modern district, packed with the CBD skyline, embassies, malls, and international dining; best for business travelers, expats, and anyone who prefers a cosmopolitan, convenient base.","Haidian is the northwestern university and tech hub, anchored by Tsinghua and Peking universities, the Zhongguancun tech zone, and the Summer Palace; a good fit for students, families, and visitors drawn to greenery and academia.","Sanlitun, inside Chaoyang, is the citys nightlife and fashion epicenter with Taikoo Li shopping, rooftop bars, and clubs; ideal for young travelers and anyone chasing shopping, dining, and a buzzing after-dark scene."],
  "Warsaw":["Reconstructed UNESCO-listed medieval core with cobblestone lanes, the Royal Castle and market square, lively but touristy; ideal for first-time visitors and history lovers who want to be steps from the main sights.","The central downtown and business district anchored by the Palace of Culture, packed with hotels, shopping, restaurants and transit links; best for business travelers and anyone wanting to stay in the thick of the action.","A gritty, bohemian right-bank district known for street art, converted factories, galleries and edgy bars and clubs; suits creative, budget-minded and offbeat travelers seeking authentic local nightlife.","A large, leafy and affluent residential area south of the center with parks, cafes and an expat-friendly feel; good for families, longer stays and travelers who prefer a calmer, more local setting.","An upscale southern district built around the baroque Wilanow Palace and its gardens, blending grand sights with modern quiet residential streets; ideal for those wanting palace grounds, greenery and a peaceful, refined atmosphere."],
  "Seville":["Santa Cruz is the atmospheric old Jewish quarter, a maze of whitewashed lanes and hidden plazas beside the Cathedral and Alcazar, ideal for first-timers who want to be in the postcard heart of the old town despite the crowds and tourist prices.","Triana sits across the river and keeps a proud working-class identity with ceramics workshops, flamenco roots, a lively food market and authentic tapas bars, suiting travelers who want local color and a neighborhood feel a short walk from the center.","El Arenal stretches between the Cathedral and the river around the Maestranza bullring, a central and slightly quieter area with classic tapas taverns and riverside strolls, good for those wanting a walkable base without the deepest tourist crush.","La Macarena is a genuine residential district to the north around its famous basilica, less touristy and more affordable with a bohemian, everyday Sevillano atmosphere, best for budget-minded visitors seeking local immersion.","Alameda, centered on the leafy Alameda de Hercules, is the hip, bohemian and LGBTQ-friendly hub with vintage shops, buzzing bars and the citys best nightlife, perfect for younger travelers who want energy after dark."],
  "Valencia":["Ciutat Vella is the historic old town and tourist heart, home to the cathedral, Plaza de la Reina and the Central Market, ideal for first-time visitors who want landmarks and museums within walking distance.","Ruzafa (Russafa) is the trendy, bohemian district packed with cafes, vintage shops, tapas bars and nightlife, perfect for younger travelers, foodies and creatives who want a hip local scene.","El Carmen is the oldest medieval quarter with narrow winding streets, street art and lively bars, best suited to nightlife lovers and those seeking an artsy, atmospheric stay.","El Cabanyal is the colorful former fishermen quarter beside the beach, increasingly hip with great seafood and tiled houses, great for beach lovers wanting an authentic, less touristy neighborhood.","Eixample is an elegant, upscale grid district with modernist architecture, refined restaurants and a calm residential feel, suited to travelers who want a quieter, sophisticated base near the center."],
  "Shenzhen":["Futian is Shenzhens central business and government district, home to the financial hub, upscale hotels and the Futian high-speed rail link to Hong Kong. It suits business travelers and first-time visitors who want a convenient, polished base.","Luohu is the older commercial core beside the Hong Kong border, packed with bustling markets like Dongmen and the Luohu Commercial City. It is livelier and more budget-friendly, ideal for shoppers and cross-border day-trippers.","Nanshan is the modern tech and coastal district, home to Tencent, top universities and the Shenzhen Bay waterfront with Sea World nightlife. It suits tech professionals, expats and families wanting a cleaner, greener setting.","Bao'an is the developing district surrounding the airport, more residential and industrial but increasingly modern with new malls and the coastal MixC. It is practical for travelers with early flights or airport connections.","OCT (Overseas Chinese Town) is a leafy leisure and culture zone with theme parks like Window of the World and Happy Valley plus the artsy OCT-LOFT creative quarter. It suits families and creative types seeking a relaxed, green atmosphere."],
  "Doha":["West Bay is Dohas gleaming high-rise business and diplomatic district packed with skyscrapers, luxury hotels and corporate offices, best for business travelers and those wanting a modern waterfront base near the Corniche.","The Pearl-Qatar is an upscale artificial island of Mediterranean-style marinas, designer boutiques and waterfront dining, ideal for luxury seekers and couples wanting a polished resort-like atmosphere.","Msheireb is a walkable, sustainably designed downtown regeneration district blending heritage museums with sleek modern architecture, suited to culture lovers and travelers wanting a central, pedestrian-friendly stay.","Al Sadd is a busy, authentic central residential and commercial area with shopping, local eateries and sports venues, good for budget-conscious travelers wanting an everyday Qatari city experience.","Katara is a cultural village of galleries, theaters, mosques and a public beach with a Mediterranean feel, perfect for arts enthusiasts and families seeking festivals and beachfront leisure."],
  "Abu Dhabi":["Al Reem Island is a modern high-rise residential island of glassy waterfront towers just off downtown, popular with young professionals and families who want new apartments close to the city.","Yas Island is the entertainment hub packed with Ferrari World, Yas Waterworld, SeaWorld and the F1 circuit, ideal for tourists and families chasing theme parks and nightlife.","Saadiyat Island is a refined cultural and beach district home to the Louvre Abu Dhabi and luxury resorts on pristine sand, suiting upscale travelers who want art, calm and top-end hotels.","The Corniche is the central waterfront promenade lined with beaches, cafes and parks, great for visitors wanting a walkable seafront base in the heart of the city.","Khalifa City is a quiet, spread-out suburban area of villas near the airport, best for families and longer-stay visitors who want space and lower prices over city buzz."],
  "Fukuoka":["Hakata is the transport and business hub around the main station, packed with hotels, department stores, and yatai food stalls; ideal for first-time visitors and travelers who want easy connections.","Tenjin is the buzzing downtown shopping and nightlife core with department stores, boutiques, and underground malls; suits shoppers and those wanting an energetic central base.","Nakasu is a neon-lit entertainment island famous for its riverside yatai stalls and adult nightlife; best for night owls and foodies who want atmosphere after dark.","Daimyo is a trendy, compact backstreet district full of indie boutiques, cafes, and stylish bars; appeals to younger travelers and those chasing a hip, creative vibe.","Ohori is a calm, upscale area centered on Ohori Park and its lake, near Fukuoka Castle ruins and the art museum; ideal for families and travelers seeking greenery and quiet."],
  "Sapporo":["Susukino is Sapporos neon-soaked nightlife and entertainment heart, packed with bars, izakayas, karaoke and the famous ramen alley, best suited to night owls, foodies and party-goers who want the action outside their door.","Odori centers on the long green Odori Park with the TV Tower and hosts the Snow Festival and summer beer gardens, ideal for sightseers, families and event visitors who want to be steps from festivals and central shopping.","Chuo is the downtown central ward blending offices, department stores and upscale dining, a convenient and polished base for business travelers and anyone wanting to be in the middle of everything.","Maruyama is a leafy, upscale residential pocket near Maruyama Park, the zoo and Hokkaido Shrine, dotted with stylish cafes and boutiques, suiting couples and families who prefer a calmer, refined stay.","The Sapporo Station area in the north is the main transport and shopping hub with big hotels and malls like Stellar Place, perfect for first-time visitors and travelers who prize easy rail access across Hokkaido."],
  "Busan":["Haeundae is Busans upscale seaside resort district with a famous beach, luxury high-rise hotels and lively nightlife, ideal for first-time visitors and beach lovers who want a polished vacation base.","Seomyeon is the central transit, shopping and nightlife hub packed with restaurants, bars and department stores, best for travelers who want maximum convenience and nonstop energy.","Gwangalli offers a relaxed beach lined with trendy cafes and bars framed by the glowing Diamond Bridge, suiting younger travelers who like seaside nightlife with a local feel.","Nampo-dong is the historic downtown of street food, Jagalchi fish market and BIFF Square cinema culture, perfect for foodies and shoppers who want old Busan character.","Gwangbok is the bustling retail and street-food quarter around Gwangbok-ro near Gamcheon Culture Village, great for budget travelers and shoppers who enjoy a busy pedestrian scene."],
  "Edinburgh":["Old Town is the historic medieval heart of the city, packed with cobbled closes, the castle and the Royal Mile; it suits first-time visitors and history lovers who want to be in the thick of the atmosphere and tourist sights.","New Town is elegant and Georgian with wide streets, upscale shopping on Princes and George Streets and refined dining; it suits travelers wanting central polish, boutique hotels and easy walking to everything.","Leith is the revitalized waterfront district with a hip, creative edge, excellent seafood, craft bars and Michelin-starred restaurants; it suits foodies and younger travelers who prefer a trendy neighborhood feel over tourist crowds.","Stockbridge is a leafy, village-like area with independent shops, delis, a Sunday market and riverside walks; it suits those seeking a relaxed, local and slightly bohemian base close to the center.","Morningside is a genteel, residential suburb with quiet tree-lined streets, cozy cafes and a comfortable local vibe; it suits longer-stay visitors and families who want calm and value away from the bustle."],
  "Montreal":["Plateau-Mont-Royal is the quintessential bohemian Montreal neighborhood, packed with colorful triplexes, winding outdoor staircases, indie boutiques and sidewalk cafes. Lively, walkable and largely French-speaking, it suits students, artists and visitors wanting the trendy heart of the city.","Mile End is the citys creative and hipster hub, famous for its wood-fired bagel shops, indie music scene, vintage stores and laid-back cafes. Multicultural and low-key cool, it appeals to foodies, creatives and a younger crowd chasing authentic local flavor.","Vieux-Montreal (Old Montreal) charms with cobblestone streets, centuries-old stone architecture, boutique hotels and waterfront views along the Old Port. Romantic but touristy and pricier, it suits travelers who want history, fine dining and Old World ambiance.","Griffintown is a fast-changing former industrial district near the Lachine Canal, now full of glassy condo towers, modern lofts and buzzy new restaurants. Central and stylish, it draws young professionals wanting an up-and-coming, contemporary vibe.","Outremont is an affluent, leafy francophone enclave of elegant homes, tree-lined streets and upscale bakeries and boutiques. Quiet, refined and family-oriented, it suits those seeking a calm, sophisticated residential setting away from the tourist bustle."],
  "Bologna":["Quadrilatero is the medieval market grid right behind Piazza Maggiore, packed with delis, wine bars and food stalls; ideal for first-time visitors and food lovers who want to be in the buzzing historic heart, though it gets crowded and touristy.","Santo Stefano centers on the beautiful basilica complex and its piazza, an elegant, atmospheric quarter of porticoed streets and aperitivo spots; suits those wanting classic Bologna charm and a refined but lively evening scene.","Bolognina is a gritty, multicultural former working-class district north of the station, now gentrifying with cheaper rents, ethnic eateries and a creative edge; good for budget travelers and those who prefer real local life over polish.","Saragozza is a quieter, residential and well-off zone leading up to the famous portico walk to San Luca; suits families and travelers who want calm, greenery and an authentic neighborhood feel within reach of the center.","San Donato is a large residential and university district east of the center with student energy, parkland and affordable housing; best for longer stays, students and visitors happy to trade central location for value and everyday local vibe."],
  "Rhodes":["Rhodes Old Town (Medieval City) is a UNESCO-listed maze of cobbled lanes, honey-colored stone walls and the Palace of the Grand Master, buzzing with tavernas and history. It suits travelers who want to sleep inside a living monument and do not mind noise, crowds and no car access.","Neochori (New Town) is the modern hub north of the Old Town, packed with beaches, bars, shops, the aquarium and casino. It suits first-timers and nightlife-seekers who want walkable amenities and seafront hotels close to the ferry port.","Ixia is a resort strip along the windier west coast just outside the city, lined with large hotels and windsurf-friendly pebble beaches. It suits couples and package tourists wanting spa resorts, sunsets and a short taxi ride into town.","Ialysos is a laid-back coastal suburb and windsurfing spot a bit further west, with family resorts and easy airport access. It suits water-sports fans and families who prefer a quieter, more affordable base than the city center.","Lindos is a whitewashed clifftop village about 50 km south, crowned by an ancient acropolis above turquoise bays. It suits romantics and day-trippers chasing postcard views, though its steep car-free lanes and summer crowds can be demanding."],
  "Verona":["Centro Storico (Citta Antica) is the walkable UNESCO heart of Verona, home to the Roman Arena, Piazza Bra, Piazza delle Erbe and Juliets House. It suits first-time visitors and couples who want landmarks, dining and shopping at their doorstep, though prices and crowds run high.","Veronetta is the bohemian, student-heavy quarter across the Adige river, filled with the university, cheap trattorias, ethnic eateries and lively cheap bars. It appeals to younger travelers and budget-minded people who want an authentic, gritty and unpolished local scene rather than polished tourism.","San Zeno is a laid-back, characterful neighborhood built around its beautiful Romanesque basilica, with quiet cobbled streets, artisan workshops and neighborhood osterias. It suits travelers who want a residential, genuine Veronese feel while staying within walking distance of the center.","Borgo Trento is an elegant, leafy and affluent residential district just north of the river, known for its Liberty-style villas, parks and calm streets. It fits families and quieter visitors who prefer a refined, upscale and peaceful base away from tourist bustle.","Cittadella is a central, practical area between Porta Nuova station and Piazza Bra, mixing everyday shops, hotels and offices with easy transit access. It works well for business travelers and anyone who values convenient connections and walkability over historic charm."],
  "Delhi":["Connaught Place is the colonial-era circular commercial heart of New Delhi, packed with shops, restaurants and offices. It suits first-time visitors who want a central base with easy metro access and plenty to see on foot.","Chandni Chowk is the chaotic, sensory-overload heart of Old Delhi near the Red Fort, famous for street food, spice bazaars and narrow historic lanes. It is best for foodies and history lovers who embrace crowds and noise, not those seeking calm or comfort.","Hauz Khas is a trendy urban village in South Delhi wrapped around medieval ruins and a lake, full of boutiques, rooftop bars and cafes. It suits younger travelers, creatives and nightlife seekers.","Karol Bagh is a bustling mid-range district known for its jewelry, clothing and electronics markets plus value hotels. It suits budget to mid-range travelers who want good shopping and solid metro links.","Saket is an upscale, planned South Delhi neighborhood with big malls like Select Citywalk, corporate offices and proximity to Qutub Minar. It suits affluent shoppers, business travelers and families wanting modern amenities and a quieter feel."],
  "Porto":["Ribeira is the postcard-perfect riverfront old town with steep medieval lanes, colorful facades and the Douro at its feet; atmospheric and central but touristy, crowded and noisy, best for first-timers who want to be in the heart of the scenery.","Baixa is the bustling downtown around Aliados and Santa Catarina, packed with shops, cafes, transit links and nightlife; lively and supremely convenient, ideal for travelers who want everything walkable and do not mind urban energy.","Cedofeita is an arty, bohemian quarter along Rua de Miguel Bombarda full of galleries, indie boutiques, brunch spots and creative locals; relaxed and hip, suited to younger visitors and design lovers who prefer a local, less-touristy feel.","Bonfim is a gritty, rapidly gentrifying residential district east of the center, with authentic tascas, craft breweries and a real neighborhood rhythm; great value and increasingly trendy, best for those seeking everyday local life over polish.","Foz do Douro is the affluent seaside neighborhood where the river meets the Atlantic, known for its promenade, beaches, breezy restaurants and elegant homes; calm and upscale but away from the historic core, ideal for a quieter, refined stay."],
  "Ho Chi Minh City":["District 1 is the central business and tourist heart, home to Ben Thanh Market, the Dong Khoi luxury strip, rooftop bars and the Pham Ngu Lao backpacker zone. It suits first-time visitors and business travelers who want to be walkable to the main sights.","District 3 sits right beside District 1 but feels calmer, with leafy tree-lined streets, French-era villas, Turtle Lake and a strong local cafe and dining scene. It appeals to travelers who want a central yet more authentic, residential base.","Cholon in District 5 is the historic Chinatown, a bustling maze of wholesale markets like Binh Tay, ornate pagodas and outstanding cheap street food. It suits culture seekers and foodies who do not mind chaos and crowds over polish.","Thao Dien in Thu Duc City, the former District 2, is the leafy riverside expat enclave packed with international restaurants, boutiques, wine bars and cafes. It draws expats, families and digital nomads wanting green quiet and Western comforts a short ride from downtown.","Phu My Hung in District 7 is a modern master-planned district with wide clean boulevards, malls, international schools and a large Korean and Taiwanese community. It suits families and long-stay visitors who prefer orderly, suburban calm away from the dense center."],
  "Buenos Aires":["Palermo is the citys largest and trendiest barrio, split into subzones like Palermo Soho and Hollywood, packed with boutiques, street art, leafy parks and a nonstop cafe and nightlife scene. It suits younger travelers, digital nomads and anyone wanting hip restaurants and bars within walking distance.","Recoleta is elegant and refined, known for grand French-style architecture, upscale hotels, museums and the famous cemetery where Eva Peron is buried. It suits travelers who want a quieter, sophisticated and safe neighborhood with a European feel.","San Telmo is the historic bohemian heart of the city, full of cobblestone streets, antique shops, tango halls and a lively Sunday market. It suits culture lovers and budget-minded travelers who embrace a gritty, artistic and authentic old-world atmosphere.","La Boca is a colorful working-class barrio famous for the painted houses of Caminito, tango dancers and the Boca Juniors stadium. It is vibrant and photogenic by day but rougher around the edges, best for a guided daytime visit rather than staying overnight.","Puerto Madero is the modern, polished waterfront district built around restored docks, with glass skyscrapers, luxury hotels, upscale restaurants and a nature reserve nearby. It suits business travelers and those seeking safety, space and sleek contemporary comfort over historic charm."],
  "Marne-la-Vallée":["Val d'Europe is a polished, purpose-built town center anchored by a huge shopping mall, aquarium, and the La Vallée Village outlet; suits shoppers and families who want modern amenities and a quick RER hop to the parks.","Chessy is the commune that actually holds Disneyland Paris and the Marne-la-Vallée-Chessy train station; suits visitors who want to be right at the park gates and on top of the transit hub.","Serris is a walkable residential and commercial town blending into Val d'Europe, full of hotels, restaurants, and apartments; suits families and travelers wanting a lively, convenient base minutes from both the mall and the parks.","Bailly-Romainvilliers is a quieter, greener village with a golf course and several Disney partner hotels; suits families and couples after a calmer, more spread-out stay a short drive from the action.","Magny-le-Hongre is a residential town clustered with Disney partner hotels and close to Villages Nature; suits families seeking more affordable lodging and easy shuttle access without paying for the resort core."],
  "Kraków":["Stare Miasto (Old Town) is the historic core around the Main Square, best for first-time visitors who want to walk to major sights, restaurants, and nightlife, though it is the priciest and most crowded part of the city.","Kazimierz is the former Jewish quarter turned bohemian district, ideal for travelers after atmospheric bars, vintage cafes, street food, and lively nightlife just a short walk from the Old Town.","Podgórze is a quieter riverside district across the Vistula rich in WWII history such as Schindler's Factory and the former ghetto, good for those wanting a laid-back, local feel and cool cafes away from the tourist crush.","Nowa Huta is a planned socialist-realist steel-town district on the city's edge, suited to curious travelers drawn to communist-era architecture and history rather than proximity to central sights.","Kleparz is a practical, unpretentious area just north of the Old Town around the main train station and market halls, appealing to budget-minded travelers who value transport links and everyday local life within easy walking distance of the center."],
  "Heraklion":["Old Town (Centro) is the historic heart around Lion Square and the Venetian harbor, packed with tavernas, museums, and nightlife, ideal for first-time visitors who want to walk everywhere and stay in the middle of the action.","Poros is a working-class seaside neighborhood just east of the center near the port, suited to budget-minded travelers who want quick ferry and airport access and a more local, everyday Cretan atmosphere.","Nea Alikarnassos is a practical residential suburb right by the airport with affordable hotels, good for one-night stopovers, early flights, or travelers prioritizing convenience over charm.","Mastampas is a quiet, largely residential district southwest of the center popular with locals, offering cheaper stays and an authentic neighborhood feel within a short bus ride or walk of downtown.","Ammoudara is a beach-resort strip just west of the city with a long sandy shoreline, hotels, and beach bars, best for families and sun-seekers who want the coast while staying close to Heraklion."],
  "Johor Bahru":["Johor Bahru City Centre is the dense downtown hub around JB Sentral and City Square malls, best for travellers who want to be steps from the Singapore Causeway, shopping, street food and cross-border convenience.","Iskandar Puteri is a modern, planned township with LEGOLAND, Puteri Harbour marina and corporate campuses, suited to families and business travellers wanting newer, spacious, resort-style surroundings away from the city crush.","Danga Bay is a waterfront leisure and residential strip with a promenade, seafood restaurants and high-rise condos, good for visitors who want relaxed bayfront views and evening strolls close to the city.","Tebrau is a sprawling commercial and retail belt anchored by large malls like IKEA and Toppen, ideal for shoppers, road-trippers with a car and budget-minded travellers staying near the highway.","Skudai is a university and suburban district near UTM, practical and affordable with local eateries, appealing to students, longer-stay visitors and those wanting a quieter residential base close to the airport."],
  "Hanoi":["Hoan Kiem (Old Quarter) is the dense, atmospheric historic heart wrapped around the lake, packed with street food, night markets and colonial buildings; ideal for first-time visitors who want to walk everywhere and be in the middle of the action.","Ba Dinh is the stately political and administrative district home to the Ho Chi Minh Mausoleum, embassies and grand boulevards; calmer and greener than the Old Quarter, it suits travelers who want history and quiet within reach of the center.","Tay Ho (West Lake) is the leafy, laid-back expat enclave along Hanoi's largest lake, full of cafes, boutiques, lakeside restaurants and international eateries; best for longer stays, families and those wanting a relaxed, upscale base away from the crush.","Dong Da is a large, densely local residential district with universities, markets and the Temple of Literature nearby; authentic and affordable with few tourists, it suits budget travelers and those wanting everyday Hanoi life.","Cau Giay is a modern western district of high-rises, malls, tech offices and student housing; practical, less scenic and well-priced, it fits business travelers and long-term visitors who prioritize new amenities over old-town charm."],
  "Tel Aviv":["Florentin is Tel Aviv's gritty, artsy district full of street art, workshops, and dive bars, buzzing with a young, bohemian crowd of artists, students, and night owls who love a raw creative edge. It suits budget-minded travelers who want authentic nightlife over polish.","Neve Tzedek is the citys oldest and most charming quarter, with restored Bauhaus and Ottoman-era homes on quiet cobbled lanes, boutiques, and cafes. It draws romantic, design-loving visitors and well-heeled couples seeking a picturesque, upscale village feel.","Jaffa (Yafo) is an ancient port town of stone alleys, a famous flea market, mosques, churches, and a mixed Arab-Jewish community, blending history with trendy galleries and restaurants. It appeals to culture seekers and foodies who want atmosphere and old-world character.","Rothschild (Lev Ha'ir) is the leafy, central heart of the city along Rothschild Boulevard, lined with Bauhaus architecture, banks, startups, cafes, and nightlife. It fits first-time visitors and business travelers wanting to be walkable to everything.","Ramat Aviv is an affluent, leafy residential district north of the Yarkon River, home to Tel Aviv University, the Eretz Israel and Palmach museums, and a major upscale mall. It suits families, academics, and quieter travelers who prefer calm suburban comfort over the downtown buzz."],
  "Sharjah":["Al Majaz is Sharjah's scenic waterfront heart along Khalid Lagoon, packed with parks, the corniche, mosques and restaurants. It suits families and professionals who want an upscale, walkable lakeside setting.","Al Qasba is a lively canal-side leisure and cultural district anchored by the Eye of the Emirates wheel, dining and the musical fountain. It appeals to visitors, young couples and anyone wanting a social, entertainment-focused base.","Al Nahda is a dense, affordable residential area hugging the Dubai border, favored by expat families and commuters. It suits budget-minded renters who want easy, fast access to Dubai.","Al Khan is a coastal neighborhood near the beach and lagoon blending old fishing heritage with modern towers. It fits those seeking affordable seaside living close to the Dubai line.","Al Taawun is a high-rise waterfront strip along the lagoon near Dubai, lined with towers, malls and corniche views. It works well for families and professionals wanting modern apartment living with amenities nearby."],
  "Thessaloniki":["The former warehouse and old red-light quarter by the port, now the buzzing nightlife and taverna zone of cobbled lanes packed with ouzo bars and mezze restaurants; suits visitors who want to be in the heart of the going-out scene.","The Ottoman-era Upper Town that survived the 1917 fire, with steep alleys, Byzantine walls and panoramic bay views; suits romantics and history lovers who do not mind the hills.","A leafy, affluent seaside suburb southeast of the center with cafes and a marina; suits families and longer-stay visitors wanting a quieter, local feel.","An upscale hillside suburb above the city with sweeping bay views, villas and famous bougatsa; suits car travelers and those seeking calm, upmarket residential comfort.","A dense, working-class eastern district home to PAOK's stadium, authentic and untouristy; suits football fans and budget travelers wanting real local life."],
  "Lima":["An upscale clifftop district over the Pacific that is the tourist heart, with parks, malls, restaurants, hotels and the Malecon boardwalk; suits first-time visitors wanting safety and walkability.","A bohemian coastal district that is Lima's arty corner, with colorful colonial houses, galleries, street art and nightlife; suits creatives, younger travelers and foodies.","Lima's polished financial and diplomatic district, leafy with the Olive Grove park, upscale hotels and business towers; suits business travelers and those wanting quiet luxury.","A large residential middle-to-upper-class district inland, home to malls and gated communities; suits longer-stay visitors and those visiting locals rather than tourist sights.","An orderly residential middle-class district with parks and the national museum, family-oriented and calm; suits travelers wanting an authentic base away from tourist crowds."],

  "Tbilisi":["The historic core with sulfur bathhouses, cobbled lanes, wooden balconies, churches and the Narikala fortress; suits first-time visitors wanting atmosphere and walkable sights.","A prestigious, leafy district west of the center with upscale cafes, boutiques and Vake Park; suits well-heeled visitors and longer stays wanting a refined neighborhood.","A central bohemian-genteel district between Old Town and Vake, full of cafes, wine bars and galleries; suits younger travelers and creatives wanting a lively but residential base.","A modern residential and business district with wide avenues, malls and newer apartments; suits budget and longer-stay visitors wanting good value and metro links.","An elegant, fading-grand 19th-century quarter beside Old Town with ornate courtyards and trendy bars; suits travelers wanting character and a central spot slightly off the tourist track."],

  "Punta Cana":["The main resort strip of Punta Cana, with long white-sand beaches lined by all-inclusive resorts, shops and nightlife; suits first-time visitors and beach vacationers wanting the classic resort experience.","An exclusive gated luxury enclave with a marina, golf courses, upscale resorts and villas; suits affluent travelers and honeymooners seeking privacy and high-end amenities.","A leafy residential community near the airport with the Blue Mall, restaurants and boutique hotels, popular with locals and expats; suits travelers wanting a calmer, more authentic non-resort base.","The liveliest, more local pocket of Bavaro beach with beach shacks, vendors, casual seafood and budget lodging; suits travelers wanting local flavor and value near the sand.","A quieter, secluded stretch of coast north of Bavaro with newer luxury resorts and undeveloped beaches; suits couples and those seeking tranquility away from the crowds."],

  "Vilnius":["One of Europe's largest baroque old towns, with cobbled streets, churches, cafes and the cathedral; suits first-time visitors wanting atmosphere and walkable sights.","A quirky, bohemian self-declared republic across the river, with artist studios, galleries and offbeat bars; suits creatives and travelers wanting character and a laid-back vibe.","The emerging hip district around the station and business center, with restaurants, startups and the Paupys development; suits younger travelers wanting a modern, up-and-coming base near transport.","A leafy residential riverside district of wooden villas and quiet streets just west of the center; suits those wanting a calm, green, authentic neighborhood within easy reach of the center.","A historic residential district northeast along the river with parks, hilltop views and the Antakalnis cemetery; suits longer-stay visitors wanting a tranquil local setting."],

  "Zhuhai":["A bustling border district next to the Macau crossing, dense with shops, the underground market, hotels and restaurants; suits shoppers and travelers heading to or from Macau wanting the liveliest area.","Zhuhai's central urban and administrative district, the main downtown with waterfront, malls and the Fisher Girl statue; suits first-time visitors wanting the city's core conveniences.","A coastal district with the Lovers Road promenade, seaside parks, cafes and mid-to-upscale hotels; suits travelers wanting sea views and a pleasant, walkable base.","A northern university and tech district with a preserved old town, quieter and greener; suits longer-stay visitors, students and those wanting a calmer local setting.","A rapidly developing island district next to Macau with Chimelong Ocean Kingdom, new business zones and resorts; suits families visiting the theme parks and business travelers to the new development zone."],
