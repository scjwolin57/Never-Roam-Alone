/* Public transit systems per city — powers the full-width Getting Around The City card */
const CITY_TRANSIT = {
  "Kyiv":{"sys":[{"n":"Kyiv Metro","t":"Metro"},{"n":"Kyivpastrans Tram","t":"Tram"},{"n":"Kyivpastrans Trolleybus","t":"Bus"},{"n":"Kyivpastrans Bus","t":"Bus"},{"n":"Kyiv Funicular (Podil-Mykhailivska)","t":"Funicular"}],"map":"https://www.metro.kiev.ua/en","pay":"Tap a contactless bank card or phone directly at metro turnstiles and on buses/trams/trolleybuses, or buy a rechargeable plastic token/card at metro stations. A single flat-fare ride costs 30 UAH (about $0.70) as of mid-2026 across metro, bus, tram and trolleybus.","hours":"Metro runs roughly 5:30am-midnight; ground transport (trams/buses/trolleybuses) covers similar hours with reduced night service; no true 24-hour network, so late-night travelers rely on ride-hailing apps.","note":"Wartime curfew and occasional air-raid alerts can temporarily suspend metro and ground transit service; stations also serve as bomb shelters during alerts."},
  "Ljubljana":{"sys":[{"n":"LPP City Bus Network","t":"Bus"},{"n":"Ljubljana Castle Funicular","t":"Funicular"}],"map":"https://www.lpp.si/en/lines-and-timetables","pay":"Fares run on the reloadable Urbana smart card, tapped on validators when boarding; the card (and a small deposit) is bought and topped up at kiosks, the Tourist Info Center, LPP points of sale, or the Urbana app, and single cash tickets are not sold on the bus. One tap covers a flat-fare ride regardless of distance, with free transfers within a set time window.","hours":"Most city buses run about 5:00/5:30 AM to 10:30/11:30 PM; a limited night-bus network covers a few core routes into the early hours on weekends.","note":"The old town center is compact and largely pedestrianized, and free electric Kavalir shuttles ferry visitors around it on request."},
  "Kotor":{"sys":[{"n":"Blue Line (local town buses)","t":"Bus"},{"n":"Intercity coach network","t":"Bus"},{"n":"Kamenari–Lepetane ferry","t":"Ferry"}],"map":"","pay":"Local Blue Line buses are pay-as-you-board in cash (small euro coins or notes); intercity coach tickets are bought at the station kiosk or from the driver. The Kamenari–Lepetane car/passenger ferry across the bay is paid in cash at the tollbooth on boarding (pedestrians ride free).","hours":"Local buses run roughly 6am-9pm with no night service; intercity coaches operate through early evening. The bay ferry runs around the clock at 10-15 minute intervals.","note":"Kotor's Old Town is entirely pedestrian, so most visitors walk everywhere and only use buses, the ferry, or taxis for trips along the bay or to nearby towns."},
  "Bratislava":{"sys":[{"n":"Bratislava Tram (Električka)","t":"Tram"},{"n":"Bratislava Trolleybus","t":"Bus"},{"n":"Bratislava City Bus Network","t":"Bus"},{"n":"Regional Rail (ZSSK/S-Bahn)","t":"Train"},{"n":"Danube Ferry/River Shuttle","t":"Ferry"}],"map":"https://www.idsbk.sk/en/","pay":"Buy tickets in advance via the IDS BK mobile app, at ticket machines (DPB kiosks) at major stops, or from newsagents; tickets must be validated on boarding trams/buses. Contactless bank-card tap-on payment is also available on most trams and buses. There are no ticket sales on board most vehicles.","hours":"Trams and buses run roughly 4:30am-11:30pm, with a reduced night bus network running through the night on key routes.","note":"The whole city center is very walkable, so many visitors rely on trams/buses only for airport transfers or longer trips to Devín or Petržalka."},
  "Belgrade":{"sys":[{"n":"GSP Beograd Bus","t":"Bus"},{"n":"Belgrade Tram","t":"Tram"},{"n":"Trolleybus","t":"Bus"},{"n":"BG Voz (Beovoz) suburban rail","t":"Train"}],"map":"https://www.gsp.rs/","pay":"Buy a rechargeable contactless BusPlus card at kiosks/GSP outlets for the cheapest fares across bus, tram and trolleybus, or pay onboard with a single-ride SMS/driver ticket at a higher price. Many vehicles now also accept contactless bank-card tap-to-pay directly.","hours":"Most routes operate roughly 4:30/5:00 AM to 11:30 PM-midnight; a limited network of night lines (prefixed 'N') covers weekends into the early morning.","note":"Belgrade has no metro yet (a system is planned/under study); the BG Voz suburban rail supplements the bus/tram network on a few corridors."},
  "San Marino":{"sys":[{"n":"San Marino Cableway (Funivia San Marino-Borgo Maggiore)","t":"Cable car/Funicular"},{"n":"AASS Linea Urbana/Extraurbana buses","t":"Bus"},{"n":"Rimini-San Marino intercity bus","t":"Bus"}],"map":"https://www.aass.sm/site/home/trasporti.html","pay":"Cable car tickets are bought at the station kiosk or vending machine and can be one-way, round-trip, or combined with bus fares; local AASS buses are paid in cash on board or via prepaid tickets from tobacconists/kiosks. Contactless/card payment is limited, so carrying small euro coins and notes is recommended.","hours":"Cableway runs roughly 08:00-18:00/20:00 depending on season (closed some winter days); buses run daytime hours only, with very limited or no service late at night - taxis are the main after-hours option.","note":"San Marino has no rail network of its own; the historic Rimini-San Marino electric tramway closed in 1944, though a small preserved section runs as a heritage line near Valdragone."},
  "Moscow":{"sys":[{"n":"Moscow Metro","t":"Metro"},{"n":"Moscow Central Circle (MCC)","t":"Train"},{"n":"Moscow Central Diameters (MCD)","t":"Train"},{"n":"Moscow Tram","t":"Tram"},{"n":"Mosgortrans Bus","t":"Bus"}],"map":"https://transport.mos.ru/metro/map","pay":"Visitors typically buy a Troika contactless smart card, sold and topped up at metro kiosks and machines, valid across metro, MCC, MCD, tram and bus. Bank contactless cards and phone payment (Mir Pay) are also accepted directly at metro turnstiles.","hours":"Metro runs approximately 5:30am-1:00am daily; no regular all-night service, though some New Year's Eve exceptions apply.","note":"The Moscow Metro is famed for its ornate Stalin-era station architecture and is one of the busiest and most efficient systems in the world."},
  "Bucharest":{"sys":[{"n":"Bucharest Metro (Metrorex)","t":"Metro"},{"n":"STB Tram","t":"Tram"},{"n":"STB Bus","t":"Bus"},{"n":"STB Trolleybus","t":"Bus"}],"map":"https://metrorex.ro/en/harta-retelei/","pay":"Contactless bank cards can be tapped directly on metro gates and STB surface vehicles. Single tickets, day passes and the rechargeable Activ/Bucharest City Card are also sold at station kiosks and vending machines. Keep a validated ticket or tapped card for random inspections on trams and buses.","hours":"Metro runs roughly 05:00-23:00; trams, buses and trolleybuses operate similar daytime hours with a limited network of night buses covering major routes after midnight","note":"Metro line M1 forms an inner ring, M2 runs north-south through the center, and newer lines M4/M5 extend service; surface trams and buses fill gaps well"},
  "Skopje":{"sys":[{"n":"JSP Skopje","t":"Bus"}],"map":"https://skopjebus.mk/en/app/lines/","pay":"Fares are paid by tapping a rechargeable JSP smart card at the front-door validator, via a contactless bank card, or the JSP mobile app; you can also pay cash directly to the driver for a slightly higher single-ride price.","hours":"Buses generally run about 5:00-23:30 with reduced frequency on some lines late at night; a few reduced-service lines run on weekends.","note":"No metro or tram; JSP's extensive bus network (60+ lines) is the backbone of public transport, supplemented by inexpensive licensed yellow taxis and the Bolt app."},
  "Chișinău":{"sys":[{"n":"RTEC Trolleybus Network","t":"Trolleybus"},{"n":"Chisinau City Bus Network","t":"Bus"},{"n":"Route Minibuses (Maxi-taxi)","t":"Bus"}],"map":"","pay":"Pay the conductor in cash on board (fixed fare per ride, currently 7 MDL) or buy a paper ticket; there is no citywide contactless smart card yet, though some routes are piloting card readers. Minibuses (rutiere) are paid in cash to the driver.","hours":"Buses and trolleybuses generally run about 05:30-23:00; there is no true night service, so late-night travel relies on taxi apps.","note":"No metro or tram system; the network is entirely trolleybus, bus and shared minibus routes."},
  "Monaco":{"sys":[{"n":"CAM (Compagnie des Autobus de Monaco)","t":"Bus"},{"n":"Monaco-Monte-Carlo railway station (SNCF/TER Marseille-Ventimiglia line)","t":"Train"},{"n":"Bateau Bus","t":"Ferry"}],"map":"","pay":"CAM bus fares are paid by tapping a contactless bank card directly on board, using a prepaid CAM card, or via the CAM mobile app; single tickets can also be bought at onboard machines. The little Bateau Bus shuttle across Port Hercule is free to ride.","hours":"CAM buses run roughly 7am-9pm with reduced evening frequency; there is no dedicated night-bus network, so taxis fill the gap late at night.","note":"Monaco is compact enough to explore mostly on foot, aided by a dense network of public elevators and escalators that help with the steep terrain between quarters."},
  "Valletta":{"sys":[{"n":"Malta Public Transport","t":"Bus"},{"n":"Valletta Ferry Services","t":"Ferry"},{"n":"Gozo Channel","t":"Ferry"}],"map":"https://www.publictransport.com.mt/en/routes","pay":"Most riders buy a rechargeable tallinja card (cheaper per-ride rate) online or at kiosks, or tap a contactless bank card directly on the bus reader; single paper tickets can also be bought in cash from the driver at a higher price. Ferries are paid for with cash or card at the kiosk/turnstile per crossing.","hours":"Buses run roughly 5am-11pm on most routes, with limited weekend Night Route (N-series) service; the Valletta-Sliema and Valletta-Three Cities ferries run roughly 6:45am-11pm depending on season.","note":"Malta has no metro, tram or rail; the island-wide 'tallinja' bus network run by Malta Public Transport is the backbone of public transit, supplemented by short harbour ferry hops in and out of Valletta."},
  "Vaduz":{"sys":[{"n":"LIEmobil","t":"Bus"}],"map":"https://liemobil.li/en/travel/network-map/","pay":"Buy single tickets or day passes from the driver (cash/card) or via the LIEmobil app; tickets also cover connecting Swiss PostBus/rail links to Sargans and Buchs. Liechtenstein has no railway passenger service of its own.","hours":"Buses run roughly 5:30am-midnight on most routes with reduced frequency on weekends; no night bus network.","note":"Liechtenstein has no airport or train station of its own; Schaan-Vaduz is the nearest rail-adjacent bus hub, and the country is entirely served by the LIEmobil bus network."},
  "Luxembourg City":{"sys":[{"n":"Luxtram","t":"Tram"},{"n":"AVL Bus Network","t":"Bus"},{"n":"CFL National Railway","t":"Train"},{"n":"Funiculaire Pfaffenthal-Kirchberg","t":"Funicular"}],"map":"https://www.mobiliteit.lu/en/","pay":"All public transport (tram, bus, train 2nd class) has been free nationwide since 29 February 2020 for both residents and tourists; no ticket or app needed for standard journeys. 1st class rail seats still require a paid ticket.","hours":"Buses/tram run roughly 5am-midnight; a night bus network (CityNight) covers weekends into the early morning.","note":"Free public transport makes Luxembourg City one of the easiest and cheapest European capitals to explore."},
  "Riga":{"sys":[{"n":"Tram","t":"Tram"},{"n":"Trolleybus","t":"Bus"},{"n":"Bus","t":"Bus"}],"map":"https://saraksti.rigassatiksme.lv/index.html#riga/en","pay":"Buy single tickets, day passes, or top up an e-talon smart card at kiosks, ticket machines, or the Rīgas satiksme app; contactless bank cards can now also be tapped directly on trams and buses. Tickets bought from the driver cost more than pre-purchased ones.","hours":"Most routes operate roughly 5:30am-11:30pm; a few night bus/tram lines run later on weekends.","note":"Validate or tap your ticket immediately after boarding; fare inspectors issue on-the-spot fines for invalid tickets."},
  "Reykjavík":{"sys":[{"n":"Strætó (city bus network)","t":"Bus"},{"n":"Viðey Island Ferry","t":"Ferry"}],"map":"https://www.straeto.is/en","pay":"Most riders pay via the Klapp app, which offers tap-to-pay virtual tickets and pre-paid trip bundles. Contactless bank cards can also be tapped on validators on many routes. Exact cash is accepted onboard but drivers give no change.","hours":"Most routes run roughly 6:30/7:00 AM to midnight on weekdays with reduced evening and Sunday frequency; there is no true late-night or 24-hour bus service.","note":"Reykjavík has no metro, tram, or train — Strætó buses are the only public transit system; the compact city center is very walkable, and renting a car is common for day trips outside town."},
  "Dubrovnik":{"sys":[{"n":"Libertas Dubrovnik City Bus","t":"Bus"},{"n":"Jadrolinija Local Ferry","t":"Ferry"}],"map":"https://www.libertasdubrovnik.hr/en/lines-map","pay":"Buy a single-ride ticket from the driver (cash, pricier) or a cheaper prepaid ticket from kiosks/newsstands before boarding; the mCity/Libertas mobile app also sells tickets. Fares are flat regardless of distance within the city zone, and there is no integrated smart card.","hours":"Main lines run roughly 5am-1am with reduced frequency late at night; no true 24-hour service.","note":"No metro, tram, or train; Old Town itself is entirely pedestrian and closed to cars, so buses ring the walls rather than enter them."},
  "Sofia":{"sys":[{"n":"Sofia Metro","t":"Metro"},{"n":"Sofia Tram Network","t":"Tram"},{"n":"Sofia Trolleybus Network","t":"Trolleybus"},{"n":"Sofia Bus Network","t":"Bus"}],"map":"https://www.sofiatraffic.bg/en/","pay":"Buy paper tickets from kiosks or drivers, or use rechargeable contactless cards for metro/tram/bus, tapped at metro turnstiles or validated onboard surface vehicles. Mobile ticketing apps (e.g. mCard/Sofia Traffic app) are also accepted.","hours":"Metro runs roughly 05:00-00:00; surface transport similar hours with reduced night bus coverage.","note":"Single ride ~1.03 USD (1.60 BGN); day passes and multi-ride cards offer savings for longer stays."},
  "Minsk":{"sys":[{"n":"Minsk Metro","t":"Metro"},{"n":"Minsktrans Tram","t":"Tram"},{"n":"Minsktrans Bus","t":"Bus"},{"n":"Minsktrans Trolleybus","t":"Trolleybus"}],"map":"https://minsktrans.by/en/home/","pay":"Buy paper tokens (zhetony) or rechargeable swipe cards at metro kiosks and vending machines; contactless bank cards (Visa payWave/Mastercard PayPass) and NFC phone payment are accepted directly at metro turnstiles and on many buses/trams. A single ride costs about 0.65-1 BYN.","hours":"Metro runs roughly 5:30am-1:00am; surface transit (trams/buses/trolleybuses) generally operates 5am-midnight with limited night routes.","note":"The metro has 3 lines and about 33 stations; trams, buses, and trolleybuses cover the rest of the city extensively."},
  "Sarajevo":{"sys":[{"n":"Sarajevo Tram","t":"Tram"},{"n":"GRAS Trolleybus","t":"Trolleybus"},{"n":"GRAS City Bus","t":"Bus"},{"n":"Suburban Train (Sarajevo-Ilidža)","t":"Train"}],"map":"https://www.gras.co.ba","pay":"Buy paper tickets from kiosks (cheaper) or pay the driver in cash for a slightly higher fare; validate tickets on board. A rechargeable BUS PLUS card is also available for frequent riders.","hours":"Trams and buses run roughly 05:00-23:00; limited night bus coverage after that, so taxis are the main late-night option.","note":"The Sarajevo tram, running since 1885, is one of the oldest urban tram systems in Europe."},
  "Andorra la Vella":{"sys":[{"n":"Cooperativa Interurbana Andorrana (urban city bus)","t":"Bus"},{"n":"Andbus / national interparroquial coach lines","t":"Bus"}],"map":"https://www.interurbana.ad/","pay":"Andorra la Vella's urban buses are free of charge for everyone, no ticket needed. National intercity coaches connecting parishes charge a small cash or card fare paid to the driver; some routes accept the CoopBus prepaid card.","hours":"Urban buses run roughly 7am-9pm on frequent intervals; no true night service, though some lines run later on weekends.","note":"The compact city center is very walkable; buses mainly matter for reaching Escaldes-Engordany, ski resorts and other parishes."},
  "Tirana":{"sys":[{"n":"Tirana City Bus Network","t":"Bus"}],"map":"https://tirana.al/en/points-of-interest/bus-lines","pay":"Fares are paid in cash directly to the driver or conductor on board (around 40 lek per ride); there is no rechargeable transit card system as of 2026. Exact change is appreciated.","hours":"Buses generally run from around 5:00 AM to midnight; no dedicated night bus network, so taxis or ride apps fill the late-night gap.","note":"Tirana has no metro, tram, or rail transit; buses and minibuses (furgons) are the primary public transport, supplemented by taxis and local ride-hailing apps."},
  "Hong Kong":{sys:[{n:"MTR",t:"Metro"},{n:"Hong Kong Tramways (Ding Ding)",t:"Tram"},{n:"Star Ferry",t:"Ferry"},{n:"KMB &amp; Citybus",t:"Bus"},{n:"Peak Tram",t:"Funicular"}],map:"https://www.mtr.com.hk/en/customer/services/system_map.html",pay:"Get an Octopus card — it works on the MTR, trams, ferries and buses. Buy one at airport or MTR customer service counters (about HK$50 deposit, ~US$6.50) or add it to Apple/Google Wallet. Contactless Visa and Mastercard are now also accepted directly at MTR fare gates.",hours:"MTR runs roughly 6am to 1am daily. Overnight, N-prefixed night buses and taxis cover the gaps.",note:""},
  "Bangkok":{sys:[{n:"BTS Skytrain",t:"Metro"},{n:"MRT",t:"Metro"},{n:"Airport Rail Link",t:"Train"},{n:"Chao Phraya Express Boat",t:"Ferry"},{n:"BRT",t:"BRT"}],map:"https://www.bts.co.th/eng/routemap.html",pay:"There is no single card for everything: the BTS uses the Rabbit card (about 200 baht incl. credit, ~US$6, from BTS ticket offices — bring your passport), while single-trip tickets come from station machines. Both BTS (since Aug 2025) and MRT now accept contactless Visa/Mastercard at the gates, which is the easiest option for visitors.",hours:"BTS and MRT run about 5:30am to midnight daily with no night trains — use taxis or Grab after hours.",note:""},
  "London":{sys:[{n:"London Underground",t:"Metro"},{n:"Elizabeth line &amp; Overground",t:"Train"},{n:"DLR",t:"Train"},{n:"London Buses",t:"Bus"},{n:"London Trams",t:"Tram"}],map:"https://tfl.gov.uk/maps/track/tube",pay:"Just tap a contactless bank card or phone at the gates — fares are capped daily and weekly automatically. If you prefer a card, an Oyster costs £7 (non-refundable, ~US$9.50) from station ticket machines. Buses are cashless; a single bus ride is £1.75 with unlimited changes within an hour.",hours:"The Tube runs about 5am to midnight; the Night Tube runs all night Fri–Sat on several lines, and 24-hour night buses cover the city.",note:""},
  "Macau":{sys:[{n:"Public Buses",t:"Bus"},{n:"Macau LRT",t:"Metro"},{n:"Ferries to Hong Kong",t:"Ferry"}],map:"https://www.mlm.com.mo/en/route.html",pay:"Buses charge a flat MOP 6 (~US$0.75) — pay exact cash on board or use a Macau Pass card from convenience stores. The LRT sells single-trip tickets from station machines and also takes Macau Pass. Mobile QR payments (MPay, Alipay) work on most buses.",hours:"Buses run roughly 6am to midnight with a few overnight N routes; the LRT runs about 6:30am to 11:15pm.",note:"Free casino and hotel shuttle buses link the ferry terminals, border crossings, airport and Cotai resorts — many visitors get around mainly on these."},
  "Singapore":{sys:[{n:"MRT",t:"Metro"},{n:"LRT",t:"Metro"},{n:"Public Buses",t:"Bus"},{n:"Sentosa Express",t:"Monorail"},{n:"Singapore Cable Car",t:"Cable car"}],map:"https://www.lta.gov.sg/content/ltagov/en/map/train.html",pay:"Simplest option: tap a contactless Visa/Mastercard or phone directly at MRT gates and on buses (SimplyGo). You can also buy a stored-value EZ-Link/SimplyGo card at station ticket offices and convenience stores (~S$10 incl. S$5 credit, ~US$7.50), or a Singapore Tourist Pass for unlimited rides.",hours:"MRT and buses run about 5:30am to midnight daily; after midnight, taxis and ride-hailing fill the gap.",note:""},
  "Paris":{sys:[{n:"Métro",t:"Metro"},{n:"RER",t:"Train"},{n:"Trams",t:"Tram"},{n:"Buses",t:"Bus"},{n:"Montmartre Funicular",t:"Funicular"}],map:"https://www.ratp.fr/en/plans",pay:"Paper tickets are gone: buy a reloadable Navigo Easy card (€2, ~US$2.30) at station machines and counters, or buy tickets on your phone via the Île-de-France Mobilités app. Flat fares apply region-wide: €2.50 (~US$2.90) for metro/RER trips, €2 for bus/tram. Contactless bank-card payment works only on some buses so far — not in the metro.",hours:"The Métro runs about 5:30am to 1:15am (until ~2:15am Fri–Sat); Noctilien night buses run overnight.",note:""},
  "Dubai":{sys:[{n:"Dubai Metro",t:"Metro"},{n:"Dubai Tram",t:"Tram"},{n:"Public Buses",t:"Bus"},{n:"Abras &amp; Waterbus",t:"Ferry"},{n:"Palm Monorail",t:"Monorail"}],map:"https://www.rta.ae/wps/portal/rta/ae/public-transport/metro-stations-map",pay:"You need a nol card for the metro, tram and buses — bank cards can't be tapped at the gates yet (planned for 2027). Buy a silver nol card for AED 25 (~US$7, includes AED 19 credit) at metro station machines and counters, including at the airport, and top up via machines or the nol Pay app.",hours:"The Metro runs about 5am to midnight (until 1am Friday nights) and from 8am on Sundays; the tram runs 6am to 1am.",note:""},
  "New York":{sys:[{n:"Subway",t:"Metro"},{n:"MTA Buses",t:"Bus"},{n:"Staten Island Ferry",t:"Ferry"},{n:"Roosevelt Island Tramway",t:"Cable car"},{n:"LIRR &amp; Metro-North",t:"Train"}],map:"https://www.mta.info/maps",pay:"The MetroCard is gone — payment is now OMNY: just tap a contactless bank card or phone at the turnstile. No bank card? Buy an OMNY card for $1 at station vending machines and many shops. A ride costs $3.00, and after 12 paid taps in a week the rest are free; the Staten Island Ferry is free.",hours:"The subway runs 24 hours a day, 7 days a week, though late-night service is less frequent.",note:""},
  "Kuala Lumpur":{sys:[{n:"LRT",t:"Metro"},{n:"MRT",t:"Metro"},{n:"KL Monorail",t:"Monorail"},{n:"KTM Komuter",t:"Train"},{n:"Rapid KL &amp; free GOKL Buses",t:"Bus"}],map:"https://myrapid.com.my/bus-train/rapid-kl/rapid-kl-integrated-transit-map/",pay:"Rapid KL rail gates and buses accept contactless Visa/Mastercard directly, or use a Touch 'n Go card (about RM10, ~US$2.40) sold at convenience stores, station counters and the airport. Single-trip tokens are sold at station machines. The GOKL buses around downtown are free.",hours:"Trains run about 6am to midnight daily; after that, use Grab or taxis.",note:""},
  "Istanbul":{sys:[{n:"Metro",t:"Metro"},{n:"Trams (T1)",t:"Tram"},{n:"City Ferries",t:"Ferry"},{n:"Marmaray",t:"Train"},{n:"Tünel &amp; Funiculars",t:"Funicular"}],map:"https://www.metro.istanbul/en/YolcuHizmetleri/AgHaritalari",pay:"Buy an Istanbulkart from the yellow machines at stations, airports and major stops (small non-refundable card fee of a few US dollars), then top it up with cash or card — it covers metro, trams, ferries, buses and funiculars with cheap transfers. Contactless bank cards are also accepted at most readers, but at a higher per-ride fare. Single rides cost well under US$1 with the card.",hours:"Metro and trams run roughly 6am to midnight, with late-night service on some metro lines at weekends; night buses run overnight. Ferries run mainly in daytime.",note:""},
  "Tokyo":{sys:[{n:"Tokyo Metro &amp; Toei Subway",t:"Metro"},{n:"JR Lines (incl. Yamanote)",t:"Train"},{n:"City Buses",t:"Bus"},{n:"Tokyo Monorail",t:"Monorail"}],map:"https://www.tokyometro.jp/en/subwaymap/",pay:"Get a Suica or Pasmo IC card — it works on virtually every train, subway and bus. Buy one at station ticket machines (¥500 deposit, ~US$3.50), pick up a deposit-free Welcome Suica for tourists at the airports and major JR stations, or add Suica to an iPhone or Android in seconds. Top up with cash at any station machine or convenience store.",hours:"Trains and subways run about 5am to midnight–1am; there are no night trains, so plan for a taxi after the last train.",note:""},
  "Antalya":{sys:[{n:"AntRay Tram",t:"Tram"},{n:"Nostalji Heritage Tram",t:"Tram"},{n:"Antobüs City Buses",t:"Bus"}],map:"https://www.antalyaulasim.com.tr/Hizmetlerimiz/Antray",pay:"Cash is not accepted on board: use an Antalyakart smart card, sold and topped up at kiosks and machines at tram stops, the airport and the bus station, or pay by tapping a contactless bank card on buses and trams (slightly higher fare). Rides cost well under US$1.",hours:"The AntRay tram and city buses run roughly 6am to midnight; dolmuş minibuses are frequent during the day.",note:""},
  "Seoul":{sys:[{n:"Seoul Subway",t:"Metro"},{n:"City Buses",t:"Bus"},{n:"AREX Airport Express",t:"Train"}],map:"https://www.seoulmetro.co.kr/en/cyberStation.do",pay:"Buy a T-money card at any convenience store (GS25, CU, 7-Eleven) or station machine for ~3,000–5,000 won (~US$2–4) and top up with cash — it covers subway, buses and even taxis, with a base subway fare of about 1,550 won (~US$1.10). Foreign contactless bank cards can't be tapped at the gates yet (rollout runs through 2030), so the card is essential.",hours:"The subway runs about 5:30am to midnight; late-night 'Owl' (N) buses cover major routes overnight.",note:""},
  "Osaka":{sys:[{n:"Osaka Metro",t:"Metro"},{n:"JR Osaka Loop Line",t:"Train"},{n:"Osaka City Bus",t:"Bus"},{n:"Osaka Monorail",t:"Monorail"}],map:"https://subway.osakametro.co.jp/en/guide/routemap.php",pay:"Buy an ICOCA IC card (about ¥2,000/$13, including a refundable deposit) from station machines, or tap a contactless Visa/Mastercard/Amex directly at Osaka Metro gates. Base fares start around ¥180 (~$1.20) and rise with distance.",hours:"Trains and the metro run about 5am to midnight with no regular overnight service; night buses and taxis fill the gap after last trains.",note:""},
  "Rome":{sys:[{n:"Roma Metro",t:"Metro"},{n:"ATAC Bus",t:"Bus"},{n:"Roma Tram",t:"Tram"},{n:"Regional Rail (FL lines)",t:"Train"}],map:"https://www.atac.roma.it/en/utility/maps",pay:"Buy a BIT ticket (€1.50/$1.60, valid 100 minutes) from tobacco shops, station machines, or the MyCicero app, or simply tap a contactless bank card or phone at metro gates and bus validators via ATAC's tap&amp;go system. A 24-hour pass costs €7 (~$7.50).",hours:"Metro runs about 5:30am-11:30pm (until 1:30am Fri-Sat); night buses cover the network after the metro closes.",note:""},
  "Phuket":{sys:[{n:"Songthaew (shared truck-taxi)",t:"Bus"},{n:"Phuket Smart Bus",t:"Bus"}],map:"",pay:"There's no citywide transit card - pay drivers directly in cash (Thai baht). Shared songthaews charge a flat 30-50 THB (~$0.85-1.40) around town; the newer Phuket Smart Bus (airport-Patong-Karon-Rawai) and Grab app rides can be paid by card in-app or cash.",hours:"Songthaews run roughly 6am-6pm (later on Patong's main routes); there is no scheduled night transit, so tuk-tuks, taxis, or Grab cover late-night trips.",note:"Most visitors get around by songthaew, metered taxi, tuk-tuk, rented scooter, or the Grab ride-hailing app - there is no rail or citywide bus network."},
  "Barcelona":{sys:[{n:"TMB Metro",t:"Metro"},{n:"TMB Bus",t:"Bus"},{n:"Rodalies de Catalunya",t:"Train"},{n:"Barcelona Tram",t:"Tram"}],map:"https://www.tmb.cat/en/barcelona-transport/map/metro",pay:"Buy a T-Casual (10 trips, ~€12/$13) or a Hola BCN tourist card (unlimited rides for 2-5 days, from about €18/$19) at metro machines, TMB stores, or airport kiosks; contactless bank-card tap-in is being rolled out network-wide. A single ticket costs €2.55 (~$2.75).",hours:"Metro runs about 5am-midnight (Fri/eve-of-holiday until 2am, all night Saturdays); night buses cover the rest of the network.",note:""},
  "Amsterdam":{sys:[{n:"GVB Metro",t:"Metro"},{n:"GVB Tram",t:"Tram"},{n:"GVB Bus",t:"Bus"},{n:"GVB Ferry",t:"Ferry"}],map:"https://www.gvb.nl/en/gvb-maps",pay:"Tap a contactless debit/credit card or phone directly on trams, metro gates, and buses via the OVpay system - no card purchase needed. You can also buy a rechargeable OV-chipkaart (~€7.50/$8) at stations. Fares are distance-based, roughly €3-4 (~$3.25-4.30) for a typical city trip.",hours:"Metro and trams run about 6am-12:30am; night buses cover Amsterdam through the small hours on weekends.",note:""},
  "Milan":{sys:[{n:"ATM Metro",t:"Metro"},{n:"ATM Tram",t:"Tram"},{n:"ATM Bus",t:"Bus"},{n:"Malpensa Express",t:"Train"}],map:"https://www.atm.it/en/AltriServizi/Trasporto/Pages/Maps.aspx",pay:"Tap a contactless credit/debit card or Apple/Google Pay directly at ATM metro gates, trams, and buses - fares auto-cap at the daily rate after several taps. A single ticket costs €2.20 (~$2.40) and can also be bought at machines, tobacconists, or the ATM app.",hours:"Metro runs about 6am-12:30am (until 1:30am Saturdays); night bus lines substitute once the metro closes.",note:""},
  "Vienna":{sys:[{n:"Wiener Linien U-Bahn",t:"Metro"},{n:"Wiener Linien Tram",t:"Tram"},{n:"Wiener Linien Bus",t:"Bus"},{n:"S-Bahn",t:"Train"}],map:"https://www.wienerlinien.at/web/wl-en/network-maps",pay:"Tap a contactless bank card, phone, or smartwatch at Tap+Ride terminals in metro stations for automatic ticketing, or buy a single ticket (€3/$3.25) or 7-day pass (€25.20/$27) from ticket machines, the WienMobil app, or Tabak-Trafik shops.",hours:"U-Bahn runs all night Friday and Saturday; other nights service runs about 5am-12:30am with Nightline buses filling the gap.",note:""},
  "Prague":{sys:[{n:"Prague Metro",t:"Metro"},{n:"Prague Tram",t:"Tram"},{n:"Prague Bus",t:"Bus"},{n:"Petřín Funicular",t:"Funicular"}],map:"https://www.dpp.cz/en/timetables/traffic-scheme",pay:"Buy tickets via the PID Litacka app, station machines, or a rechargeable Litacka card from DPP info centers; contactless bank-card tap-in is also accepted network-wide. A 30-minute ticket costs 36-39 CZK (~$1.60) and a 24-hour pass 140-150 CZK (~$6.20).",hours:"Metro runs about 5am-midnight; night trams and buses run all night at reduced frequency.",note:""},
  "Los Angeles":{sys:[{n:"LA Metro Rail",t:"Metro"},{n:"LA Metro Busway (G/J Line)",t:"BRT"},{n:"LA Metro Bus",t:"Bus"},{n:"Metrolink",t:"Train"}],map:"https://www.metro.net/riding/guide/system-maps/",pay:"Tap a reloadable TAP card at readers on Metro Rail and buses - buy one for $2 at rail station machines or partner stores and load value or a pass; the TAP app also works by phone. Base fare is $1.75 per ride, with a $5 day-pass cap.",hours:"Metro Rail runs roughly 4-5am to between midnight and 2am depending on the line; there is no full 24-hour rail service.",note:""},
  "Sydney":{sys:[{n:"Sydney Trains",t:"Train"},{n:"Sydney Metro",t:"Metro"},{n:"Sydney Light Rail",t:"Tram"},{n:"Sydney Buses",t:"Bus"},{n:"Sydney Ferries",t:"Ferry"}],map:"https://transportnsw.info/document/1120/sydney-trains-network-map.pdf",pay:"Tap a contactless bank card or phone directly on Opal readers at stations, ferries, trams, and buses - no card purchase needed - or get a free physical Opal card from stations and convenience stores. Fares are distance-based (roughly AUD 4-6/$2.60-4) with a daily cap around AUD 17.80 (~$11.50).",hours:"Trains run about 4:30am-1am with limited NightRide buses replacing trains in the small hours; ferries and light rail run similar daytime-to-midnight hours.",note:""},
  "Cape Town":{sys:[{n:"MyCiTi",t:"BRT"},{n:"Golden Arrow Bus",t:"Bus"},{n:"Metrorail",t:"Train"}],map:"https://www.myciti.org.za/en/routes-stops/route-stop-station-map/",pay:"Buy a reloadable myconnect card (~R35/$1.90) at MyCiTi stations and kiosks to tap in on buses; cash is not accepted onboard. Fares are distance-based, roughly R10-30 (~$0.55-1.70) per trip.",hours:"MyCiTi buses run roughly 5am-10pm on most routes (later on trunk routes), with very limited or no late-night service.",note:"Most tourists rely on MyCiTi buses, metered taxis, or ride-hailing apps; minibus taxis serve locals widely but aren't tourist-friendly to navigate."},
  "Rio de Janeiro":{sys:[{n:"MetrôRio",t:"Metro"},{n:"VLT Carioca",t:"Tram"},{n:"BRT Rio",t:"BRT"},{n:"Barcas (ferry)",t:"Ferry"},{n:"SuperVia",t:"Train"}],map:"https://www.metrorio.com.br/VadeMetro/MapaInterativo",pay:"Buy a rechargeable Jaé card (replacing the old RioCard) at metro stations to tap in on Metro, VLT, and BRT; some gates also accept contactless bank cards directly. A single Metro ride costs about R$7.90 (~$1.40).",hours:"Metro runs about 5am-midnight (until 1am Fri/Sat); there is no all-night rail service, so late-night travelers rely on buses or ride-hailing.",note:""},
  "Cancún":{sys:[{n:"R-1 Hotel Zone Bus",t:"Bus"},{n:"Colectivos (shared vans)",t:"Bus"},{n:"ADO Intercity Bus",t:"Bus"}],map:"",pay:"Pay cash in pesos directly to the driver - the R-1 bus along the Hotel Zone costs about MX$12 (~$0.65) flat fare, and colectivo vans cost MX$10-15 (~$0.55-0.80) depending on distance. No transit card exists; exact change helps.",hours:"R-1 buses run about 5am-midnight along the Hotel Zone at frequent intervals; colectivos generally operate 5am-11pm with sparse late-night options via taxi.",note:"Most tourists use the R-1 city bus or shared colectivo vans along the Hotel Zone and to downtown; ADO runs airport/intercity buses, and taxis or ride-hailing apps cover the rest."},
  "Marrakech":{sys:[{n:"ALSA Marrakech City Buses",t:"Bus"}],map:"",pay:"City buses are run by ALSA; pay the driver in cash, about 5 MAD (~US$0.50) per ride, so carry small change. There is no transit card worth getting for a short visit. Airport bus L19 sells tickets on board (30 MAD, ~US$3).",hours:"Buses run roughly 6am-10pm; there is no night service.",note:"Most visitors walk the medina and use petit taxis (insist on the meter or agree a price first); buses mainly help for Gueliz, the Palmeraie and the airport."},
  "Madrid":{sys:[{n:"Madrid Metro",t:"Metro"},{n:"Cercanias Renfe",t:"Train"},{n:"EMT City Buses",t:"Bus"},{n:"Metro Ligero",t:"Tram"}],map:"https://www.metromadrid.es/en/travel-in-the-metro/metro-de-madrid-maps",pay:"Since June 2026 you can tap a contactless bank card or phone straight at Metro turnstiles, and EMT buses take contactless too. Alternatively buy a rechargeable Multi Card (2.50 EUR, ~US$3) from any metro station machine, the airport or tobacconists and load singles (1.50-2 EUR) or a 10-trip ticket. Airport metro trips carry a 3 EUR supplement.",hours:"Metro runs 6am-1:30am every day; after that, night owl buses fan out from Plaza de Cibeles.",note:""},
  "Taipei":{sys:[{n:"Taipei Metro (MRT)",t:"Metro"},{n:"Taipei City Buses",t:"Bus"},{n:"Taoyuan Airport MRT",t:"Train"},{n:"Maokong Gondola",t:"Cable car"}],map:"https://english.metro.taipei/cp.aspx?n=1BE0AF76C79F9A38",pay:"Get an EasyCard (NT$100, ~US$3, non-refundable card cost) from MRT station info counters or any 7-Eleven/FamilyMart, and top it up with cash; it works on the MRT, buses, YouBike and even convenience stores. Regular bank cards are not accepted at MRT gates. Single-journey tokens are sold at station machines if you skip the card.",hours:"The MRT runs about 6am-midnight daily; night owl buses are limited, so late travel is usually by taxi.",note:""},
  "Berlin":{sys:[{n:"U-Bahn (BVG)",t:"Metro"},{n:"S-Bahn Berlin",t:"Train"},{n:"BVG Trams",t:"Tram"},{n:"BVG Buses",t:"Bus"}],map:"https://www.bvg.de/en/connections/network-maps-and-routes",pay:"There are no tap-in gates: buy tickets in the BVG Fahrinfo or S-Bahn app, or from station machines (cards accepted), and validate paper tickets before boarding. A zone AB single costs about 4 EUR (~US$4.50) and a day ticket about 11 EUR; one ticket covers U-Bahn, S-Bahn, trams and buses. Staying weeks? The Deutschland-Ticket (63 EUR/month) covers local transit nationwide.",hours:"U-Bahn and S-Bahn run roughly 4am-1am on weekdays and all night on Friday-Saturday nights; night buses cover the gaps midweek.",note:""},
  "Melbourne":{sys:[{n:"Yarra Trams",t:"Tram"},{n:"Metro Trains Melbourne",t:"Train"},{n:"Metropolitan Buses",t:"Bus"}],map:"https://transport.vic.gov.au/plan-a-journey/maps",pay:"Contactless bank cards and phones are now accepted on trams, with rollout continuing across the network; otherwise use a myki card (AU$6, ~US$4) from station machines, 7-Elevens or as a mobile myki in your phone wallet. Fares cap at about AU$11-12 (~US$8) a day for unlimited travel. Trams within the CBD's Free Tram Zone cost nothing.",hours:"Trains and trams run roughly 5am-midnight, with 24-hour Night Network service on Friday and Saturday nights.",note:""},
  "Munich":{sys:[{n:"U-Bahn (MVG)",t:"Metro"},{n:"S-Bahn Munich",t:"Train"},{n:"MVG Trams",t:"Tram"},{n:"MVG Buses",t:"Bus"}],map:"https://www.mvg.de/verbindungen/fahrplaene-netzplaene.html?lang=en",pay:"No transit card needed: buy tickets in the MVGO or MVV app or from station machines (bank cards accepted) and validate before boarding. A zone M single is about 4 EUR (~US$4.50) and a day ticket about 10 EUR; one ticket covers U-Bahn, S-Bahn, trams and buses. The airport-city day ticket is good value for arrivals.",hours:"U-Bahn and S-Bahn run about 4am-1am (until ~2am on weekends); night trams and buses cover the small hours.",note:""},
  "Las Vegas":{sys:[{n:"Las Vegas Monorail",t:"Monorail"},{n:"RTC Deuce &amp; City Buses",t:"Bus"},{n:"Free Resort Trams",t:"Tram"}],map:"https://www.rtcsnv.com/ways-to-travel/schedules-maps/maps-guides/",pay:"For RTC buses, buy passes in the rideRTC app or at ticket machines along the Strip: US$6 for 2 hours or US$8 for 24 hours, valid on the Deuce and all buses. The Monorail is separate — singles around US$6 and day passes sold at station kiosks or lvmonorail.com. No transit card needed.",hours:"The Deuce runs 24/7 along the Strip; the Monorail runs from 7am until midnight-3am depending on the day.",note:"Transit only really covers the Strip and downtown: the Monorail runs behind the east-side casinos and the Deuce runs the Strip itself. Elsewhere, use rideshare or rent a car; free trams link several resorts (e.g. Bellagio-Aria, Mandalay Bay-Excalibur)."},
  "Florence":{sys:[{n:"Tramvia (GEST) T1 &amp; T2",t:"Tram"},{n:"Autolinee Toscane Buses",t:"Bus"}],map:"https://www.gestramvia.it/lines/?lang=en",pay:"A single ticket costs 1.70 EUR (~US$2) and is valid 90 minutes on trams and buses; buy from tram-stop machines, tabacchi shops or the at bus app. On trams you can simply tap a contactless bank card at the on-board validators. Buy bus tickets before boarding and validate them.",hours:"Trams run about 5am-12:30am (until ~2am Friday-Saturday); most buses run 6am-9pm.",note:""},
  "Dublin":{sys:[{n:"Luas",t:"Tram"},{n:"Dublin Bus",t:"Bus"},{n:"DART",t:"Train"}],map:"https://www.transportforireland.ie/plan-a-journey/network-maps/",pay:"Get a TFI Leap Card — fares are far cheaper than cash singles, and the 90-minute fare (about 2 EUR) covers transfers between bus, Luas and DART. The Leap Visitor Card (1 day ~10 EUR, 3 days ~20 EUR/~US$23, 7 days ~40 EUR) gives unlimited travel and is sold at Dublin Airport and city Leap agents. Contactless bank cards are not yet accepted on city buses, Luas or DART.",hours:"Buses run roughly 5am-11:30pm with several 24-hour routes and Nitelink on weekend nights; Luas runs about 5:30am-12:30am.",note:""},
  "Kyoto":{sys:[{n:"Kyoto City Subway",t:"Metro"},{n:"Kyoto City Bus",t:"Bus"},{n:"JR &amp; Private Railways (Hankyu, Keihan, Eizan)",t:"Train"}],map:"https://www2.city.kyoto.lg.jp/kotsu/webguide/en/comm/routemap.html",pay:"Use a rechargeable IC card — ICOCA locally, or Suica/Pasmo from elsewhere in Japan (500 JPY deposit, ~US$3.50) — bought at station ticket machines; tap on the subway, trains and buses. City buses are a flat 230 JPY, paid (or tapped) as you exit. The subway + bus one-day pass (1,100 JPY, ~US$7) from station machines is great value on busy sightseeing days.",hours:"The subway runs about 5:30am-11:30pm; city buses run roughly 6am-10pm with no night service.",note:""},
  "Lisbon":{sys:[{n:"Metro Lisboa",t:"Metro"},{n:"Carris Trams (incl. No. 28)",t:"Tram"},{n:"Carris Buses",t:"Bus"},{n:"Carris Funiculars (Gloria, Bica, Lavra)",t:"Funicular"},{n:"Tagus River Ferries",t:"Ferry"}],map:"https://www.metrolisboa.pt/en/travel/diagrams-and-maps/",pay:"You can now tap a contactless bank card or phone directly at Metro gates and on Carris buses and trams. Otherwise buy a navegante occasional card (0.50 EUR) from metro station machines and load singles (about 1.85 EUR) or the 24-hour pass (~7 EUR/~US$8) covering metro, buses, trams and funiculars. Buying on board tram 28 costs much more, so tap or pre-load instead.",hours:"The Metro runs 6:30am-1am daily; after that Carris night buses ('rede da madrugada') take over.",note:""},
  "Venice":{sys:[{n:"ACTV Vaporetto (Water Buses)",t:"Ferry"},{n:"ACTV Buses &amp; Trams (Mestre/Lido)",t:"Bus"},{n:"Venice People Mover",t:"Cable car"}],map:"https://actv.avmspa.it/en/content/consult-map",pay:"A single vaporetto ride costs 9.50 EUR (~US$11), so most visitors buy 1/2/3/7-day passes (25/35/45/65 EUR) from ACTV-Venezia Unica machines and booths at Piazzale Roma, the station and main stops. You can also just tap a contactless bank card at the 'Tappy' validators each time you board — the system charges the best fare with a daily cap. Always validate or tap before boarding.",hours:"Main lines (1, 2, and the Murano/Burano routes) run about 5am-midnight; night line N covers the Grand Canal and Lido overnight.",note:"The vaporetto IS the transit — Venice has no cars or bikes, so it's boats or your own two feet. Buses and trams only serve Mestre and the Lido."},
  "Athens":{sys:[{n:"Athens Metro",t:"Metro"},{n:"Athens Tram",t:"Tram"},{n:"OASA Buses &amp; Trolleybuses",t:"Bus"},{n:"Proastiakos Suburban Railway",t:"Train"}],map:"https://www.stasy.gr/en/timetables/map/",pay:"You can tap a contactless bank card or phone at metro and tram gates and on buses (Tap2Ride). Otherwise buy a paper Ath.ena Ticket from station machines: a 90-minute fare is 1.20 EUR (~US$1.40), a day pass 4.10 EUR, and the 3-day tourist ticket (~20 EUR) includes one airport round trip. Airport metro trips otherwise cost about 9 EUR.",hours:"The metro runs about 5:30am-12:30am, with lines 2 and 3 running until ~2:30am on Friday and Saturday nights; a few bus routes run 24 hours.",note:""},
  "Orlando":{sys:[{n:"LYNX",t:"Bus"},{n:"SunRail",t:"Train"},{n:"LYMMO",t:"BRT"},{n:"I-Ride Trolley",t:"Bus"}],map:"https://www.golynx.com/maps-schedules/",pay:"LYNX buses cost $2 per ride or $4.50 for a day pass, paid with exact cash on board or via the LYNX PawPass app. SunRail tickets and reloadable SunCards come from station vending machines; the downtown LYMMO bus loop is free. The I-Ride Trolley on International Drive takes $2 cash.",hours:"Most LYNX routes run roughly 5am-11pm; SunRail runs weekdays only (about 5:30am-11pm) with no weekend service.",note:"Transit is thin outside downtown and I-Drive - most visitors rely on a rental car, Uber/Lyft, hotel theme-park shuttles, and the I-Ride Trolley."},
  "Toronto":{sys:[{n:"TTC Subway",t:"Metro"},{n:"TTC Streetcar",t:"Tram"},{n:"TTC Bus",t:"Bus"},{n:"UP Express",t:"Train"},{n:"GO Transit",t:"Train"}],map:"https://www.ttc.ca/routes-and-schedules",pay:"Easiest: tap a contactless credit/debit card or phone at any reader - one adult fare (about C$3.30 / US$2.40) covers 2 hours of transfers across subway, streetcars and buses. Or get a PRESTO card (C$6) from station fare machines or Shoppers Drug Mart pharmacies. The same tap works on the UP Express airport train and GO trains.",hours:"Subway runs about 6am-1:30am (from 8am Sundays); Blue Night buses and streetcars cover major routes overnight.",note:""},
  "Miami":{sys:[{n:"Metrorail",t:"Metro"},{n:"Metromover",t:"Monorail"},{n:"Metrobus",t:"Bus"},{n:"Brightline",t:"Train"},{n:"Tri-Rail",t:"Train"}],map:"https://www.miamidade.gov/transit/library/system-map-brochure.pdf",pay:"Tap a contactless credit/debit card or phone straight at Metrorail faregates and bus readers ($2.25 a ride), or buy an EASY Card (about $2) from station vending machines; the GO Miami-Dade app sells mobile tickets too. The downtown Metromover is completely free. Brightline and Tri-Rail sell their own tickets via app or station machines.",hours:"Metrorail and Metromover run daily from about 5am to midnight; a handful of Metrobus routes run 24 hours.",note:""},
  "San Francisco":{sys:[{n:"BART",t:"Train"},{n:"Muni Metro &amp; Streetcars",t:"Tram"},{n:"Muni Bus",t:"Bus"},{n:"Cable Cars",t:"Cable car"},{n:"SF Bay Ferry",t:"Ferry"}],map:"https://www.sfmta.com/maps",pay:"The Clipper card works on BART, Muni, ferries and more - get it free in Apple/Google Wallet or as a plastic card ($3) from station machines and Walgreens. Contactless tap-to-pay with your own bank card is also rolling out across Muni and BART. Cable cars cost $8 a ride (Clipper, app, or cash to the conductor).",hours:"BART runs about 5am-midnight (from 6am Sat, 8am Sun); Muni runs roughly 5am-midnight with 24-hour Owl bus routes; cable cars about 7am-10:30pm.",note:""},
  "Shanghai":{sys:[{n:"Shanghai Metro",t:"Metro"},{n:"Maglev",t:"Train"},{n:"City Buses",t:"Bus"},{n:"Huangpu River Ferry",t:"Ferry"}],map:"http://service.shmetro.com/en/yxxlt/index.htm",pay:"Since 2025 you can tap a foreign Visa/Mastercard directly at metro gates network-wide (Tap to Ride). Alternatively use QR codes in the Metro Daduhui app or Alipay/WeChat (both accept international cards), or buy single tickets and the rechargeable Shanghai Public Transportation Card at station machines and service counters. Rides cost CNY 3-15 (about US$0.40-2).",hours:"Metro runs roughly 5:30am-11pm (varies by line, slightly later on some lines Fri-Sat); no overnight service.",note:""},
  "Frankfurt am Main":{sys:[{n:"S-Bahn",t:"Train"},{n:"U-Bahn",t:"Metro"},{n:"Tram",t:"Tram"},{n:"City Buses",t:"Bus"}],map:"https://www.rmv.de/c/en/timetables/networks/network-maps",pay:"No transit card needed - buy single tickets (about EUR 4) or day tickets (about EUR 7) from station machines or the RMVgo app; tickets are sold pre-validated, just board. One RMV ticket covers S-Bahn, U-Bahn, trams and buses, including the S-Bahn from the airport. Staying longer? The Deutschland-Ticket (EUR 58/month) covers local transit nationwide.",hours:"U-Bahn and S-Bahn run about 4:30am-1am; night buses and hourly weekend S-Bahn trains keep the city covered overnight Fri-Sat.",note:""},
  "Copenhagen":{sys:[{n:"Metro",t:"Metro"},{n:"S-train",t:"Train"},{n:"City Buses",t:"Bus"},{n:"Harbour Bus",t:"Ferry"}],map:"https://dinoffentligetransport.dk/en/plan-your-journey/zone-and-line-maps",pay:"Buy single tickets (from DKK 24 / ~US$3.80) at station and airport machines, or use the Rejsekort app to check in and out with your phone - the old physical Rejsekort card is being phased out in favor of the app. The City Pass (from DKK 100 / ~US$16 for 24 hours) covers metro, trains, buses and harbour buses including the airport. One ticket is valid across all operators.",hours:"The Metro runs 24/7. S-trains and buses run about 5am-12:30am, with all-night S-trains and night buses on Friday and Saturday nights.",note:""},
  "Zurich":{sys:[{n:"Tram",t:"Tram"},{n:"City Buses",t:"Bus"},{n:"S-Bahn",t:"Train"},{n:"Lake Zurich Boats",t:"Ferry"},{n:"Polybahn",t:"Funicular"}],map:"https://www.zvv.ch/en/timetable-and-information/network.html",pay:"Buy tickets before boarding from machines at every stop or in the ZVV or SBB Mobile apps (EasyRide check-in). A single city-zone ticket is about CHF 4.60 (~US$5.70) and a 24-hour pass about CHF 9.20; the tourist Zurich Card includes all transit. One ticket covers trams, buses, S-Bahn and boats - there are no tap gates, but inspections are frequent.",hours:"Trams and trains run about 5am-12:30am daily; on Friday and Saturday nights an all-night network of trams, buses and S-Bahn runs at no extra charge.",note:""},
  "Washington, D.C.":{sys:[{n:"Metrorail",t:"Metro"},{n:"Metrobus",t:"Bus"},{n:"DC Streetcar",t:"Tram"}],map:"https://www.wmata.com/schedules/maps/",pay:"Tap a contactless credit/debit card or phone directly at Metrorail faregates and bus readers (Tap. Ride. Go.), or use a SmarTrip card - $2 from station vending machines or free in Apple/Google Wallet. Rail fares run about $2.25-6.75 by distance and time of day; buses are a flat $2.25. The DC Streetcar on H Street is free.",hours:"Metrorail runs 5am-midnight Mon-Thu, until 1am Fri-Sat (from 7am weekends), and 7am-midnight Sun; several Metrobus routes run 24 hours.",note:""},
  "Pattaya-Chonburi":{sys:[{n:"Songthaew (Baht Bus)",t:"Bus"}],map:"",pay:"Songthaews (shared pickup-truck 'baht buses') cost a flat 10-20 baht (~US$0.30-0.60) on their loop routes - hop on, ring the bell, and pay the driver cash when you get off. Chartering one privately or going off-route costs more, so agree on the price first. Grab and Bolt apps work well for cars and motorbike taxis.",hours:"Baht buses circulate on Beach Road and Second Road from early morning until around midnight, more frequently than any schedule - just flag one down.",note:"No formal transit system - locals and tourists get around by baht bus, motorbike taxi, and Grab/Bolt rideshare; Bangkok is reachable by intercity bus or the airport highway."},
  "Vancouver":{sys:[{n:"SkyTrain",t:"Metro"},{n:"TransLink Buses",t:"Bus"},{n:"SeaBus",t:"Ferry"}],map:"https://www.translink.ca/schedules-and-maps/transit-system-maps",pay:"Tap a contactless credit/debit card or phone at any fare gate or bus reader - no setup needed - or buy a Compass Card (C$6 refundable deposit) from station vending machines and London Drugs stores. Adult fares run about C$3.35-6.60 (~US$2.45-4.85) depending on zones; buses are one zone flat. The same tap covers SkyTrain, buses and the SeaBus to North Vancouver.",hours:"SkyTrain runs about 5am-1:30am (shorter Sundays); NightBus routes cover main corridors after closing.",note:""},
  "Stockholm":{sys:[{n:"Tunnelbana (Metro)",t:"Metro"},{n:"SL Buses",t:"Bus"},{n:"Trams",t:"Tram"},{n:"Commuter Trains",t:"Train"},{n:"SL Ferries",t:"Ferry"}],map:"https://sl.se/en/in-english/getting-around/sl-service-network-maps",pay:"Simplest: tap a contactless bank card or phone at the blue card readers - a single ticket (about SEK 45 / ~US$4.70) gives 75 minutes of travel on metro, buses, trams, trains and SL ferries. You can also buy tickets in the SL app, or get a reloadable SL card (SEK 20) at SL Centers and Pressbyran convenience stores. Note: you cannot buy tickets on board buses.",hours:"The metro runs about 5am-1am, and all night on Friday and Saturday nights; night buses cover other nights.",note:""},
  "Mexico City":{sys:[{n:"Metro",t:"Metro"},{n:"Metrobus",t:"BRT"},{n:"Cablebus",t:"Cable car"},{n:"Tren Ligero",t:"Tram"},{n:"Trolebus",t:"Bus"}],map:"https://metro.cdmx.gob.mx/la-red/mapa-de-la-red",pay:"You need the rechargeable MI (Movilidad Integrada) card - paper tickets were discontinued in 2024. It costs MXN 15 (~US$0.80) plus fare balance, sold at metro station ticket booths (cash) and Metrobus/Cablebus vending machines, and works across the metro, Metrobus, Cablebus, light rail and trolleybuses. Rides are cheap: Metro MXN 5 (~US$0.25), Metrobus MXN 6.",hours:"Metro runs 5am-midnight weekdays, from 6am Saturdays and 7am Sundays/holidays; Metrobus Line 1 runs nearly 24 hours but most lines stop around midnight.",note:""},
  "Oslo":{sys:[{n:"Oslo Metro (T-bane)",t:"Metro"},{n:"Oslo Tram (Trikk)",t:"Tram"},{n:"Ruter Bus",t:"Bus"},{n:"Oslo Ferry (Nesoddtangen)",t:"Ferry"},{n:"Airport Express Train (Flytoget)",t:"Train"}],map:"https://ruter.no/en/plan-journey/timetables-and-route-maps",pay:"Buy tickets in the Ruter app or at Narvesen/7-Eleven kiosks and station machines, or simply tap a contactless bank card on trams, buses, ferries and at metro readers. A single zone-1 adult ticket costs about 44 NOK (roughly $4.50) and a 24-hour day ticket about 135 NOK (roughly $14).",hours:"Metro, tram and bus service runs from about 5:30am until around midnight-1am daily, with dedicated night buses (N-routes) covering the network on Friday and Saturday nights.",note:""},
  "São Paulo":{sys:[{n:"São Paulo Metro (Metrô)",t:"Metro"},{n:"CPTM Urban Rail",t:"Train"},{n:"SPTrans Bus",t:"Bus"},{n:"Monorail (Line 15-Prata)",t:"Monorail"}],map:"https://www.metro.sp.gov.br/sua-viagem/mapa-da-rede/",pay:"Use the rechargeable Bilhete Único card, sold at metro/CPTM stations and bus terminals, or simply tap a contactless Visa/Mastercard at the turnstiles and on most buses. A single Metro or CPTM ride costs about R$5.40 and a bus ride about R$5.30 (each roughly $1.05), with a discounted transfer between bus and rail within about 3 hours.",hours:"The Metro and CPTM run from around 4:40am to midnight, extended to about 1am on Fridays, Saturdays and pre-holidays; select 24-hour night bus lines cover key corridors when the rail network is closed.",note:""},
  "Helsinki":{sys:[{n:"Helsinki Metro",t:"Metro"},{n:"Helsinki Tram",t:"Tram"},{n:"HSL Bus",t:"Bus"},{n:"Suomenlinna Ferry",t:"Ferry"},{n:"Commuter Train",t:"Train"}],map:"https://www.hsl.fi/en/travelling/route_and_station_maps",pay:"Buy tickets through the HSL app or load an HSL travel card, or tap a contactless bank card directly on buses and trams (at a slightly higher fare). A single adult zone AB ticket costs about €3.30 via the app or €3.50 tapping a bank card (roughly $3.75-4), and a one-day ticket costs around €9-10 (roughly $10-11).",hours:"Metro, tram and bus service runs from about 5:30am to 11:30pm-midnight most days, with an expanded night-bus and night-tram network on Friday and Saturday nights.",note:""},
  "Brussels":{sys:[{n:"Brussels Metro",t:"Metro"},{n:"STIB/MIVB Tram",t:"Tram"},{n:"STIB/MIVB Bus",t:"Bus"},{n:"SNCB/NMBS Train",t:"Train"}],map:"https://www.stib-mivb.be/travel/network-and-district-maps",pay:"Tap a contactless bank card, phone or smartwatch directly at metro gates and bus/tram validators, or buy a MOBIB card or ticket through the STIB app, at metro stations, kiosks and vending machines. A single Brupass journey costs about €2.70 (€2.40 tapping a bank card, roughly $2.75-3), and fares auto-cap at about €8.50 per day after four trips.",hours:"Metro, tram and bus service runs from about 6am to around midnight, with the Noctis night-bus network taking over on Friday and Saturday nights until roughly 3am.",note:""},
  "Budapest":{sys:[{n:"Budapest Metro (M1-M4)",t:"Metro"},{n:"Budapest Tram",t:"Tram"},{n:"BKK Bus",t:"Bus"},{n:"Castle Hill Funicular (Sikló)",t:"Funicular"},{n:"Danube Public Boat",t:"Ferry"}],map:"https://bkk.hu/en/journey-planning/maps/",pay:"Use the BudapestGO app, buy paper tickets or travelcards at machines and metro ticket offices, or tap a contactless bank card via the Pay&amp;GO system on all four metro lines and the 100E airport bus. A single ticket costs 500 Ft (roughly $1.65) and a 24-hour travelcard 2,750 Ft (roughly $9), covering unlimited metro, tram and bus rides.",hours:"Regular service runs from about 4:30am to 11pm-11:30pm, after which an extensive night bus and tram network, including routes mirroring the metro lines, runs all night, every night.",note:""},
  "Guangzhou":{sys:[{n:"Guangzhou Metro",t:"Metro"},{n:"Zhongshan Avenue BRT",t:"BRT"},{n:"Pearl River Ferry",t:"Ferry"},{n:"Guangzhou City Bus",t:"Bus"}],map:"https://www.gzmtr.com/",pay:"Use a Yang Cheng Tong transit card (metro, buses and ferries), scan a QR code in the Guangzhou Metro app or Alipay/WeChat Pay, or tap a Visa, Mastercard or UnionPay contactless bank card at the gate. Cards and tickets are sold from vending machines and staffed windows in every station. A single ride starts at ¥2 (about $0.30) and rises with distance to about ¥20 (~$2.80); a 24-hour unlimited pass is also ¥20.",hours:"Most metro lines run daily from around 6am until 11pm-midnight, with no overnight metro; a handful of night-bus routes cover major corridors after the metro closes.",note:""},
  "Nice":{sys:[{n:"Tramway de Nice",t:"Tram"},{n:"Lignes d'Azur Bus",t:"Bus"},{n:"SNCF TER",t:"Train"}],map:"https://www.lignesdazur.com/fr/plan-lignes-azur",pay:"Use the rechargeable Ticket Azur card or the Lignes d'Azur phone app; single tickets and cards can also be bought from tram and bus vending machines (coins or bank card) or from the bus driver. A single ticket costs about €1.50 (~$1.75) and covers transfers for 74 minutes, while a 1-day pass is about €5 (~$5.80).",hours:"Trams run daily from roughly 4:30am until about 1:30am, and buses on a similar span with most last departures around midnight; there is no all-night network, so very late trips rely on taxis.",note:""},
  "Palma de Mallorca":{sys:[{n:"EMT Palma Bus",t:"Bus"},{n:"Metro de Mallorca (M1/M2)",t:"Metro"},{n:"SFM Train",t:"Train"}],map:"https://www.tib.org/en/xarxa-de-transports/mapa-linies",pay:"Pay with the islandwide TIB intermodal smartcard or, on EMT city buses, simply tap a contactless bank card, Apple Pay or Google Pay when boarding. A single EMT bus ride is €2 in cash (about $2.30) but only around €1.20 (~$1.40) by contactless card; tickets and cards are also sold at EMT and TIB kiosks, station machines, and on board.",hours:"EMT buses run from about 5:30-6am to around 11pm-midnight depending on route; the M1 metro line runs roughly 6:30am-10pm weekdays (shorter Saturdays, no Sunday service), with no regular overnight service.",note:"Transit really only covers Palma city and a short metro line, so exploring the rest of Mallorca's beaches, villages and the Serra de Tramuntana mountains usually needs a rental car, taxi or rideshare."},
  "Honolulu":{sys:[{n:"TheBus",t:"Bus"},{n:"Skyline",t:"Metro"}],map:"https://www.thebus.org/Route/RouteMaps.asp",pay:"The HOLO card is the main fare card (a $2 one-time fee, then loaded with value or a pass) and is sold at ABC Stores, Foodland, Longs Drugs, vending machines and the HOLO app; conventional contactless bank-card tap is not yet standard, so cash (exact fare) or a HOLO card is best. A single ride is $3.25 and a 24-hour day pass $7.50, valid on both TheBus and Skyline.",hours:"Most TheBus routes run from about 4:30am to around midnight (a few late-night routes), while Skyline rail runs daily 4am-10:30pm with no overnight service.",note:"TheBus and the expanding Skyline rail cover Honolulu well, but many attractions (North Shore, Hanauma Bay, hiking trails) are far from any route, so most visitors rent a car or use rideshare for full-island exploration."},
  "Beijing":{sys:[{n:"Beijing Subway",t:"Metro"},{n:"Beijing Bus",t:"Bus"},{n:"Airport Express",t:"Train"}],map:"https://www.bjsubway.com/station/xltcx/",pay:"Use the reloadable Yikatong card, sold and topped up at station counters and vending machines, or the Yikatong app for phone tap-in. Since late 2024, all subway lines and city buses also accept tap-to-pay with foreign Visa and Mastercard contactless cards. Subway fares are distance-based, starting at ¥3 (about $0.40) up to 6 km and rising to roughly ¥6-10 for cross-town rides; buses are typically ¥1-2.",hours:"Most subway lines run about 5-5:30am to 11-11:30pm, sometimes extended on major holidays; the dense bus network includes night-bus routes running through the early morning.",note:""},
  "Warsaw":{sys:[{n:"Warsaw Metro",t:"Metro"},{n:"Warsaw Tram",t:"Tram"},{n:"Warsaw Bus",t:"Bus"},{n:"Commuter Rail (SKM)",t:"Train"}],map:"https://www.wtp.waw.pl/en/maps-schemas/",pay:"Tickets run on the Warsaw City Card (a reloadable smartcard tapped on validators and metro gates) or via apps like jakdojade, mobiletMP or mObywatel; ticket machines take contactless cards, but open tap-to-ride directly with a bank card is not yet systemwide. A 20-minute ticket costs 3.40 zł (about $0.85), a 75-minute ticket 4.40 zł (about $1.10), and a one-day zone-1 ticket 15 zł (about $3.75).",hours:"Metro line M1 runs roughly 5am to midnight (later on Friday/Saturday nights), and trams/buses keep similar hours; a network of night bus lines (prefixed N) covers the city overnight.",note:""},
  "Seville":{sys:[{n:"Metro de Sevilla",t:"Metro"},{n:"TUSSAM Bus",t:"Bus"},{n:"MetroCentro Tram",t:"Tram"}],map:"https://www.metro-sevilla.es/en/travellers/network-map",pay:"Use the rechargeable Tarjeta Multiviaje, a TUSSAM/Metro smartcard sold at TUSSAM offices, metro machines and some kiosks (refundable deposit); contactless bank-card tap-to-pay is not yet accepted onboard. A single paper ticket costs about €1.40 (around $1.55), the Multiviaje card lowers each ride to roughly €0.69, and a 1-day tourist pass costs €5 (about $5.50).",hours:"Metro trains run about 6:30am to 11pm weekdays, extending to around 1-2am on Friday, Saturday and pre-holiday nights; buses and the tram keep similar hours, with a few night (\"Búho\") lines on weekends.",note:""},
  "Valencia":{sys:[{n:"Metrovalencia Metro",t:"Metro"},{n:"Metrovalencia Tram",t:"Tram"},{n:"EMT Valencia Bus",t:"Bus"}],map:"https://www.metrovalencia.es/en/map/",pay:"Rides use the rechargeable SUMA10 smartcard, sold and topped up at metro/tram machines and EMT points; contactless bank cards are not yet accepted at the gates, only Metrovalencia's own smartcards. A single ticket costs from €1.50 for one zone up to €4.80 for the widest zone (about $1.65-5.30), and a 1-day SUMA T pass starts at €4 (about $4.40).",hours:"Metro and trams run from around 5:30am until about midnight (some lines finish nearer 11pm); EMT buses run through the evening, with a handful of Nitbus night lines on Friday and Saturday nights.",note:""},
  "Bologna":{sys:[{n:"Tper Buses",t:"Bus"},{n:"Marconi Express (airport people mover)",t:"Monorail"},{n:"Trenitalia/Tper Regional Trains",t:"Train"}],map:"https://www.tper.it/percorsi-orari/mappe",pay:"A single Tper ticket costs EUR 2.30 (about USD 2.70), valid 75 minutes; buy it at tabaccherie, newsstands and machines, or pay EUR 2.50 in coins at the onboard machine. Easiest option: tap a contactless bank card or phone on the validator when boarding (EUR 2.30, best fare applied automatically), or use the Roger app; a day ticket is EUR 9. The Marconi Express monorail to the airport is separate, EUR 12.80 one way (about USD 15), payable online, at station machines or by contactless tap at the gates.",hours:"Buses run roughly 5:30am to midnight; a network of dedicated night lines covers late-night hours, especially on weekends.",note:""},
  "Verona":{sys:[{n:"ATV Urban Buses",t:"Bus"},{n:"ATV Aerobus (airport shuttle, line 199)",t:"Bus"}],map:"https://www.atv.verona.it/routes-and-timetables/verona",pay:"A single urban ticket is EUR 1.50 (about USD 1.75) from tabaccherie, newsstands, ATV ticket offices or machines, or EUR 2.00 from the machine onboard; a day ticket is EUR 5 and covers one adult plus a child under 14. With ATV's Bip&amp;Vai system you can simply tap a contactless bank card on the onboard validator, or buy via the Ticket Bus Verona app. Validate paper tickets every time you board.",hours:"Daytime buses run roughly 5:30am to 8:30-9pm; a reduced evening network of 'serale' lines runs until around midnight, with thinner service on Sundays and holidays.",note:""},
  "Rhodes":{sys:[{n:"RODA Town Buses",t:"Bus"},{n:"KTEL Rhodes Intercity Buses",t:"Bus"},{n:"Dodecanese Island Ferries",t:"Ferry"}],map:"https://www.rhodes.gr/bus-routes/",pay:"Pay cash: buy tickets at the kiosks/ticket booths by the New Market (Mandraki) bus terminals or from the driver for a small surcharge; contactless bank cards are generally not accepted onboard. RODA town rides cost about EUR 1.20-2.60, KTEL to Faliraki about EUR 2.50 and to Lindos about EUR 5.50 (roughly USD 6.50). Bring small bills or coins.",hours:"RODA city buses run roughly 6:30am to 8:30pm; KTEL coastal routes (east side to Faliraki/Lindos) run from about 6:15am until 10pm-midnight in summer, with no night service.",note:"Rhodes has no metro or trains: locals and tourists use RODA buses around Rhodes Town, KTEL buses down the east and west coasts (Faliraki, Lindos, airport), plus taxis; a rental car or scooter is the practical choice for exploring the wider island."},
  "Shenzhen":{sys:[{n:"Shenzhen Metro",t:"Metro"},{n:"Shenzhen Bus",t:"Bus"}],map:"https://www.szmc.net/szmc_en/map/",pay:"Tap a rechargeable Shenzhen Tong card, or just scan a QR code in WeChat Pay/Alipay or the Metro app (no card needed, works for tourists with a foreign phone). Cards and top-ups are sold at station customer-service counters and vending machines. Fares start around ¥2 (~$0.30) and rise with distance, capped around ¥15 (~$2).",hours:"Trains run roughly 6:30am to 11pm-midnight depending on the line; there is no true overnight service.",note:""},
  "Doha":{sys:[{n:"Doha Metro",t:"Metro"},{n:"Lusail Tram",t:"Tram"},{n:"Metrolink Bus",t:"Bus"}],map:"https://www.qr.com.qa/metro-tram?code=AboutMetroAndTram",pay:"Buy a rechargeable Travel (Karwa) card at any station ticket machine or customer-service desk, then tap in/out; single Standard-class trips run about QAR 2 (~$0.55), with day and weekly passes available, and Gold Club class costs more. Contactless bank-card tap-in is still limited, so getting a card first is easiest.",hours:"Metro runs Saturday-Wednesday roughly 6am-midnight, Thursday until 1am, and Friday afternoon-midnight only; check the app for exact daily times.",note:""},
  "Abu Dhabi":{sys:[{n:"Abu Dhabi Public Bus",t:"Bus"}],map:"https://itc.gov.ae/en/public-transport/bus/",pay:"Buses require a prepaid Hafilat smart card (no cash accepted) costing about AED 10 (~$2.70), sold and rechargeable at bus station kiosks, Hafilat vending machines and some stores. Tap on boarding and alighting; city fares start around AED 2 (~$0.55), with higher fares for intercity routes.",hours:"Most city routes run roughly 5-6am to midnight with reduced night frequency; a few key routes run 24 hours.",note:"Abu Dhabi has no metro yet; buses cover the city but many visitors combine them with taxis, which are plentiful and cheap."},
  "Fukuoka":{sys:[{n:"Fukuoka City Subway",t:"Metro"},{n:"Nishitetsu Bus",t:"Bus"},{n:"Nishitetsu Tenjin Omuta Line",t:"Train"}],map:"https://subway.city.fukuoka.lg.jp/eng/route/deta/map.pdf",pay:"Use a nationwide IC card such as SUGOCA, Suica or ICOCA (all interoperable) by tapping at gates and on buses; cards cost about ¥2,000 (~$13, incl. ¥500 deposit) and are sold/topped up at station machines. Base subway fares start around ¥210 (~$1.40); a 1-Day Pass (about ¥640/~$4.30) covers unlimited subway rides.",hours:"The subway runs daily from about 5:30am to around 12:20am.",note:""},
  "Sapporo":{sys:[{n:"Sapporo Municipal Subway",t:"Metro"},{n:"Sapporo Streetcar",t:"Tram"},{n:"Sapporo City Bus",t:"Bus"}],map:"https://www.city.sapporo.jp/st/english/documents/rosenzu_e.pdf",pay:"Tap a SAPICA IC card (or any nationwide IC card like Suica) on subway, streetcar and bus readers. Cards cost ¥2,000 (~$13, incl. ¥500 deposit) and are sold/recharged at subway ticket machines and offices. Base subway fare is about ¥210 (~$1.40), rising with distance.",hours:"The subway runs roughly 6am to just after midnight; the streetcar stops earlier, around 11:30pm.",note:""},
  "Busan":{sys:[{n:"Busan Metro",t:"Metro"},{n:"Busan-Gimhae Light Rail",t:"Metro"},{n:"Busan Bus",t:"Bus"}],map:"https://www.humetro.busan.kr/eng/board/list.do?menu_no=1002110000",pay:"Get a T-money or Cashbee card (Korea's nationwide transit cards) for about ₩4,000 (~$3) at convenience stores (GS25, CU, 7-Eleven) or subway machines, then load cash and tap in/out. Base subway fare is about ₩1,500 (~$1.10), rising with distance, with free transfers to buses.",hours:"The subway runs roughly 5:30am to midnight, with exact times varying slightly by line.",note:""},
  "Edinburgh":{sys:[{n:"Edinburgh Trams",t:"Tram"},{n:"Lothian Buses",t:"Bus"},{n:"NightBus",t:"Bus"}],map:"https://www.lothianbuses.com/maps-and-times/network-maps/",pay:"Tap a contactless bank card or phone directly on buses and trams (fares auto-cap daily), or buy a Ridacard travel pass for frequent use at TravelHub kiosks. A single flat fare is about £2 (~$2.60); exact cash is also accepted on buses (no change given).",hours:"Trams run roughly 5am-11:30pm; Lothian's NightBus network covers the city through the early hours once daytime routes stop.",note:""},
  "Montreal":{sys:[{n:"Montreal Metro",t:"Metro"},{n:"STM Bus",t:"Bus"},{n:"REM",t:"Train"}],map:"https://www.stm.info/en/info/networks/maps",pay:"Buy a reloadable OPUS card for C$6 (~$4.40) at metro station machines/counters or authorized retailers, then load fares and tap to enter. A single fare is about C$3.75 (~$2.75); an unlimited day pass is about C$11.50 (~$8.50). The Chrono app can also load fares onto your phone.",hours:"The Metro runs about 5:30am to 1am (later on weekends); an all-night bus network covers the city after the metro closes.",note:""},
  "Delhi":{sys:[{n:"Delhi Metro",t:"Metro"},{n:"DTC Bus",t:"Bus"}],map:"https://www.delhimetrorail.com/network_map",pay:"Get a rechargeable smart card (increasingly the NCMC/One Delhi card) at any station customer-care counter for about ₹200 (~$2.40, including a refundable deposit), then tap in/out; QR-code tickets are also sold at machines and the DMRC app. Fares range roughly ₹10-60 (~$0.12-0.72) depending on distance.",hours:"Trains generally run from about 5-5:30am until 11:30pm-midnight, with services roughly every 3-10 minutes at peak.",note:""},
  "Porto":{sys:[{n:"Porto Metro",t:"Metro"},{n:"STCP Bus",t:"Bus"},{n:"Porto Tram",t:"Tram"}],map:"https://en.metrodoporto.pt/pages/396",pay:"Buy an Andante card (about €0.60, ~$0.65) at metro stations or Loja Andante shops, then load zone-based tickets from about €1.40 (~$1.50) or a 24-hour pass from €5.15 (~$5.50); a 1-day Andante Tour tourist pass costs about €7.50 (~$8). Contactless bank-card tap-in is being rolled out but not yet universal, so the card is the safe default.",hours:"The Metro runs daily from about 6am to 1am, with slightly reduced Sunday hours.",note:""},
  "Ho Chi Minh City":{sys:[{n:"HCMC Metro Line 1",t:"Metro"},{n:"City Bus",t:"Bus"}],map:"https://hurc.vn/",pay:"Buy a reusable Stored Fare Card at station machines/counters, or tap a contactless Visa/Mastercard/NAPAS bank card directly at the gates; MoMo, ZaloPay and the HCMC Metro app also work. Single rides cost 7,000-20,000 VND (about $0.30-0.80); a 1-day pass is 40,000 VND (~$1.60).",hours:"Line 1 runs daily about 5am-10pm with trains every 8-12 minutes; there is no overnight service.",note:""},
  "Buenos Aires":{sys:[{n:"Subte",t:"Metro"},{n:"Colectivo",t:"Bus"}],map:"https://mapa.buenosaires.gob.ar/subte/",pay:"Load a rechargeable SUBE card (sold/topped up at kiosks, post offices and stations; foreigners need their passport, or use the airport tourist kiosk) or tap a contactless bank card/phone at the turnstiles. A single subte ride costs roughly ARS 1,600-2,500 depending on card registration (about $1.20-2).",hours:"The Subte runs about 5am-11pm on weekdays with shorter weekend hours; there is no night service.",note:""},
  "Marne-la-Vallée":{sys:[{n:"RER A",t:"Train"},{n:"TGV",t:"Train"}],map:"https://www.transilien.com/en/page-lignes/ligne-a",pay:"Buy a reloadable Navigo Easy card (about €2) at any RATP/SNCF machine, or simply tap a contactless bank card at the RER gates. A one-way ticket from central Paris to Marne-la-Vallée Chessy (zone 5) costs about €10.30 (~$11).",hours:"RER A runs roughly 5am-1am daily; there is no all-night service and last trains leave Paris around midnight.",note:"This is the Disneyland Paris area, reached via RER A or direct TGV to Marne-la-Vallée Chessy station."},
  "Kraków":{sys:[{n:"Tram",t:"Tram"},{n:"Bus",t:"Bus"}],map:"https://ztp.krakow.pl/en/kmk-public-transport/kmk-maps",pay:"Buy KMK tickets from street/onboard machines (coins and cards) or the Jakdojade app; contactless bank-card tap-in is being rolled out on trams. A 20-minute ticket costs about 4 PLN (~$1) and a 24-hour ticket about 20 PLN (~$5).",hours:"Trams and buses run about 5am-11pm, with a reduced night network continuing through the early morning.",note:""},
  "Heraklion":{sys:[{n:"Heraklion Urban Bus",t:"Bus"},{n:"KTEL Intercity Bus",t:"Bus"}],map:"https://astiko-irakleiou.gr/en/itineraries/",pay:"Buy paper tickets at kiosks/shops before boarding (cheaper) or from the driver onboard (pricier), or use the operator's app for e-tickets; KTEL intercity tickets (e.g. to Knossos) are bought separately at the bus station. A city ticket costs about €1.30 pre-purchased or €2.30 onboard (~$1.40-2.50).",hours:"City buses run roughly 6:30am-10:30pm; there is no night service.",note:"Heraklion relies on KTEL intercity coaches plus a separate urban bus network - no metro or tram."},
  "Johor Bahru":{sys:[{n:"Causeway Link Bus",t:"Bus"},{n:"BAS.MY City Bus",t:"Bus"}],map:"https://www.causewaylink.com.my/routes-schedules/",pay:"Tap a ManjaLink or Touch 'n Go card (sold at bus counters and convenience stores) or pay cash on board; some routes also accept contactless bank cards. Local BAS.MY routes are a flat RM1 (~$0.25), while other Causeway Link routes run RM1-4 (~$0.25-1).",hours:"Buses generally run 6am-11pm, with cross-border services to Singapore continuing into the early morning.",note:"The Johor Bahru-Singapore RTS Link rail line is still under construction, targeted for December 2026 - not running yet."},
  "Hanoi":{sys:[{n:"Hanoi Metro Line 2A",t:"Metro"},{n:"Hanoi Metro Line 3",t:"Metro"},{n:"City Bus",t:"Bus"}],map:"https://metrohanoi.vn/en/",pay:"Buy a paper ticket or reloadable smart card at station counters/machines, or use the MeGO virtual card in supported banking apps to tap in with a phone. Single rides cost about 8,000-15,000 VND depending on distance (~$0.30-0.60); a day pass is about 40,000 VND (~$1.60).",hours:"Trains run daily about 5:30am-10pm; there is no night service.",note:""},
  "Tel Aviv":{sys:[{n:"Red Line Light Rail",t:"Tram"},{n:"Bus",t:"Bus"},{n:"Israel Railways Train",t:"Train"}],map:"https://www.nta.co.il/en/light-rail/red-line/",pay:"Get a Rav-Kav smart card (an anonymous card costs 5 NIS, loaded at machines, kiosks or tourist info centers) or tap a contactless credit card/Apple Pay at the validators. A single ride (with a 90-minute transfer window) costs about 8 NIS (~$2.20).",hours:"Light rail and buses run roughly 5am-midnight; nearly all transit, including trains, pauses for Shabbat from Friday afternoon to Saturday evening, with limited free weekend bus lines filling the gap.",note:""},

/* Convert an amount from one currency to another via USD */
function convert(amount, from, to) {
  if (!RATES[from] || !RATES[to]) return null;
  return amount * (RATES[to] / RATES[from]);
}

/* Format a converted number sensibly (no decimals for big-unit currencies) */
function fmtMoney(x, code) {
  if (x === null || !isFinite(x)) return "—";
  const big = ["JPY","KRW","IDR","VND","HUF","CLP","ARS"].includes(code);
  if (big) return x.toLocaleString(undefined, {maximumFractionDigits:0});
  if (x !== 0 && Math.abs(x) < 0.01)  // tiny values: show real precision, not "0.00"
    return x.toLocaleString(undefined, {minimumFractionDigits:4, maximumFractionDigits:6});
  return x.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}

/* Format a USD price converted into another currency for the cost cards
   (symbol prefix + sensibly rounded amount) */
function fmtPrice(usd, code) {
  const v = convert(usd, "USD", code);
  if (v === null) return "$" + usd.toLocaleString();
  const sym = (CURRENCIES[code] && CURRENCIES[code].s) || (code + " ");
  const digits = Math.abs(v) < 10 ? 1 : 0;
  return sym + v.toLocaleString(undefined, {maximumFractionDigits: digits});
}

/* Same as fmtPrice but keeps 2 decimals under 10 — for small per-GB prices */
function fmtGB(usd, code) {
  const v = convert(usd, "USD", code);
  if (v === null) return "$" + usd.toFixed(2);
  const sym = (CURRENCIES[code] && CURRENCIES[code].s) || (code + " ");
  const digits = Math.abs(v) < 10 ? 2 : 0;
  return sym + v.toLocaleString(undefined, {minimumFractionDigits: digits, maximumFractionDigits: digits});
}

/* Parse a population string like "7.4M" / "680K" into an absolute number */
function parsePop(s) {
  const n = parseFloat(s);
  if (/M/i.test(s)) return n * 1e6;
  if (/K/i.test(s)) return n * 1e3;
  return n;
}

/* Colour for the tourist-to-local ratio: >30% red, 10–30% yellow, ≤10% green */
function ratioColor(p) {
  if (p > 30) return "#e55039";
  if (p > 10) return "#e0a800";
  return "#1d9a6c";
}

}
