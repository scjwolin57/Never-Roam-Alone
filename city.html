  .lmk-expand-row{display:flex;gap:12px;align-items:flex-start}
  .lmk-expand-num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--coral);color:#fff;
    font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .lmk-expand-name{font-weight:700;font-size:1.25rem;color:#2f3b22;text-decoration:none;display:inline-block;
    line-height:1.25;border-bottom:1px dotted var(--teal)}
  .lmk-expand-name:hover{color:var(--coral);border-bottom-color:var(--coral)}
  .lmk-expand-desc{margin:10px 0 0;font-size:.98rem;color:var(--muted,#555);line-height:1.55}
  /* Portrait photo: stands beside the text. The column is sized to the photo
     (auto), so the panel ends up exactly as wide and tall as its contents. */
  .lmk-expand.is-portrait{display:grid;align-items:stretch;grid-template-columns:auto minmax(200px,1fr)}
  .lmk-expand.is-portrait .lmk-expand-img{height:var(--lmk-photo-h,520px);width:auto;max-width:100%}
  .lmk-expand.is-portrait .lmk-expand-body{display:flex;flex-direction:column;justify-content:center;
    padding:20px 24px}
  /* Phone: too narrow to split, so stack -- but keep the photo at its own
     ratio rather than forcing a box, which would pillarbox tall shots again. */
  @media(max-width:560px){
    .lmk-expand.is-portrait{grid-template-columns:1fr}
    .lmk-expand.is-portrait .lmk-expand-photo{text-align:center}
    .lmk-expand.is-portrait .lmk-expand-img{height:auto;max-height:52vh;width:auto;max-width:100%;
      margin:0 auto}
    .lmk-expand.is-portrait .lmk-expand-body{justify-content:flex-start;padding:16px 18px 18px}}
  /* Landmarks with no photo yet: placeholder + an invitation to contribute one */
  /* Card placeholder: laid out rather than a cropped background image, so the
     icon, the wording and the Contribute button all stay visible in the
     130px-tall card strip, not only in the opened modal. */
  .lmk-photo-soon{background:linear-gradient(180deg,#efe9da,#e4dcc8);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px}
  .lmk-soon-ic{width:30px;height:23px;flex:none;fill:none;stroke:#b3a789;stroke-width:2.5;
    stroke-linecap:round;stroke-linejoin:round}
  .lmk-soon-txt{font-size:.76rem;color:#6d6350;line-height:1}
  .lmk-soon-btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:3px;
    padding:4px 12px;font:inherit;font-size:.74rem;cursor:pointer;line-height:1.2}
  .lmk-soon-btn:hover{background:var(--coral);border-color:var(--coral)}
  .lmk-expand-soon{position:relative}
  .lmk-contrib{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;text-align:center;
    background:linear-gradient(to top,rgba(255,255,255,.97) 62%,rgba(255,255,255,0))}
  .lmk-contrib-lead{margin:0 0 9px;font-size:.86rem;color:#5c5340;line-height:1.35}
  .lmk-contrib-btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:3px;
    padding:8px 16px;font:inherit;font-size:.9rem;cursor:pointer}
  .lmk-contrib-btn:hover{background:var(--coral);border-color:var(--coral)}
  /* Contribute-a-photo form */
  .cf-back{position:fixed;inset:0;z-index:210;background:rgba(43,36,23,.55);display:flex;
    align-items:flex-start;justify-content:center;padding:36px 16px;overflow:auto}
  .cf-box{background:var(--card,#fff);border-radius:4px;max-width:520px;width:100%;
    box-shadow:0 24px 60px rgba(43,36,23,.4);padding:22px 24px 24px;position:relative}
  .cf-box h3{margin:0 0 4px;font-size:1.15rem}
  .cf-sub{margin:0 0 16px;font-size:.85rem;color:var(--muted,#666)}
  .cf-close{position:absolute;top:10px;right:12px;border:none;background:none;font-size:1.5rem;
    line-height:1;cursor:pointer;color:#8a7f66}
  .cf-close:hover{color:var(--coral)}
  .cf-f{margin-bottom:14px}
  .cf-f label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}
  .cf-f input[type=text],.cf-f input[type=url],.cf-f select,.cf-f input[type=file]{
    width:100%;padding:8px 10px;border:1px solid #cfc7b4;border-radius:3px;font:inherit;font-size:.9rem;
    background:#fff}
  .cf-f input:disabled{background:#f2efe6;color:#8a7f66}
  .cf-row{display:flex;gap:10px}
  .cf-row>*{flex:1}
  .cf-opt{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:.88rem;font-weight:400}
  .cf-opt input{margin-top:3px;flex:none;width:auto}
  .cf-note{font-size:.78rem;color:var(--muted,#777);margin:4px 0 0}
  .cf-terms{display:flex;gap:9px;align-items:flex-start;font-size:.8rem;line-height:1.45;
    background:#f7f4ea;border:1px solid #e3dccb;border-radius:3px;padding:11px 12px;margin:4px 0 16px}
  .cf-terms input{margin-top:2px;flex:none}
  .cf-actions{display:flex;gap:10px;align-items:center}
  .cf-submit{background:var(--teal);color:#fff;border:1px solid var(--teal);border-radius:3px;
    padding:9px 18px;font:inherit;cursor:pointer}
  .cf-submit:hover:not(:disabled){background:var(--coral);border-color:var(--coral)}
  .cf-submit:disabled{opacity:.55;cursor:default}
  .cf-cancel{background:none;border:1px solid #cfc7b4;border-radius:3px;padding:9px 15px;font:inherit;cursor:pointer}
  .cf-msg{font-size:.85rem;margin-left:2px}
  .cf-msg.err{color:#a8320f}
  .cf-msg.ok{color:#2b6b6b}
  @media(max-width:560px){.cf-back{padding:12px}.cf-row{flex-direction:column;gap:0}}
  /* Pin tap -> card jumps to the top of the list (mobile) */
  .lmk-card.is-lifted{border-color:var(--coral);box-shadow:0 10px 26px rgba(192,64,32,.26);animation:lmkPop .45s ease}
  @keyframes lmkPop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
  @media(max-width:860px){
    .lmk-big{display:none!important}
    .lmk-layout{grid-template-columns:1fr}
    .lmk-map-col{position:static}
    .lmk-map{height:340px}
  }
  @media(max-width:560px){.lmk-grid{grid-template-columns:1fr}}
  /* Phones: landmark cards and each day-trip list scroll sideways one card at a time, with the arrow
     bar from initSwipeHint() under them, like the neighborhoods (Jeff, 2026-09-24). The side padding
     keeps the cards' border and shadow from being clipped by the scrolling row. */
  @media(max-width:640px){
    .lmk-grid,.daytrip-grid{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
      scrollbar-width:none;padding:4px 4px 14px;margin:0 -4px}
    .lmk-grid::-webkit-scrollbar,.daytrip-grid::-webkit-scrollbar{display:none}
    .lmk-grid>*,.daytrip-grid>*{flex:0 0 100%;min-width:0;scroll-snap-align:center}
    .daytrip-grid>.dtcard{box-shadow:0 5px 9px -4px rgba(43,36,23,.28)}   /* a shadow short enough to fit the row's padding, not cut off by it */
    .lmk-grid+.swipe-hint,.daytrip-grid+.swipe-hint{margin-top:2px}
    .lmk-grid.is-muted+.swipe-hint{visibility:hidden}   /* an opened landmark covers the row; its arrows wait until it closes */
  }
  .adv-line{margin-top:6px}
  .adv-link{text-decoration:none;border-bottom:1px dotted currentColor}
  .adv-date{font-size:.75rem;color:var(--muted,#888)}
  .adv-banner{max-width:var(--maxw);margin:14px auto 0;padding:12px 22px;font-size:.9rem;
    display:flex;align-items:flex-start;gap:8px;border-radius:3px}
  .adv-banner .adv-link{color:inherit}
  .adv-banner .adv-date{color:inherit;opacity:.75}
  .adv-banner-ic{flex:none}
  .adv-banner-lvl3{background:#FCEFC7;color:#7a5b00;border:1px solid #E8C766}
  .adv-banner-lvl4{background:#F6D5CE;color:#8B2500;border:1px solid #E29A87}
  @media(max-width:640px){.adv-banner{padding:12px 14px}}
</style>

<script>
/* Perf: the three big data files (hood photos ~700 KB, holidays ~180 KB,
   phrases ~100 KB) used to be plain <script> tags. Each one blocked the page
   until it had downloaded and run, so the city's own data file could not even
   START downloading until about 1.3 MB had arrived. Now they download in the
   background, side by side with the city data, and the render below waits for
   them (NRA_DATA_READY) before drawing the guide, exactly as before: every
   section still has its data when it is drawn. A file that fails to load
   resolves anyway, so it can never hold the guide back. */
/* 2026-10-24 (backlog 27): five more data files moved here from plain <script>
   tags (app-store links ~16 KB, eSIM providers ~25 KB, rental notes ~23 KB,
   driving permits ~74 KB, advisories ~157 KB). Nothing reads them before the
   guide is drawn, and the draw waits for this list, so they behave as before. */
window.NRA_DATA_READY = ["hood-photos.js", "city-phrases.js", "city-holidays.js",
  "app-store-links.js", "esim-providers.js", "rental-notes.js",
  "driving-permits.js", "advisories.js"].map(function (src) {
  return new Promise(function (resolve) {
    var s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = s.onerror = function () { resolve(); };
    document.head.appendChild(s);
  });
});
</script>

<script>
/* Perf: start downloading the hero photo NOW, in parallel with the city's
   data files — it's the page's largest visible element (LCP), and without
   this it could only begin downloading after the data had arrived. */
(function(){
  try {
    var want = (new URLSearchParams(location.search).get("city") || "").toLowerCase();
    if (!want || !window.NRA_CITY_PHOTO) return;
    var key = Object.keys(NRA_CITY_PHOTO).find(function(k){ return k.toLowerCase() === want; });
    var rec = key && NRA_CITY_PHOTO[key];
    if (!rec || !rec.img) return;
    var l = document.createElement("link");
    l.rel = "preload"; l.as = "image"; l.href = rec.img;
    document.head.appendChild(l);
  } catch (e) { /* purely an optimization — never break the page */ }
})();
</script>

<script>
(function(){
  /* The hero favorite button is injected asynchronously by loadCityData().then(...),
     which may finish after this script has already run. Use delegation + a live
     lookup on every call instead of grabbing the button once at script-load time,
     so the handler works no matter when the button appears. */
  function getBtn(){ return document.getElementById("hero-fav-btn"); }
  function paintHeroFav(){
    var btn = getBtn();
    if (!btn) return;
    var active = NRA_FAV.has(btn.dataset.favCity);
    btn.classList.toggle("active", active);
    btn.innerHTML = "<span class=\"hero-fav-icon\">" + (active ? "&#9829;" : "&#9825;") + "</span><span class=\"hero-fav-label\">" + (active ? "Favorited" : "Favorite") + "</span>";
    btn.title = active ? "Remove from Favorites" : "Save to Favorites";
  }
  document.addEventListener("click", function(e){
    var btn = e.target.closest && e.target.closest("#hero-fav-btn");
    if (!btn) return;
    btn.disabled = true;
    NRA_FAV.toggle(btn.dataset.favCity, btn.dataset.favCountry)
      .then(paintHeroFav)
      .finally(function(){ btn.disabled = false; });
  });
  NRA_FAV.onChange(paintHeroFav);
  NRA_FAV.ready().then(paintHeroFav);

  /* Per-city favorite count, from the public city_favorite_counts view
     (favorites-setup.sql). Signed-in favorites only, see that file's
     comment — same count refreshes after a toggle so it moves live. */
  function paintFavCount(){
    var el = document.getElementById("hero-fav-count");
    var btn = getBtn();
    if (!el || !btn || !window.NRA_AUTH || !NRA_AUTH.enabled) return;
    NRA_AUTH.ready().then(function(){
      var sb = NRA_AUTH.client();
      if (!sb) return;
      return sb.from("city_favorite_counts").select("favorites").eq("city", btn.dataset.favCity).maybeSingle();
    }).then(function(res){
      var n = res && res.data && res.data.favorites || 0;
      /* "FAVORITED 3 TIMES", "FAVORITED 1 TIME" (Jeff, 2026-09-23); nothing at zero */
      el.textContent = n > 0 ? "FAVORITED " + n.toLocaleString() + " TIME" + (n === 1 ? "" : "S") : "";
    }).catch(function(){});
  }
  NRA_FAV.onChange(paintFavCount);
  NRA_FAV.ready().then(function(){
    /* The hero button (and #hero-fav-count) may not be in the DOM yet at
       this point, same race as paintHeroFav above — but that one gets
       away with it because its default markup already looks right with
       no paint. This one has nothing to show until it runs, so wait for
       the button via the same MutationObserver pattern the landmark
       list uses (~line 4088) instead of silently no-op'ing once. */
    if (getBtn()) { paintFavCount(); return; }
    var contentEl = document.getElementById("content");
    if (!contentEl) return;
    var mo = new MutationObserver(function(){
      if (getBtn()) { mo.disconnect(); paintFavCount(); }
    });
    mo.observe(contentEl, { childList: true, subtree: true });
  });
})();
</script>

<script>
(function(){
  /* Vote widgets (thumbs up/down) are injected the same way the hero
     favorite button is, asynchronously by loadCityData().then(...), so
     wait for at least one to exist before mounting — same pattern as
     paintFavCount above. */
  function mountVotes(){
    if (document.querySelector(".vote-widget[data-vote-type]")) { NRA_VOTES.mountAll(); return; }
    var contentEl = document.getElementById("content");
    if (!contentEl) return;
    var mo = new MutationObserver(function(){
      if (document.querySelector(".vote-widget[data-vote-type]")) { mo.disconnect(); NRA_VOTES.mountAll(); }
    });
    mo.observe(contentEl, { childList: true, subtree: true });
  }
  mountVotes();
})();
</script>
