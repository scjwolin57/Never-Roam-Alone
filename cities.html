<style>
  :root{

    --coral:#ef6f53;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  /* Nav */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#c35237}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}
  nav.links a.active{color:var(--green);border-color:var(--coral)}

  /* Page header */
  .page-hero{background:var(--green);color:#fff;padding:64px 22px 52px;text-align:center}
  .page-hero .kicker{font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(255,255,255,.65);margin-bottom:14px}
  .page-hero h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 14px;line-height:1.05}
  .page-hero p{font-family:Georgia,serif;font-style:italic;font-size:1.18rem;
    color:rgba(255,255,255,.82);max-width:560px;margin:0 auto}

  /* Search / filter bar */
  .filter-bar{max-width:var(--maxw);margin:36px auto 0;padding:0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:220px}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  #city-search{width:100%;padding:12px 16px 12px 42px;font-size:.97rem;font-family:inherit;
    border:2px solid rgba(24,94,63,.2);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .2s}
  #city-search:focus{outline:none;border-color:var(--green)}
  #city-sort{padding:12px 38px 12px 16px;font-size:.92rem;font-family:inherit;font-weight:600;
    border:2px solid rgba(24,94,63,.2);border-radius:12px;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%235b6b75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 12px center;
    background-size:15px;color:var(--ink);transition:border-color .2s;appearance:none;-webkit-appearance:none;cursor:pointer}
  #city-sort:focus{outline:none;border-color:var(--green)}
  .count-badge{font-size:.85rem;color:var(--muted);white-space:nowrap}

  /* Grid */
  .grid-wrap{max-width:var(--maxw);margin:28px auto 64px;padding:0 22px}
  .city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}

  /* City card */
  .city-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
  .city-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(20,40,50,.18)}
  .city-card .photo{height:200px;background-size:cover;background-position:center;position:relative}
  .city-card .visitors-chip{position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.48);backdrop-filter:blur(4px);color:#fff;
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;display:flex;align-items:baseline;gap:5px}
  .city-card .visitors-chip b{font-size:.92rem}
  .city-card .body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
  .city-card .country-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.12em;color:var(--teal);margin-bottom:6px}
  .city-card h3{font-size:1.35rem;margin:0 0 8px;line-height:1.2}
  .city-card .tagline{font-family:Georgia,serif;font-style:italic;font-size:.92rem;
    color:var(--muted);margin:0;flex:1}
  .city-card .explore-btn{display:inline-flex;align-items:center;gap:7px;margin-top:18px;
    align-self:flex-start;background:var(--green);color:#fff;font-weight:700;font-size:.85rem;
    padding:10px 20px;border-radius:30px;transition:background .2s}
  .city-card .explore-btn:hover{background:var(--teal)}
  .city-card .explore-btn svg{flex-shrink:0}

  /* No results */
  .no-results{display:none;text-align:center;padding:60px 22px;color:var(--muted);font-size:1.1rem;grid-column:1/-1}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:0}
  footer .brand{justify-content:center;color:#c35237}
  footer .foot-links{margin-top:14px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  footer .foot-links a{color:#dfeee7;font-size:.85rem;font-weight:600;opacity:.9;border-bottom:1px solid transparent}
  footer .foot-links a:hover{color:#fff;border-color:var(--coral);opacity:1}

  @media(max-width:860px){.city-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){
    nav.links{display:none}
    .city-grid{grid-template-columns:1fr}
  }
</style>
</head>

];

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function buildCards(list) {
  const grid = document.getElementById("city-grid");
  const noResults = document.getElementById("no-results");
  // Remove existing cards (keep no-results placeholder)
  grid.querySelectorAll(".city-card").forEach(el => el.remove());

  if (list.length === 0) {
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  list.forEach(c => {
    const sg = slug(c.city);
    const num = Number(c.visitors).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
    const card = document.createElement("a");
    card.className = "city-card";
    card.href = `city.html?city=${encodeURIComponent(c.city)}&from=guides`;
    card.innerHTML = `
      <div class="photo" style="background-image:url('https://picsum.photos/seed/${sg}-hero/600/400')">
        <div class="visitors-chip"><b>${c.est?'~':''}${num}M</b> visitors/yr</div>
      </div>
      <div class="body">
        <div class="country-label">${c.country}</div>
        <h3>${c.city}</h3>
        <p class="tagline">${c.tagline}</p>
        <span class="explore-btn">
          Explore
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
      </div>`;
    grid.appendChild(card);
  });

  document.getElementById("count-label").textContent =
    list.length === CITIES.length ? `${CITIES.length} destinations` : `${list.length} of ${CITIES.length} destinations`;
}

function dailyCost(c) { return c.cost.hotel + c.cost.meal + c.cost.taxi; }

function sortList(list, mode) {
  const sorted = list.slice();
  switch (mode) {
    case "az": sorted.sort((a, b) => a.city.localeCompare(b.city)); break;
    case "za": sorted.sort((a, b) => b.city.localeCompare(a.city)); break;
    case "visited": sorted.sort((a, b) => b.visitors - a.visitors); break;
    case "cheap": sorted.sort((a, b) => dailyCost(a) - dailyCost(b)); break;
    case "lux": sorted.sort((a, b) => dailyCost(b) - dailyCost(a)); break;
  }
  return sorted;
}

function applyFilters() {
  const q = document.getElementById("city-search").value.trim().toLowerCase();
  const mode = document.getElementById("city-sort").value;
  let list = CITIES;
  if (q) {
    list = CITIES.filter(c =>
      c.city.toLowerCase().includes(q) ||
      c.country.toLowerCase().includes(q) ||
      c.tagline.toLowerCase().includes(q)
    );
  }
  buildCards(sortList(list, mode));
}

// Initial render
applyFilters();

// Live search + sort
document.getElementById("city-search").addEventListener("input", applyFilters);
document.getElementById("city-sort").addEventListener("change", applyFilters);
</script>
