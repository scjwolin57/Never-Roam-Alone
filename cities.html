<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>City Guides — Never Roam Alone</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1d2a32;--muted:#5b6b75;--sand:#f6f1e7;--green:#185e3f;--teal:#0e7c86;
    --coral:#ef6f53;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--sand);line-height:1.65}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  /* Nav */
  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#e97451}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}
  nav.links a.active{color:var(--green);border-color:var(--coral)}

  /* Page header */
  .page-hero{background:var(--green);color:#fff;padding:64px 22px 52px;text-align:center}
  .page-hero .kicker{font-size:.75rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(255,255,255,.65);margin-bottom:14px}
  .page-hero h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0 0 14px;line-height:1.05}
  .page-hero p{font-family:Georgia,serif;font-style:italic;font-size:1.18rem;
    color:rgba(255,255,255,.82);max-width:560px;margin:0 auto}

  /* Search / filter bar */
  .filter-bar{max-width:var(--maxw);margin:36px auto 0;padding:0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .search-wrap{position:relative;flex:1;min-width:220px}
  .search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  #city-search{width:100%;padding:12px 16px 12px 42px;font-size:.97rem;font-family:inherit;
    border:2px solid rgba(24,94,63,.2);border-radius:12px;background:#fff;color:var(--ink);transition:border-color .2s}
  #city-search:focus{outline:none;border-color:var(--green)}
  #city-sort{padding:12px 38px 12px 16px;font-size:.92rem;font-family:inherit;font-weight:600;
    border:2px solid rgba(24,94,63,.2);border-radius:12px;background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%235b6b75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 12px center;
    background-size:15px;color:var(--ink);transition:border-color .2s;appearance:none;-webkit-appearance:none;cursor:pointer}
  #city-sort:focus{outline:none;border-color:var(--green)}
  .count-badge{font-size:.85rem;color:var(--muted);white-space:nowrap}

  /* Grid */
  .grid-wrap{max-width:var(--maxw);margin:28px auto 64px;padding:0 22px}
  .city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}

  /* City card */
  .city-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
  .city-card:hover{transform:translateY(-6px);box-shadow:0 20px 48px rgba(20,40,50,.18)}
  .city-card .photo{height:200px;background-size:cover;background-position:center;position:relative}
  .city-card .visitors-chip{position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.48);backdrop-filter:blur(4px);color:#fff;
    font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 11px;border-radius:20px;display:flex;align-items:baseline;gap:5px}
  .city-card .visitors-chip b{font-size:.92rem}
  .city-card .body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
  .city-card .country-label{font-size:.72rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.12em;color:var(--teal);margin-bottom:6px}
  .city-card h3{font-size:1.35rem;margin:0 0 8px;line-height:1.2}
  .city-card .tagline{font-family:Georgia,serif;font-style:italic;font-size:.92rem;
    color:var(--muted);margin:0;flex:1}
  .city-card .explore-btn{display:inline-flex;align-items:center;gap:7px;margin-top:18px;
    align-self:flex-start;background:var(--green);color:#fff;font-weight:700;font-size:.85rem;
    padding:10px 20px;border-radius:30px;transition:background .2s}
  .city-card .explore-btn:hover{background:var(--teal)}
  .city-card .explore-btn svg{flex-shrink:0}

  /* No results */
  .no-results{display:none;text-align:center;padding:60px 22px;color:var(--muted);font-size:1.1rem;grid-column:1/-1}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:0}
  footer .brand{justify-content:center;color:#e97451}
  footer .foot-links{margin-top:14px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  footer .foot-links a{color:#dfeee7;font-size:.85rem;font-weight:600;opacity:.9;border-bottom:1px solid transparent}
  footer .foot-links a:hover{color:#fff;border-color:var(--coral);opacity:1}

  @media(max-width:860px){.city-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:540px){
    nav.links{display:none}
    .city-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <svg class="logo" viewBox="0 0 120 120" width="44" height="44" aria-label="Never Roam Alone logo" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#185e3f" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="60" cy="60" r="53"/>
          <polyline points="26,63 44,34 54,47 67,28 79,45 94,63"/>
          <path d="M22,86 Q60,74 98,86"/>
        </g>
        <g fill="#185e3f">
          <circle cx="50" cy="62" r="5.2"/>
          <path d="M43.4,72.5 Q43.4,69 47,69 L53,69 Q56.6,69 56.6,72.5 L55,84 L51.2,84 L50.3,76 L49.7,76 L48.8,84 L45,84 Z"/>
          <circle cx="70" cy="62" r="5.2"/>
          <path d="M63.4,72.5 Q63.4,69 67,69 L73,69 Q76.6,69 76.6,72.5 L75,84 L71.2,84 L70.3,76 L69.7,76 L68.8,84 L65,84 Z"/>
          <path d="M58.4,84 C56,90 63,93 60.5,98 C58.6,101.8 53,103 50,106 L70,106 C66.5,103 62.8,101.5 64.2,97.5 C65.4,93.5 63,90 61.6,84 Z"/>
        </g>
      </svg>
      <span>Never Roam Alone<small>Your Travel Companion</small></span>
    </a>
    <nav class="links" data-site-nav></nav>
  </div>
</header>

<div class="page-hero">
  <div class="kicker">Explore the world</div>
  <h1>City Guides</h1>
  <p>Dive into the world's most-visited cities — practical details, local flavor, and stories from the road.</p>
</div>

<div class="filter-bar">
  <div class="search-wrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="city-search" type="search" placeholder="Search cities or countries…" autocomplete="off" />
  </div>
  <select id="city-sort" aria-label="Sort cities">
    <option value="az">A → Z</option>
    <option value="za">Z → A</option>
    <option value="visited">Most Visited</option>
    <option value="cheap">Least Expensive</option>
    <option value="lux">Most Expensive</option>
  </select>
  <span class="count-badge" id="count-label"></span>
</div>

<div class="grid-wrap">
  <div class="city-grid" id="city-grid">
    <p class="no-results" id="no-results">No cities match your search.</p>
  </div>
</div>

<footer>
  <div class="brand" style="font-size:1.6rem"><span>Never Roam Alone</span></div>
  <div class="foot-links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
</footer>

<script>
const CITIES = [
  {city:"Hong Kong",country:"China (SAR)",visitors:26.7,tagline:"Neon harbor nights and dim-sum mornings.",cost:{hotel:150,meal:25,taxi:13}},
  {city:"Bangkok",country:"Thailand",visitors:22.8,tagline:"Temples, tuk-tuks, and street food that never sleeps.",cost:{hotel:45,meal:8,taxi:5}},
  {city:"London",country:"United Kingdom",visitors:19.6,tagline:"Centuries of history around every rainy corner.",cost:{hotel:165,meal:30,taxi:25}},
  {city:"Macau",country:"China (SAR)",visitors:20.6,tagline:"Portuguese colonial charm beneath dazzling lights.",cost:{hotel:130,meal:22,taxi:10}},
  {city:"Singapore",country:"Singapore",visitors:19.8,tagline:"A garden city where every cuisine has a home.",cost:{hotel:140,meal:22,taxi:10}},
  {city:"Paris",country:"France",visitors:19.1,tagline:"Boulevards, cafés, and light that earns its name.",cost:{hotel:150,meal:28,taxi:20}},
  {city:"Dubai",country:"UAE",visitors:17.5,tagline:"Desert futurism reaching for the sky.",cost:{hotel:120,meal:25,taxi:8}},
  {city:"New York",country:"United States",visitors:13.6,tagline:"Eight million stories on one electric grid.",cost:{hotel:250,meal:35,taxi:25}},
  {city:"Kuala Lumpur",country:"Malaysia",visitors:14.0,tagline:"Twin towers above a rainforest of cultures.",cost:{hotel:50,meal:8,taxi:5}},
  {city:"Istanbul",country:"Türkiye",visitors:13.4,tagline:"Where two continents share a single skyline.",cost:{hotel:60,meal:12,taxi:7}},
  {city:"Tokyo",country:"Japan",visitors:12.9,tagline:"Ancient ritual and neon future, side by side.",cost:{hotel:110,meal:15,taxi:25}},
  {city:"Antalya",country:"Türkiye",visitors:12.4,tagline:"A turquoise coast beneath ancient ruins.",cost:{hotel:55,meal:12,taxi:7}},
  {city:"Seoul",country:"South Korea",visitors:11.3,tagline:"Palaces, pop, and midnight markets.",cost:{hotel:90,meal:12,taxi:10}},
  {city:"Osaka",country:"Japan",visitors:10.1,tagline:"Japan's kitchen, loud and proud.",cost:{hotel:90,meal:14,taxi:22}},
  {city:"Rome",country:"Italy",visitors:10.1,tagline:"An open-air museum you can eat your way through.",cost:{hotel:120,meal:25,taxi:18}},
  {city:"Phuket",country:"Thailand",visitors:9.9,tagline:"Limestone islands and warm Andaman tides.",cost:{hotel:55,meal:10,taxi:12}},
  {city:"Barcelona",country:"Spain",visitors:9.1,tagline:"Gaudí's dreams beside the Mediterranean.",cost:{hotel:120,meal:22,taxi:15}},
  {city:"Amsterdam",country:"Netherlands",visitors:9.0,tagline:"Canals, bicycles, and golden-age light.",cost:{hotel:160,meal:28,taxi:25}},
  {city:"Milan",country:"Italy",visitors:8.8,tagline:"Fashion, fresco, and effortless style.",cost:{hotel:130,meal:25,taxi:18}},
  {city:"Vienna",country:"Austria",visitors:7.9,tagline:"Coffee houses and concert halls of old Europe.",cost:{hotel:120,meal:22,taxi:18}},
  {city:"Prague",country:"Czechia",visitors:8.0,tagline:"A fairy-tale city of spires and bridges.",cost:{hotel:90,meal:15,taxi:12}},
  {city:"Los Angeles",country:"United States",visitors:7.5,tagline:"Sunshine, screens, and endless coastline.",cost:{hotel:200,meal:30,taxi:25}},
  {city:"Sydney",country:"Australia",visitors:4.0,tagline:"Harbor sails and beaches within the city.",cost:{hotel:150,meal:28,taxi:22}},
  {city:"Cape Town",country:"South Africa",visitors:1.7,tagline:"Where a flat-topped mountain meets two oceans.",cost:{hotel:90,meal:15,taxi:12}},
  {city:"Rio de Janeiro",country:"Brazil",visitors:2.3,tagline:"Mountains, beaches, and rhythm in the air.",cost:{hotel:80,meal:15,taxi:10}},
  {city:"Cancún",country:"Mexico",visitors:6.1,tagline:"Caribbean blue with Maya ruins next door.",cost:{hotel:120,meal:20,taxi:12}},
  {city:"Marrakech",country:"Morocco",visitors:3.0,tagline:"A maze of souks, spice, and rooftop sunsets.",cost:{hotel:70,meal:12,taxi:6}}
];

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

function buildCards(list) {
  const grid = document.getElementById("city-grid");
  const noResults = document.getElementById("no-results");
  // Remove existing cards (keep no-results placeholder)
  grid.querySelectorAll(".city-card").forEach(el => el.remove());

  if (list.length === 0) {
    noResults.style.display = "block";
    return;
  }
  noResults.style.display = "none";

  list.forEach(c => {
    const sg = slug(c.city);
    const num = Number(c.visitors).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
    const card = document.createElement("a");
    card.className = "city-card";
    card.href = `city.html?city=${encodeURIComponent(c.city)}&from=guides`;
    card.innerHTML = `
      <div class="photo" style="background-image:url('https://picsum.photos/seed/${sg}-hero/600/400')">
        <div class="visitors-chip"><b>${num}M</b> visitors/yr</div>
      </div>
      <div class="body">
        <div class="country-label">${c.country}</div>
        <h3>${c.city}</h3>
        <p class="tagline">${c.tagline}</p>
        <span class="explore-btn">
          Explore
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
      </div>`;
    grid.appendChild(card);
  });

  document.getElementById("count-label").textContent =
    list.length === CITIES.length ? `${CITIES.length} destinations` : `${list.length} of ${CITIES.length} destinations`;
}

function dailyCost(c) { return c.cost.hotel + c.cost.meal + c.cost.taxi; }

function sortList(list, mode) {
  const sorted = list.slice();
  switch (mode) {
    case "az": sorted.sort((a, b) => a.city.localeCompare(b.city)); break;
    case "za": sorted.sort((a, b) => b.city.localeCompare(a.city)); break;
    case "visited": sorted.sort((a, b) => b.visitors - a.visitors); break;
    case "cheap": sorted.sort((a, b) => dailyCost(a) - dailyCost(b)); break;
    case "lux": sorted.sort((a, b) => dailyCost(b) - dailyCost(a)); break;
  }
  return sorted;
}

function applyFilters() {
  const q = document.getElementById("city-search").value.trim().toLowerCase();
  const mode = document.getElementById("city-sort").value;
  let list = CITIES;
  if (q) {
    list = CITIES.filter(c =>
      c.city.toLowerCase().includes(q) ||
      c.country.toLowerCase().includes(q) ||
      c.tagline.toLowerCase().includes(q)
    );
  }
  buildCards(sortList(list, mode));
}

// Initial render
applyFilters();

// Live search + sort
document.getElementById("city-search").addEventListener("input", applyFilters);
document.getElementById("city-sort").addEventListener("change", applyFilters);
</script>
<script src="nav.js"></script>
<script src="i18n.js"></script>
</body>
</html>
