 .frame{width:228px;height:152px;background:#e7e0d2;display:flex;align-items:center;

 .frame img{max-width:100%;max-height:100%;display:block}
 .meta{font-size:.72rem;color:var(--muted);margin-top:5px;line-height:1.35;word-break:break-word}
 .meta a{color:var(--teal)}
 .tag{font-size:.68rem;color:#8a2b12}
 .acts{margin-top:8px;display:flex;gap:8px}
 .none{color:var(--muted);font-style:italic;padding:8px 0}

const KEY = "nra-lmk-review-stock";
let dec = {};
try { dec = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { dec = {}; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(dec)); }catch(e){} tally(); }
function tally(){
  const v = Object.values(dec);
  document.getElementById("n-done").textContent = v.length;
  document.getElementById("n-tot").textContent = DATA.length;
  document.getElementById("n-swap").textContent = v.filter(x=>x.action==="swap").length;
  document.getElementById("n-keep").textContent = v.filter(x=>x.action==="keep").length;
  document.getElementById("n-skip").textContent = v.filter(x=>x.action==="skip").length;
  DATA.forEach(d=>{
    const el = document.getElementById("lm-"+d.key);  // raw id, not CSS-escaped
    if(!el) return;
    const dd = dec[d.key];
    el.classList.toggle("decided", !!dd && dd.action!=="skip");
    el.classList.toggle("skipped", !!dd && dd.action==="skip");
    el.querySelectorAll(".tile").forEach(t=>{
      t.classList.toggle("sel", !!dd && dd.action==="swap" && t.dataset.file===dd.file);
    });
  });
}
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

document.getElementById("main").innerHTML = DATA.map(d=>`
 <div class="lm" id="lm-${esc(d.key)}">
  <div class="lm-head">
    <span class="lm-name">${esc(d.name)}</span>
    <span class="lm-city">${esc(d.city)} &middot; #${d.idx+1}</span>
    <span class="lm-badge">current ${d.w}&times;${d.h} &middot; ratio ${d.ratio}</span>
  </div>
  <div class="strip">
    <div class="tile cur">
      <div class="frame"><img src="../${esc(d.img)}" loading="lazy" alt=""></div>
      <div class="meta"><b>CURRENT</b><br>${esc(d.img.split("/").pop())}</div>
    </div>
    ${d.cands.length ? d.cands.map(c=>`
      <div class="tile" data-key="${esc(d.key)}" data-file="${esc(c.file)}">
        <div class="frame"><img src="${esc(c.thumb)}" loading="lazy" alt=""></div>
        <div class="meta">${c.w}&times;${c.h} &middot; r${c.ratio}${c.detail?' <span class="tag">loose match?</span>':""}<br>
          ${esc(c.title)}<br>
          <a href="${esc(c.page)}" target="_blank" rel="noopener">Source page</a></div>
      </div>`).join("") : `<div class="none">No landscape stock photo found &mdash; needs a manual source.</div>`}
  </div>
  <div class="acts">
    <button data-act="keep" data-key="${esc(d.key)}">Keep current</button>
    <button data-act="skip" data-key="${esc(d.key)}">Skip</button>
  </div>
 </div>`).join("");

document.addEventListener("click", e=>{
  const tile = e.target.closest(".tile[data-file]");
  if (tile){
    const k = tile.dataset.key;
    if (dec[k] && dec[k].action==="swap" && dec[k].file===tile.dataset.file) delete dec[k];
    else dec[k] = {action:"swap", file:tile.dataset.file};
    save(); return;
  }
  const b = e.target.closest("button[data-act]");
  if (b){
    const k = b.dataset.key;
    if (dec[k] && dec[k].action===b.dataset.act) delete dec[k];
    else dec[k] = {action:b.dataset.act};
    save();
  }
});
document.getElementById("btn-accept").onclick = ()=>{
  DATA.forEach(d=>{ if(d.cands.length && !dec[d.key]) dec[d.key]={action:"swap", file:d.cands[0].title}; });
  save();
};
document.getElementById("btn-clear").onclick = ()=>{ if(confirm("Clear all decisions?")){ dec={}; save(); } };
document.getElementById("btn-export").onclick = ()=>{
  const out = DATA.filter(d=>dec[d.key]).map(d=>Object.assign({city:d.city, idx:d.idx, name:d.name}, dec[d.key]));
  document.getElementById("out-json").value = JSON.stringify(out, null, 1);
  document.getElementById("out").style.display = "block";
  document.getElementById("out-json").select();
};
document.getElementById("out-close").onclick = ()=>{ document.getElementById("out").style.display="none"; };
tally();
</script>
