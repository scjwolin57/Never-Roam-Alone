<style>
 :root{--teal:#2b6b6b;--coral:#c04020;--ink:#2f3b22;--muted:#666;--bg:#f3efe4}
 *{box-sizing:border-box}
 body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      background:var(--bg);color:var(--ink)}
 header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;
        padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
        box-shadow:0 2px 10px rgba(0,0,0,.06)}
 h1{font-size:1.05rem;margin:0}
 .count{font-size:.9rem;color:var(--muted)}
 .count b{color:var(--teal)}
 button{font:inherit;padding:7px 13px;border-radius:4px;border:1px solid #ccc;background:#fff;
        cursor:pointer}
 button.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
 button:hover{border-color:var(--coral);color:var(--coral)}
 button.primary:hover{color:#fff;background:var(--coral);border-color:var(--coral)}
 main{padding:18px 20px 120px;max-width:1500px;margin:0 auto}
 .lm{background:#fff;border:1px solid #e0dccf;border-radius:5px;margin-bottom:18px;padding:14px 16px}
 .lm.decided{border-color:var(--teal);box-shadow:0 0 0 2px rgba(43,107,107,.15)}
 .lm.skipped{opacity:.5}
 .lm-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
 .lm-name{font-weight:700;font-size:1.05rem}
 .lm-city{color:var(--muted);font-size:.85rem}
 .lm-badge{font-size:.72rem;background:#fdecea;color:#8a2b12;padding:2px 7px;border-radius:10px}
 .strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
 .tile{flex:0 0 auto;width:240px;border:2px solid transparent;border-radius:4px;padding:5px;
       background:#faf8f2;cursor:pointer}
 .tile.cur{cursor:default;background:#f0ece0;border-color:#ccc}
 .tile.sel{border-color:var(--coral);background:#fff4f0}
 .frame{width:228px;height:152px;background:#e7e0d2;display:flex;align-items:center;
        justify-content:center;overflow:hidden;border-radius:3px}
 .frame img{max-width:100%;max-height:100%;display:block}
 .meta{font-size:.72rem;color:var(--muted);margin-top:5px;line-height:1.35;word-break:break-word}
 .meta a{color:var(--teal)}
 .tag{font-size:.68rem;color:#8a2b12}
 .acts{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
 .own{margin-top:9px;padding:10px 12px;background:#faf8f2;border:1px dashed #c9c2ad;border-radius:4px}
 .own[hidden]{display:none}
 .own-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 .own input,.own select{font:inherit;padding:6px 9px;border:1px solid #ccc;border-radius:4px;background:#fff}
 .own .own-url{flex:1 1 320px;min-width:200px}
 .own .own-credit{flex:0 1 220px}
 .own-hint{font-size:.74rem;color:var(--muted);margin:6px 0 0}
 .own-preview{margin-top:9px;display:flex;gap:10px;align-items:flex-start}
 .own-preview img{max-width:230px;max-height:150px;border-radius:3px;display:block}
 .own-preview .ok{font-size:.76rem;color:#1f6b3a}
 .own-preview .bad{font-size:.76rem;color:#8a2b12}
 .lm.custom{border-color:#7a5cc0;box-shadow:0 0 0 2px rgba(122,92,192,.18)}
 .none{color:var(--muted);font-style:italic;padding:8px 0}
 #out{position:fixed;inset:auto 0 0 0;background:#fff;border-top:2px solid var(--teal);
      padding:12px 20px;max-height:45vh;overflow:auto;display:none}
 #out textarea{width:100%;height:26vh;font:12px/1.4 ui-monospace,Menlo,monospace}
</style>

</header>

 "h": 1600, "ratio": 0.562, "cands": []}, {"key": "puerto-plata|1", "city": "puerto-plata", "idx": 1, "name": "Pico Isabel de Torres and Christ the Redeemer", "img": "images/landmarks/plata-pico-isabel-cristo.webp", "w": 540, "h": 960, "ratio": 0.562, "cands": []}];
const KEY = "nra-lmk-review-web";
const META = {}; DATA.forEach(d=>META[d.key]={city:d.city, idx:d.idx, name:d.name});
let dec = {};
try { dec = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { dec = {}; }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(dec)); }catch(e){} tally(); }
function tally(){
  const v = Object.values(dec);
  document.getElementById("n-done").textContent = v.length;
  document.getElementById("n-tot").textContent = DATA.length;
  document.getElementById("n-swap").textContent = v.filter(x=>x.action==="swap").length;
  document.getElementById("n-keep").textContent = v.filter(x=>x.action==="keep").length;
  document.getElementById("n-skip").textContent = v.filter(x=>x.action==="skip").length;
  DATA.forEach(d=>{
    const el = document.getElementById("lm-"+d.key);  // raw id, not CSS-escaped
    if(!el) return;
    const dd = dec[d.key];
    el.classList.toggle("decided", !!dd && dd.action!=="skip" && dd.action!=="custom");
    el.classList.toggle("skipped", !!dd && dd.action==="skip");
    el.classList.toggle("custom", !!dd && dd.action==="custom");
    el.querySelectorAll(".tile").forEach(t=>{
      t.classList.toggle("sel", !!dd && dd.action==="swap" && t.dataset.file===dd.file);
    });
  });
}
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

document.getElementById("main").innerHTML = DATA.map(d=>`
 <div class="lm" id="lm-${esc(d.key)}">
  <div class="lm-head">
    <span class="lm-name">${esc(d.name)}</span>
    <span class="lm-city">${esc(d.city)} &middot; #${d.idx+1}</span>
    <span class="lm-badge">current ${d.w}&times;${d.h} &middot; ratio ${d.ratio}</span>
  </div>
  <div class="strip">
    <div class="tile cur">
      <div class="frame"><img src="../${esc(d.img)}" loading="lazy" alt=""></div>
      <div class="meta"><b>CURRENT</b><br>${esc(d.img.split("/").pop())}</div>
    </div>
    ${d.cands.length ? d.cands.map(c=>`
      <div class="tile" data-key="${esc(d.key)}" data-file="${esc(c.file)}">
        <div class="frame"><img src="${esc(c.thumb)}" loading="lazy" alt=""></div>
        <div class="meta">${c.w}&times;${c.h} &middot; r${c.ratio}${c.detail?' <span class="tag">loose match?</span>':""}<br>
          ${esc(c.title)}<br>
          <a href="${esc(c.page)}" target="_blank" rel="noopener">Source page</a></div>
      </div>`).join("") : `<div class="none">No open-licensed landscape photo found &mdash; needs a manual source.</div>`}
  </div>
  <div class="acts">
    <button data-act="keep" data-key="${esc(d.key)}">Keep current</button>
    <button data-act="skip" data-key="${esc(d.key)}">Skip</button>
    <button data-own-toggle data-key="${esc(d.key)}">Use my own photo…</button>
  </div>
  <div class="own" hidden data-own-for="${esc(d.key)}">
    <div class="own-row">
      <input class="own-url" type="url" placeholder="Paste an image URL, or a Commons / Unsplash / Pexels page URL">
      <select class="own-file"><option value="">— or a file from _needs-attention/uploads/ —</option></select>
      <button data-own-refresh>Rescan folder</button>
    </div>
    <div class="own-row" style="margin-top:7px">
      <input class="own-credit" placeholder="Credit (optional), e.g. Jeff Wolinsky">
      <button data-own-use>Use this photo</button>
      <button data-own-clear>Clear</button>
    </div>
    <p class="own-hint">Commons links pull their author and licence automatically. For anything else, add a credit if one is owed.</p>
    <div class="own-preview"></div>
  </div>
 </div>`).join("");

document.addEventListener("click", e=>{
  const tile = e.target.closest(".tile[data-file]");
  if (tile){
    const k = tile.dataset.key;
    if (dec[k] && dec[k].action==="swap" && dec[k].file===tile.dataset.file) delete dec[k];
    else dec[k] = {action:"swap", file:tile.dataset.file};
    save(); return;
  }
  const b = e.target.closest("button[data-act]");
  if (b){
    const k = b.dataset.key;
    if (dec[k] && dec[k].action===b.dataset.act) delete dec[k];
    else dec[k] = {action:b.dataset.act};
    save();
  }
});
document.getElementById("btn-accept").onclick = ()=>{
  DATA.forEach(d=>{ if(d.cands.length && !dec[d.key]) dec[d.key]={action:"swap", file:d.cands[0].title}; });
  save();
};
document.getElementById("btn-clear").onclick = ()=>{ if(confirm("Clear all decisions?")){ dec={}; save(); } };
document.getElementById("btn-export").onclick = ()=>{
  const out = DATA.filter(d=>dec[d.key]).map(d=>Object.assign({city:d.city, idx:d.idx, name:d.name}, dec[d.key]));
  document.getElementById("out-json").value = JSON.stringify(out, null, 1);
  document.getElementById("out").style.display = "block";
  document.getElementById("out-json").select();
};
document.getElementById("out-close").onclick = ()=>{ document.getElementById("out").style.display="none"; };
/* ---- "Use my own photo": a pasted URL, or a file dropped in uploads/ ---- */
async function listUploads(){
  try{
    const r = await fetch("uploads/", {cache:"no-store"});
    if(!r.ok) return [];
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    return [...doc.querySelectorAll("a")]
      .map(a => decodeURIComponent(a.getAttribute("href")||""))
      .filter(h => /\.(jpe?g|png|webp)$/i.test(h))
      .map(h => h.replace(/^.*\//, ""));
  }catch(e){ return []; }
}
async function fillFileSelect(sel){
  const files = await listUploads();
  const keep = sel.value;
  sel.innerHTML = '<option value="">— or a file from _needs-attention/uploads/ —</option>'
    + files.map(f => '<option value="'+esc(f)+'">'+esc(f)+'</option>').join("");
  if (files.includes(keep)) sel.value = keep;
  return files.length;
}
function ownPanel(key){ return document.querySelector('.own[data-own-for="'+CSS.escape(key)+'"]'); }
function showOwnPreview(key, src, note, good){
  const box = ownPanel(key).querySelector(".own-preview");
  box.innerHTML = '<img alt=""><span class="'+(good?'ok':'bad')+'">'+esc(note)+'</span>';
  const im = box.querySelector("img"), sp = box.querySelector("span");
  if(!src){ im.remove(); return; }
  im.onload = () => {
    const r = im.naturalWidth/im.naturalHeight;
    sp.textContent = im.naturalWidth+"×"+im.naturalHeight+" · ratio "+r.toFixed(2)+" · "
      + (r >= 1.25 ? "landscape ✓" : r >= 1 ? "near-square" : "portrait (fine — the modal adapts)");
    sp.className = "ok";
  };
  im.onerror = () => { sp.textContent = "couldn't load that image — check the link"; sp.className = "bad"; };
  im.src = src;
}
document.addEventListener("click", async e => {
  const tg = e.target.closest("[data-own-toggle]");
  if (tg){
    const p = ownPanel(tg.dataset.key);
    p.hidden = !p.hidden;
    if (!p.hidden){
      const n = await fillFileSelect(p.querySelector(".own-file"));
      if (!n) p.querySelector(".own-hint").textContent =
        "No images in _needs-attention/uploads/ yet — drop files there and press Rescan folder. A pasted URL works too.";
    }
    return;
  }
  const rf = e.target.closest("[data-own-refresh]");
  if (rf){ await fillFileSelect(rf.closest(".own").querySelector(".own-file")); return; }
  const cl = e.target.closest("[data-own-clear]");
  if (cl){
    const pn = cl.closest(".own"), k = pn.dataset.ownFor;
    delete dec[k];
    pn.querySelector(".own-preview").innerHTML = "";
    pn.querySelector(".own-url").value = ""; pn.querySelector(".own-credit").value = "";
    save(); return;
  }
  const use = e.target.closest("[data-own-use]");
  if (use){
    const pn = use.closest(".own"), k = pn.dataset.ownFor;
    const url = pn.querySelector(".own-url").value.trim();
    const file = pn.querySelector(".own-file").value;
    const credit = pn.querySelector(".own-credit").value.trim();
    if (!url && !file){ showOwnPreview(k, "", "paste a URL or pick a file first", false); return; }
    dec[k] = Object.assign({}, META[k], {action:"custom", source: url ? "url" : "file",
                                         value: url || file, credit: credit || undefined});
    showOwnPreview(k, url ? url : "uploads/" + encodeURIComponent(file), "loading…", true);
    save(); return;
  }
});

tally();
</script>
