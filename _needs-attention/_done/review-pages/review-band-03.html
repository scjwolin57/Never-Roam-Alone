": "Cathedrale Notre-Dame de Papeete - panoramio", "file": "commons:File:Cathedrale Notre-Dame de Papeete - panoramio.jpg", "w": 2000, "h": 1500, "ratio": 1.333, "thumb": "https://commons.wikimedia.org/wiki/Special:FilePath/Cathedrale_Notre-Dame_de_Papeete_-_panoramio.jpg?width=520", "page": "https://commons.wikimedia.org/wiki/File:Cathedrale_Notre-Dame_de_Papeete_-_panoramio.jpg", "detail": false}, {"title": "Papeete Catholic Cathedral Interior", "file": "commons:File:Papeete Catholic Cathedral Interior.jpg", "w": 2048, "h": 1536, "ratio": 1.333, "thumb": "https://commons.wikimedia.org/wiki/Special:FilePath/Papeete_Catholic_Cathedral_Interior.jpg?width=520", "page": "https://commons.wikimedia.org/wiki/File:Papeete_Catholic_Cathedral_Interior.jpg", "detail": true}]}];
const KEY = "nra-lmk-review-band";
let dec = {}; try { dec = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { dec = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(dec)); }catch(e){} tally(); }
function esc(s){ return String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
function tally(){
  document.getElementById("n-done").textContent = Object.keys(dec).length;
  document.getElementById("n-page").textContent = DATA.filter(d=>dec[d.key]).length;
  document.getElementById("n-swap").textContent = Object.values(dec).filter(x=>x.action==="swap").length;
  DATA.forEach(d=>{
    const el=document.getElementById("lm-"+d.key); if(!el) return;
    const dd=dec[d.key];
    el.classList.toggle("decided", !!dd && dd.action!=="skip");
    el.classList.toggle("skipped", !!dd && dd.action==="skip");
    el.querySelectorAll(".tile").forEach(t=>t.classList.toggle("sel", !!dd && dd.action==="swap" && t.dataset.file===dd.file));
  });
  applyFilter();
}
function applyFilter(){
  const f=document.getElementById("filter").value;
  DATA.forEach(d=>{
    const el=document.getElementById("lm-"+d.key); if(!el) return;
    let hide=false;
    if(f==="undecided") hide = !!dec[d.key];
    if(f==="strong")    hide = !d.cands.some(c=>!c.detail);
    el.classList.toggle("hide", hide);
  });
}
document.getElementById("main").innerHTML = DATA.map(d=>`
 <div class="lm" id="lm-${esc(d.key)}">
  <div class="lm-head"><span class="lm-name">${esc(d.name)}</span>
    <span class="lm-city">${esc(d.city)} &middot; #${d.idx+1}</span>
    <span class="lm-badge">${d.w}&times;${d.h} &middot; r${d.ratio}</span></div>
  <div class="strip">
    <div class="tile cur"><div class="frame"><img src="../${esc(d.img)}" loading="lazy" alt=""></div>
      <div class="meta"><b>CURRENT</b></div></div>
    ${d.cands.map(c=>`
      <div class="tile" data-key="${esc(d.key)}" data-file="${esc(c.file)}">
        <div class="frame"><img src="${esc(c.thumb)}" loading="lazy" alt=""></div>
        <div class="meta">${c.w}&times;${c.h} &middot; r${c.ratio}${c.detail?' <span class="tag">detail?</span>':""}<br>
          ${esc(c.title)}<br><a href="${esc(c.page)}" target="_blank" rel="noopener">Commons page</a></div>
      </div>`).join("")}
  </div>
  <div class="acts">
    <button data-act="keep" data-key="${esc(d.key)}">Keep current</button>
    <button data-act="skip" data-key="${esc(d.key)}">Skip</button>
  </div>
 </div>`).join("");
const META = {}; DATA.forEach(d=>META[d.key]={city:d.city, idx:d.idx, name:d.name});
document.addEventListener("click", e=>{
  const tile=e.target.closest(".tile[data-file]");
  if(tile){ const k=tile.dataset.key;
    if(dec[k]&&dec[k].action==="swap"&&dec[k].file===tile.dataset.file) delete dec[k];
    else dec[k]=Object.assign({}, META[k], {action:"swap", file:tile.dataset.file});
    save(); return; }
  const b=e.target.closest("button[data-act]");
  if(b){ const k=b.dataset.key;
    if(dec[k]&&dec[k].action===b.dataset.act) delete dec[k];
    else dec[k]=Object.assign({}, META[k], {action:b.dataset.act});
    save(); }
});
document.getElementById("filter").onchange=applyFilter;
document.getElementById("btn-accept").onclick=()=>{
  DATA.forEach(d=>{ if(!dec[d.key]&&d.cands.length) dec[d.key]=Object.assign({},META[d.key],{action:"swap",file:d.cands[0].file}); });
  save(); };
document.getElementById("btn-skip").onclick=()=>{
  DATA.forEach(d=>{ if(!dec[d.key]) dec[d.key]=Object.assign({},META[d.key],{action:"skip"}); });
  save(); };
document.getElementById("btn-export").onclick=()=>{
  document.getElementById("out-json").value=JSON.stringify(Object.values(dec),null,1);
  document.getElementById("out").style.display="block";
  document.getElementById("out-json").select(); };
document.getElementById("out-close").onclick=()=>{document.getElementById("out").style.display="none";};
tally();
</script>
