}

   visible confirmation that anything happened. */
function renderCustom(k){
  const card=document.getElementById("lm-"+k); if(!card) return;
  const strip=card.querySelector(".strip");
  const old=strip.querySelector(".tile.mine"); if(old) old.remove();
  const d=dec[k];
  if(!d || d.action!=="custom") return;
  const src=customSrc(d);
  const el=document.createElement("div");
  el.className="tile mine sel";
  el.innerHTML=`<div class="frame"><img src="${esc(src)}" alt=""></div>
    <div class="meta"><b>MY PHOTO</b>${d.credit?" &middot; "+esc(d.credit):""}<br>
      ${esc(d.source==="url"?d.value:d.value).slice(0,60)}<br>
      <a href="#" data-clearmine="${esc(k)}">remove</a></div>`;
  strip.insertBefore(el, strip.children[1] || null);
  const img=el.querySelector("img");
  img.addEventListener("error",()=>{
    el.querySelector(".frame").innerHTML='<span style="font-size:.7rem;color:#8a2b12;padding:6px;text-align:center">preview unavailable<br>(file will still be applied)</span>';
  });
}
function tally(){
  document.getElementById("n-done").textContent = Object.keys(dec).length;
  document.getElementById("n-page").textContent = DATA.filter(d=>dec[d.key]).length;
  document.getElementById("n-swap").textContent = Object.values(dec).filter(x=>x.action==="swap"||x.action==="custom").length;
  DATA.forEach(d=>{
    const el=document.getElementById("lm-"+d.key); if(!el) return;
    const dd=dec[d.key];
    el.classList.toggle("decided", !!dd && dd.action!=="skip");
    el.classList.toggle("skipped", !!dd && dd.action==="skip");
    el.querySelectorAll(".tile[data-file]").forEach(t=>t.classList.toggle("sel", !!dd && dd.action==="swap" && t.dataset.file===dd.file));

    renderCustom(d.key);
  });
  applyFilter();
}
function applyFilter(){
  const f=document.getElementById("filter").value;
  DATA.forEach(d=>{
    const el=document.getElementById("lm-"+d.key); if(!el) return;
    let hide=false;
    if(f==="undecided") hide=!!dec[d.key];
    if(f==="commons")   hide=d.tier!=="commons";
    if(f==="openverse") hide=d.tier!=="openverse";
    el.classList.toggle("hide", hide);
  });
}
document.getElementById("main").innerHTML = DATA.map(d=>`
 <div class="lm" id="lm-${esc(d.key)}">
  <div class="lm-head"><span class="lm-name">${esc(d.name)}</span>
    <span class="lm-city">${esc(d.cityname)}, ${esc(d.country)} &middot; #${d.idx+1}</span>
    <span class="lm-badge tier-${esc(d.tier)}">${esc(d.tier)} &middot; ${d.cands.length} candidate${d.cands.length>1?"s":""}</span></div>
  <div class="strip">
    <div class="tile cur"><div class="frame"><img src="../images/landmark-coming-soon.svg" alt=""></div>
      <div class="meta"><b>NO PHOTO YET</b></div></div>
    ${d.cands.map(c=>`
      <div class="tile" data-key="${esc(d.key)}" data-file="${esc(c.file)}">
        <div class="frame"><img src="${esc(c.thumb)}" loading="lazy" alt=""></div>
        <div class="meta"><span class="src">${esc(c.src)}</span>${c.w}&times;${c.h} &middot; r${c.ratio}${c.weak?' <span class="tag">weak match?</span>':""}${c.placeonly?' <span class="tag place">right place, not the landmark</span>':""}<br>
          ${esc(c.label)}${c.lic?" &middot; "+esc(c.lic):""}<br>
          <a href="${esc(c.page)}" target="_blank" rel="noopener">Source page</a></div>
      </div>`).join("")}
  </div>
  <div class="acts">
    <button data-act="skip" data-key="${esc(d.key)}">Skip</button>
    <button data-own="${esc(d.key)}">Use my own photo…</button>
  </div>
  <div class="own" id="own-${esc(d.key)}" hidden>
    <input type="text" class="own-url" placeholder="Paste an image URL, or a Commons/Flickr page URL">
    <div class="row">
      <select class="own-file"><option value="">— or a file in _needs-attention/uploads/ —</option></select>
      <button data-rescan="${esc(d.key)}">Rescan folder</button>
      <input type="text" class="own-credit" placeholder="Credit (optional)">
      <button data-usemine="${esc(d.key)}">Use this</button>
    </div>
  </div>
 </div>`).join("");

async function loadUploads(sel){
  try{
    const r = await fetch("uploads/", {cache:"no-store"});
    const html = await r.text();
    const names = [...html.matchAll(/href="([^"?]+\.(?:jpe?g|png|webp))"/gi)]  /* HEIC is deliberately excluded: browsers cannot render it. Run _guidebuild/convert_uploads.sh to turn HEIC into JPEG first. */
      .map(m=>decodeURIComponent(m[1].split("/").pop()));
    const heic = [...html.matchAll(/href="([^"?]+\.(?:heic|heif))"/gi)]
      .map(m=>decodeURIComponent(m[1].split("/").pop()));
    const shown = [...new Set(names)];
    sel.innerHTML = '<option value="">— or a file in _needs-attention/uploads/ —</option>' +
      shown.map(n=>`<option value="${n}">${n}</option>`).join("") +
      (heic.length ? `<option value="" disabled>${heic.length} HEIC file(s) hidden — run _guidebuild/convert_uploads.sh</option>` : "");
  }catch(e){ /* directory listing unavailable */ }
}
document.addEventListener("click", async e=>{
  const tile=e.target.closest(".tile[data-file]");
  if(tile){ const k=tile.dataset.key;
    if(dec[k]&&dec[k].action==="swap"&&dec[k].file===tile.dataset.file) delete dec[k];
    else dec[k]=Object.assign({},META[k],{action:"swap",file:tile.dataset.file});
    save(); return; }
  const own=e.target.closest("button[data-own]");
  if(own){ const box=document.getElementById("own-"+own.dataset.own);
    box.hidden=!box.hidden; if(!box.hidden) loadUploads(box.querySelector(".own-file")); return; }
  const rs=e.target.closest("button[data-rescan]");
  if(rs){ loadUploads(document.getElementById("own-"+rs.dataset.rescan).querySelector(".own-file")); return; }
  const um=e.target.closest("button[data-usemine]");
  if(um){ const k=um.dataset.usemine, box=document.getElementById("own-"+k);
    const url=box.querySelector(".own-url").value.trim(), file=box.querySelector(".own-file").value;
    const credit=box.querySelector(".own-credit").value.trim();
    if(!url && !file){ alert("Paste a URL or pick a file first."); return; }
    dec[k]=Object.assign({},META[k],{action:"custom", source:url?"url":"file", value:url||file, credit:credit||undefined});
    save(); return; }
  const cm=e.target.closest("a[data-clearmine]");
  if(cm){ e.preventDefault(); delete dec[cm.dataset.clearmine]; save(); return; }
  const b=e.target.closest("button[data-act]");
  if(b){ const k=b.dataset.key;
    if(dec[k]&&dec[k].action===b.dataset.act) delete dec[k];
    else dec[k]=Object.assign({},META[k],{action:b.dataset.act});
    save(); }
});
document.getElementById("filter").onchange=applyFilter;
document.getElementById("btn-accept").onclick=()=>{
  DATA.forEach(d=>{ if(!dec[d.key]&&d.cands.length) dec[d.key]=Object.assign({},META[d.key],{action:"swap",file:d.cands[0].file}); });
  save(); };
document.getElementById("btn-skip").onclick=()=>{
  DATA.forEach(d=>{ if(!dec[d.key]) dec[d.key]=Object.assign({},META[d.key],{action:"skip"}); });
  save(); };
document.getElementById("btn-export").onclick=()=>{
  document.getElementById("out-json").value=JSON.stringify(Object.values(dec),null,1);
  document.getElementById("out").style.display="block";
  document.getElementById("out-json").select(); };
document.getElementById("out-close").onclick=()=>{document.getElementById("out").style.display="none";};
tally();
</script>
