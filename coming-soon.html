<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />

  <script src="consent.js"></script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="This city guide is on its way. Request it and we'll move it up the list.">
<meta name="robots" content="noindex, nofollow" />
<title>Never Roam Alone — Coming Soon</title>
<link rel="stylesheet" href="fonts/amatic-sc.css" /><link rel="stylesheet" href="fonts/site-fonts.css">
<link rel="stylesheet" href="master.css">
<style>
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--sand);
    line-height:1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    width:100%;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:48px 36px;
    text-align:center;
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Amatic SC','Fraunces',Georgia,serif;font-weight:700;font-size:2.4rem;line-height:1;
    color:#b5492c;margin-bottom:6px;
  }
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(168,72,42,.2)}
  p.kicker{
    color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.18em;
    font-size:.78rem;margin:0 0 18px;
  }
  h1{font-family:Georgia,'Amatic SC',serif;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 14px;color:var(--ink)}
  p.sub{color:var(--muted);margin:0;font-size:1.02rem}

  /* ================= EXPLORER THEME (overrides) ================= */
  .fact,.tile,.tcard,.dtcard,.stay-card,.hood,.card{border:1px solid var(--ink);border-radius:3px}
  .form-card,.visa-panel,.gate,.legal,.toc,.city-card,.cmp-card,.qadmin,.ns-card,.travel-map,.cover-strip,.suggest,.empty,.side-card,.roamers-card,.cal-wrap,.qcard{border-radius:3px}
  .form-card,.visa-panel,.gate,.legal,.toc,.city-card,.cmp-card,.qadmin,.ns-card,.side-card{border:1px solid var(--ink)}
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><symbol id="compass" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="50" cy="50" r="39" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1.5 3"/><polygon points="50,6 57,50 50,50" fill="#b5492c"/><polygon points="50,6 43,50 50,50" fill="#8a3a20"/><polygon points="50,94 57,50 50,50" fill="currentColor" opacity=".85"/><polygon points="50,94 43,50 50,50" fill="currentColor" opacity=".55"/><polygon points="94,50 50,43 50,50" fill="currentColor" opacity=".7"/><polygon points="94,50 50,57 50,50" fill="currentColor" opacity=".5"/><polygon points="6,50 50,43 50,50" fill="currentColor" opacity=".7"/><polygon points="6,50 50,57 50,50" fill="currentColor" opacity=".5"/><circle cx="50" cy="50" r="3.5" fill="#b5492c"/></symbol></svg>
  <div class="card">
    <div class="brand"><span class="dot"></span>Never Roam Alone</div>
    <p class="kicker">Coming Soon</p>
    <h1>We're packing our bags and getting ready.</h1>
    <p class="sub">Something new is on the way. Check back soon.</p>
  </div>
</body>
</html>
