<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="This city guide is on its way. Request it and we'll move it up the list.">
<meta name="robots" content="noindex, nofollow" />
<title>Never Roam Alone — Coming Soon</title>
<link rel="stylesheet" href="fonts/amatic-sc.css" />
<style>
  :root{
    --ink:#1d2a32;
    --muted:#5b6b75;
    --sand:#f6f1e7;
    --teal:#556B2F;
    --teal-dark:#3C4B21;
    --coral:#C04020;
    --card:#ffffff;
    --shadow:0 10px 30px rgba(20,40,50,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--sand);
    line-height:1.6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    max-width:520px;
    width:100%;
    background:var(--card);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:48px 36px;
    text-align:center;
  }
  .brand{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:2.4rem;line-height:1;
    color:#C04020;margin-bottom:6px;
  }
  .brand .dot{width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(192,64,32,.2)}
  p.kicker{
    color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.18em;
    font-size:.78rem;margin:0 0 18px;
  }
  h1{font-family:Georgia,'Amatic SC',serif;font-size:clamp(1.6rem,4vw,2.2rem);margin:0 0 14px;color:var(--ink)}
  p.sub{color:var(--muted);margin:0;font-size:1.02rem}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span>Never Roam Alone</div>
    <p class="kicker">Coming Soon</p>
    <h1>We're packing our bags and getting ready.</h1>
    <p class="sub">Something new is on the way. Check back soon.</p>
  </div>
</body>
</html>
