<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Never Roam Alone — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1d2a32;--muted:#5b6b75;--sand:#f6f1e7;--green:#185e3f;--teal:#0e7c86;
    --coral:#e97451;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--sand);line-height:1.7}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#e97451}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}

  .hero{position:relative;height:56vh;min-height:380px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;color:#fff}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,30,25,.1) 0%,rgba(10,30,25,.78) 100%)}
  .hero-inner{position:relative;z-index:2;max-width:760px;margin:0 auto;width:100%;padding:0 22px 40px}
  .tag{display:inline-block;background:var(--coral);color:#fff;font-size:.7rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:20px;margin-bottom:14px}
  .hero h1{font-size:clamp(2rem,5.5vw,3.4rem);margin:0;line-height:1.08;text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .hero .meta{margin-top:14px;font-size:.92rem;opacity:.95}

  article.post{max-width:680px;margin:0 auto;padding:46px 22px 10px}
  .byline{display:flex;align-items:center;gap:12px;padding-bottom:26px;margin-bottom:30px;border-bottom:1px solid rgba(24,94,63,.15)}
  .byline .avatar{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0}
  .byline .who{font-weight:700}
  .byline .who small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
  article.post p{font-size:1.12rem;margin:0 0 22px}
  article.post p.lead{font-size:1.28rem;color:var(--ink)}
  article.post h2{font-size:1.5rem;margin:34px 0 14px}
  .pullquote{border-left:3px solid var(--coral);padding:6px 0 6px 20px;margin:30px 0;
    font-family:Georgia,serif;font-style:italic;font-size:1.25rem;color:var(--teal)}

  .post-foot{max-width:680px;margin:10px auto 0;padding:0 22px}
  .back{display:inline-block;background:var(--green);color:#fff;font-weight:700;padding:12px 22px;border-radius:30px;transition:background .2s}
  .back:hover{background:var(--teal)}

  .soon{text-align:center;max-width:620px;margin:0 auto;padding:110px 22px}
  .soon h1{font-size:2.3rem;margin-bottom:10px}
  .soon p{color:var(--muted);font-size:1.1rem}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:46px}
  footer .brand{justify-content:center;color:#e97451;font-size:1.6rem}
  @media(max-width:820px){nav.links{display:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <svg class="logo" viewBox="0 0 120 120" width="44" height="44" aria-label="Never Roam Alone logo" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#185e3f" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="60" cy="60" r="53"/>
          <polyline points="26,63 44,34 54,47 67,28 79,45 94,63"/>
          <path d="M22,86 Q60,74 98,86"/>
        </g>
        <g fill="#185e3f">
          <circle cx="50" cy="62" r="5.2"/>
          <path d="M43.4,72.5 Q43.4,69 47,69 L53,69 Q56.6,69 56.6,72.5 L55,84 L51.2,84 L50.3,76 L49.7,76 L48.8,84 L45,84 Z"/>
          <circle cx="70" cy="62" r="5.2"/>
          <path d="M63.4,72.5 Q63.4,69 67,69 L73,69 Q76.6,69 76.6,72.5 L75,84 L71.2,84 L70.3,76 L69.7,76 L68.8,84 L65,84 Z"/>
          <path d="M58.4,84 C56,90 63,93 60.5,98 C58.6,101.8 53,103 50,106 L70,106 C66.5,103 62.8,101.5 64.2,97.5 C65.4,93.5 63,90 61.6,84 Z"/>
        </g>
      </svg>
      <span>Never Roam Alone<small>Your Travel Companion</small></span>
    </a>
    <nav class="links">
      <a href="index.html">Map</a>
      <a href="index.html#blog">Blog</a>
      <a href="choose.html">Destination Finder</a>
    </nav>
  </div>
</header>

<main id="content"><!-- filled by JS --></main>

<footer>
  <div class="brand"><span>Never Roam Alone</span></div>
</footer>

<script>
/* Blog posts. Body is an array of blocks: ["p", text] | ["lead", text] | ["h2", text] | ["quote", text].
   This is the single source for full posts; the home-page tiles link in by slug. */
const POSTS = {
  "kyoto-backstreets":{
    title:"Three Days Lost in Kyoto's Backstreets", tag:"Japan", date:"June 12, 2026",
    location:"Kyoto, Japan", seed:"kyoto",
    body:[
      ["lead","I came to Kyoto with a list of temples and left with a map of noodle counters, hidden shrines, and the particular quiet of a lane at dawn."],
      ["p","The famous sights earn their fame, and you should see them. But Kyoto rewards the wanderer more than the checklist. On my second morning I gave up on the plan, picked a direction, and started walking."],
      ["quote","The best alley in Kyoto is always the one you weren't looking for."],
      ["p","By noon I'd found a tea house older than my country, a cat who owned a doorway, and a grandmother who pressed a warm sweet potato into my hands and waved away my money. None of it was on the list. All of it is why I'll go back."],
      ["h2","If you go"],
      ["p","Stay near the Kamo River, rent nothing, and leave a full afternoon with no destination. Kyoto fills empty time better than almost anywhere I've been."]
    ]
  },
  "lisbon-on-foot":{
    title:"Why Lisbon Is Best on Foot", tag:"Portugal", date:"May 28, 2026",
    location:"Lisbon, Portugal", seed:"lisbon",
    body:[
      ["lead","Lisbon is a city built on hills and tiled in light. The famous tram is lovely — but the city only really opens up when you climb it yourself."],
      ["p","Every wrong turn here ends at a viewpoint. The miradouros are scattered across the hills like rewards for getting lost, and the walk between them is half the pleasure: laundry strung overhead, the smell of grilled sardines, a fado drifting from a doorway."],
      ["quote","Take the stairs. The view is the whole point, and you earn it twice."],
      ["p","I walked until my legs gave out, then sat with a custard tart and watched the river turn gold. There are faster ways to see Lisbon. There is no better one."]
    ]
  },
  "marrakech-morning":{
    title:"A Slow Morning in Marrakech", tag:"Morocco", date:"April 9, 2026",
    location:"Marrakech, Morocco", seed:"marrakech",
    body:[
      ["lead","The medina is loud by mid-morning. So I learned to wake before it did."],
      ["p","At six the souks belong to cats and shopkeepers sweeping their thresholds. Mint tea appears before you ask. The light comes in low and copper, and for an hour the whole maze feels like a secret you've been let in on."],
      ["quote","Haggle with a smile, drink the tea slowly, and never be in a hurry to leave."],
      ["p","By the time the crowds arrived I'd already had my morning — a rooftop, a glass of tea, and the call to prayer rolling across the rooftops. Marrakech gives its best to early risers."]
    ]
  },
  "patagonia-pack-light":{
    title:"Patagonia Taught Me to Pack Light", tag:"Argentina", date:"March 3, 2026",
    location:"Patagonia, Argentina", seed:"patagonia",
    body:[
      ["lead","I brought too much of everything except patience. The wind at the end of the world has a way of sorting your priorities."],
      ["p","Out here the weather changes four times an hour and the trails ask more of you than the guidebooks admit. You stop carrying what you don't need very quickly — in your pack and otherwise."],
      ["quote","What the wind takes, the mountains give back."],
      ["p","On the last day the clouds finally lifted off the peaks, and I understood why people come all this way for a view that might not show up. It did. It was worth every gram I'd hauled and every one I'd left behind."]
    ]
  },
  "48-hours-hanoi":{
    title:"48 Hours in Hanoi", tag:"Vietnam", date:"February 18, 2026",
    location:"Hanoi, Vietnam", seed:"hanoi",
    body:[
      ["lead","Two days is not enough for Hanoi. It is, however, exactly enough to fall for it."],
      ["p","The Old Quarter moves like a river of motorbikes, and the trick is to wade in slowly and trust it to part around you. Between crossings there is coffee thick as honey, broth that takes all night to make, and plastic stools that somehow hold the best meals of the trip."],
      ["quote","The best two dollars I ever spent was dinner on a street corner in Hanoi."],
      ["p","I left with a notebook full of addresses I'll never find again and a standing plan to come back hungry."]
    ]
  },
  "quiet-santorini":{
    title:"The Quiet Side of Santorini", tag:"Greece", date:"January 21, 2026",
    location:"Santorini, Greece", seed:"santorini",
    body:[
      ["lead","Everyone photographs the same sunset. The island's real magic happens hours earlier, when no one's awake to see it."],
      ["p","Skip the evening crush in Oia and set an alarm instead. At seven the caldera is silver and still, the cafés are empty, and the blue domes belong only to you and a few cats picking their way along the walls."],
      ["quote","Same island, completely different place — just shift your clock by twelve hours."],
      ["p","By the time the tour buses arrived I was already on my second coffee, perfectly content to let everyone else fight over the famous view."]
    ]
  }
};

const params = new URLSearchParams(location.search);
const slug = (params.get("post")||"").toLowerCase();
const post = POSTS[slug];
const content = document.getElementById("content");

function render(b){
  if(b[0]==="lead")  return `<p class="lead">${b[1]}</p>`;
  if(b[0]==="h2")    return `<h2>${b[1]}</h2>`;
  if(b[0]==="quote") return `<blockquote class="pullquote">${b[1]}</blockquote>`;
  return `<p>${b[1]}</p>`;
}

if(post){
  document.title = `${post.title} — Never Roam Alone`;
  const words = post.body.reduce((n,b)=>n + b[1].split(/\s+/).length, 0);
  const mins = Math.max(1, Math.round(words/200));
  const hero = `https://picsum.photos/seed/${post.seed}-hero/1600/900`;
  content.innerHTML = `
    <div class="hero" style="background-image:url('${hero}')">
      <div class="hero-inner">
        <span class="tag">${post.tag}</span>
        <h1>${post.title}</h1>
        <div class="meta">${post.date} &nbsp;·&nbsp; ${post.location} &nbsp;·&nbsp; ${mins} min read</div>
      </div>
    </div>
    <article class="post i18n-ml">
      <div class="byline">
        <div class="avatar" style="background-image:url('pyramids-web.jpg')"></div>
        <div class="who">Jeff<small>Never Roam Alone</small></div>
      </div>
      ${post.body.map(render).join("\n")}
    </article>
    <div class="post-foot"><a class="back" href="index.html#blog">&larr; Back to all stories</a></div>`;
} else {
  document.title = "Coming soon — Never Roam Alone";
  content.innerHTML = `
    <div class="soon">
      <h1>This story is still being written</h1>
      <p>That post hasn't been published yet — check back soon, or explore the ones that are ready.</p>
      <p style="margin-top:26px"><a class="back" href="index.html#blog">&larr; Back to all stories</a></p>
    </div>`;
}
</script>
<script src="i18n.js"></script>
</body>
</html>
