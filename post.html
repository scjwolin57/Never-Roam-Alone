<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Never Roam Alone — Story</title>
<link rel="stylesheet" href="fonts/amatic-sc.css" />
<style>
  :root{
    --ink:#1d2a32;--muted:#5b6b75;--sand:#f6f1e7;--green:#185e3f;--teal:#0e7c86;
    --coral:#e97451;--card:#fff;--shadow:0 10px 30px rgba(20,40,50,.12);--maxw:1100px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--sand);line-height:1.7}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif}
  a{color:inherit;text-decoration:none}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(246,241,231,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid rgba(24,94,63,.15)}
  .nav-inner{max-width:var(--maxw);margin:0 auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Amatic SC',Georgia,serif;font-weight:700;font-size:1.85rem;line-height:1;color:#c35237}
  .brand .logo{flex-shrink:0;display:block}
  .brand small{display:block;font-family:-apple-system,sans-serif;font-weight:500;font-size:.62rem;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  nav.links a{margin-left:24px;font-weight:600;font-size:.95rem;color:var(--muted);
    padding-bottom:3px;border-bottom:2px solid transparent;transition:.2s}
  nav.links a:hover{color:var(--green);border-color:var(--coral)}

  .hero{position:relative;height:56vh;min-height:380px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;color:#fff}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(10,30,25,.1) 0%,rgba(10,30,25,.78) 100%)}
  .hero-inner{position:relative;z-index:2;max-width:760px;margin:0 auto;width:100%;padding:0 22px 40px}
  .tag{display:inline-block;background:var(--coral);color:#fff;font-size:.7rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.1em;padding:5px 12px;border-radius:20px;margin-bottom:14px}
  .hero h1{font-size:clamp(2rem,5.5vw,3.4rem);margin:0;line-height:1.08;text-shadow:0 2px 16px rgba(0,0,0,.35)}
  .hero .meta{margin-top:14px;font-size:.92rem;opacity:.95}

  article.post{max-width:680px;margin:0 auto;padding:46px 22px 10px}
  .byline{display:flex;align-items:center;gap:12px;padding-bottom:26px;margin-bottom:30px;border-bottom:1px solid rgba(24,94,63,.15)}
  .byline .avatar{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0}
  .byline .who{font-weight:700}
  .byline .who small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
  article.post p{font-size:1.12rem;margin:0 0 22px}
  article.post p.lead{font-size:1.28rem;color:var(--ink)}
  article.post h2{font-size:1.5rem;margin:34px 0 14px}
  .pullquote{border-left:3px solid var(--coral);padding:6px 0 6px 20px;margin:30px 0;
    font-family:Georgia,serif;font-style:italic;font-size:1.25rem;color:var(--teal)}

  .post-foot{max-width:680px;margin:10px auto 0;padding:0 22px}
  .back{display:inline-block;background:var(--green);color:#fff;font-weight:700;padding:12px 22px;border-radius:30px;transition:background .2s}
  .back:hover{background:var(--teal)}

  .soon{text-align:center;max-width:620px;margin:0 auto;padding:110px 22px}
  .soon h1{font-size:2.3rem;margin-bottom:10px}
  .soon p{color:var(--muted);font-size:1.1rem}

  footer{background:var(--green);color:#dfeee7;text-align:center;padding:40px 22px;margin-top:46px}
  footer .brand{justify-content:center;color:#c35237;font-size:1.6rem}
  @media(max-width:820px){nav.links{display:none}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <img class="logo" src="logo.svg" width="44" height="44" alt="Never Roam Alone logo">
      <span>Never Roam Alone<small>Your Travel Companion</small></span>
    </a>
    <nav class="links" data-site-nav></nav>
  </div>
</header>

<main id="content"><!-- filled by JS --></main>

<footer>
  <div class="brand"><span>Never Roam Alone</span></div>
</footer>

<script src="posts.js"></script>
<script>
/* Post content now lives in posts.js — the single source of truth.
   Add a post there and its article page works automatically. */

const params = new URLSearchParams(location.search);
const slug = (params.get("post")||"").toLowerCase();
const post = window.NRA_POSTS_UTIL.bySlug(slug);
const content = document.getElementById("content");

function render(b){
  if(b[0]==="lead")  return `<p class="lead">${b[1]}</p>`;
  if(b[0]==="h2")    return `<h2>${b[1]}</h2>`;
  if(b[0]==="quote") return `<blockquote class="pullquote">${b[1]}</blockquote>`;
  return `<p>${b[1]}</p>`;
}

if(post){
  document.title = `${post.title} — Never Roam Alone`;
  const words = post.body.reduce((n,b)=>n + b[1].split(/\s+/).length, 0);
  const mins = Math.max(1, Math.round(words/200));
  const hero = `https://picsum.photos/seed/${post.seed}-hero/1600/900`;
  content.innerHTML = `
    <div class="hero" style="background-image:url('${hero}')">
      <div class="hero-inner">
        <span class="tag">${post.tag}</span>
        <h1>${post.title}</h1>
        <div class="meta">${window.NRA_POSTS_UTIL.longDate(post.date)} &nbsp;·&nbsp; ${post.location} &nbsp;·&nbsp; ${mins} min read</div>
      </div>
    </div>
    <article class="post i18n-ml">
      <div class="byline">
        <div class="avatar" style="background-image:url('pyramids-web.jpg')"></div>
        <div class="who">Jeff<small>Never Roam Alone</small></div>
      </div>
      ${post.body.map(render).join("\n")}
    </article>
    <div class="post-foot"><a class="back" href="blog.html">&larr; Back to all stories</a></div>`;
} else {
  document.title = "Coming soon — Never Roam Alone";
  content.innerHTML = `
    <div class="soon">
      <h1>This story is still being written</h1>
      <p>That post hasn't been published yet — check back soon, or explore the ones that are ready.</p>
      <p style="margin-top:26px"><a class="back" href="blog.html">&larr; Back to all stories</a></p>
    </div>`;
}
</script>
<script src="nra-config.js"></script>
<script src="auth.js"></script>
<script src="nav.js"></script>
<script src="i18n.js"></script>
</body>
</html>
